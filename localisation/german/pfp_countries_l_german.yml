  ## PFP MERGER DECISIONS ##
  pfp_merge_canada:0 "Kanada vereinen"
  pfp_merge_canada_desc:0 "Ein einziges Dominion erstreckte sich einst über die nördliche Hälfte des Kontinents von den Atlantikküsten bis zu den westlichen Prärien, geeint durch die transkontinentale Eisenbahn und ein gemeinsames koloniales Erbe. Die Entfernung zwischen Halifax und Vancouver ist gewaltig, doch die Bande des Rechts, der Sprache und der Geschichte reichen tiefer als jede vorübergehende Teilung."

  pfp_merge_canada_quebec:0 "Québec in Kanada eingliedern"
  pfp_merge_canada_quebec_desc:0 "Das frankophone Kernland an den Ufern des Sankt-Lorenz-Stroms bewahrt seit drei Jahrhunderten seine Sprache und eigenständige Kultur — lang genug, um den Namen la belle province zu verdienen. Mit dem vereinten Kanada ist es an der Zeit, es in die Nation einzugliedern; seine Flüsse, seine Städte und seine Menschen gehören zum Land, das sie umgibt."
