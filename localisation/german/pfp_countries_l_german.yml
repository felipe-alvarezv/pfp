  pfp_merge_arabia:0 "Arabien vereinen"
  pfp_merge_arabia_desc:0 "Von den Wüsten des Nadschd bis zu den Küsten Omans war die Arabische Halbinsel seit jeher ein Knotenpunkt des Glaubens und des Handels. Die Städte Mekka und Medina verankern eine Zivilisation, die älter ist als jede andere; die Weihrauchstraßen Dhofars definierten einst den Handel der antiken Welt. Als Arabien vereint, können diese Königreiche ihren Platz im Herzen der Zivilisation zurückgewinnen."
  pfp_merge_arabia_not_yet_formed_tt:0 "Arabien wurde noch nicht vereint.\n"
  pfp_merge_arabia_puppets_ready_tt:0 "§YSaudi Arabia§!, §YYemen§!, §YOman§!:\n"
  pfp_merge_arabia_effect_form:0 "§YArabien§! entsteht durch die Vereinigung von §YSaudi Arabia§!, §YYemen§!, und §YOman§!.\n"
  pfp_merge_arabia_effect_annex:0 "§YArabien§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_arabia_effect_cores:0 "§YArabien§! gewinnt die Kerngebiete und Ansprüche der annektierten Marionetten.\n"

  pfp_merge_korea:0 "Korea vereinen"
  pfp_merge_korea_desc:0 "Durch Krieg und Ideologie gespalten, litt die koreanische Halbinsel lange unter fremdem Einfluss und inneren Konflikten. Von den Reisfeldern des Südens bis zu den Bergen des Nordens teilen die Koreaner eine einzige Sprache, eine einzige Kultur und eine einzige Geschichte. Die Zeit ist gekommen, die Spaltungen der Gegenwart hinter sich zu lassen und die Einheit der Vergangenheit zurückzugewinnen."
  pfp_merge_korea_not_yet_formed_tt:0 "Korea wurde noch nicht vereint.\n"
  pfp_merge_korea_puppets_ready_tt:0 "§YNordkorea§! und §YSüdkorea§!:\n"
  pfp_merge_korea_effect_form:0 "§YKorea§! entsteht durch die Vereinigung von §YNordkorea§! und §YSüdkorea§!.\n"
  pfp_merge_korea_effect_annex:0 "§YKorea§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_korea_effect_cores:0 "§YKorea§! erhält die Kernansprüche des annektierten Vasallen.\n"

  pfp_merge_guiana:0 "Guayana vereinen"
  pfp_merge_guiana_desc:0 "Drei Kolonien dreier Imperien, die Guayanas teilen eine gemeinsame Geographie, ein gemeinsames Klima und ein gemeinsames Schicksal. Von den Dschungeln des Innenlandes bis zu den Flüssen, die in den Atlantik münden, haben diese Territorien mehr gemeinsam miteinander als mit den fernen Hauptstädten, die sie regieren. Als Guayana vereint, können sie eine neue Identität aus dem gemeinsamen Land schmieden."
  pfp_merge_guiana_not_yet_formed_tt:0 "Guayana wurde noch nicht vereint.\n"
  pfp_merge_guiana_puppets_ready_tt:0 "§YGuyana§!, §YSuriname§! und §YGuayana§!:\n"
  pfp_merge_guiana_effect_form:0 "§YGuayana§! entsteht durch die Vereinigung von §YGuyana§!, §YSuriname§!, und §YGuayana§!.\n"
  pfp_merge_guiana_effect_annex:0 "§YGuayana§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_guiana_effect_cores:0 "§YGuayana§! erhält die Kernansprüche der annektierten Vasallen.\n"

