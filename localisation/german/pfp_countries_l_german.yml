  pfp_merge_canada_effect_form:0 "§YKanada§! entsteht durch die Vereinigung von §YEastern Canada§! und §YWestern Canada§!.\n"
  pfp_merge_canada_effect_annex:0 "§YKanada§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_canada_effect_cores:0 "§YKanada§! erhält die Kerngebiete und Ansprüche der annektierten Marionettenstaaten.\n"
  pfp_merge_canada_is_formed_tt:0 "Ein vereintes Kanada existiert unter unseren Marionettenstaaten.\n"
  pfp_merge_canada_quebec_not_yet_absorbed_tt:0 "Québec wurde noch nicht in Kanada eingegliedert.\n"
  pfp_merge_canada_quebec_effect_annex:0 "§YKanada§! annektiert §YQuébec§! und erhält dessen Kerngebiete und kernfähige Gebiete.\n"

  # United States
  pfp_merge_western_usa:0 "Die westlichen Vereinigten Staaten vereinen"
  pfp_merge_western_usa_desc:0 "Die Pazifikküste und die Rocky Mountains waren stets der wilde, ungezähmte Westrand des amerikanischen Experiments — von den sonnenbeschienenen Küsten Kaliforniens bis zu den schneebedeckten Gipfeln der Kaskaden. Bevor der Kontinent wiedervereinigt werden kann, muss der Westen zuerst mit einer Stimme sprechen."
  pfp_merge_western_usa_not_yet_formed_tt:0 "Die westlichen Vereinigten Staaten wurden noch nicht vereint.\n"
  pfp_merge_western_usa_effect_form:0 "§YWestliche Vereinigte Staaten§! entsteht durch die Vereinigung von §YUSA Pazifik§! und §YUSA Rocky Mountains§!.\n"
  pfp_merge_western_usa_effect_annex:0 "§YWestliche Vereinigte Staaten§! annektieren alle zuvor aufgeführten Vasallen und erhalten deren Truppen.\n"
  pfp_merge_western_usa_effect_cores:0 "§YWestliche Vereinigte Staaten§! gewinnen die Kerngebiete und Ansprüche der annektierten Marionetten.\n"

  pfp_merge_usa:0 "Die östlichen Vereinigten Staaten vereinen"
  pfp_merge_usa_desc:0 "Von den Fabriken und Häfen des Nordostens bis zu den Feldern und Städten des Südens und dem großen industriellen Herzland des Mittleren Westens — diese drei Regionen waren die Pfeiler der mächtigsten Nation, die die Welt je gesehen hat. Die Union wurde einst zu enormen Kosten erhalten; sie kann wieder aufgebaut werden."
  pfp_merge_usa_not_yet_formed_tt:0 "Die Vereinigten Staaten wurden noch nicht vereint.\n"
  pfp_merge_usa_effect_form:0 "§YÖstliche USA§! entsteht durch die Vereinigung von §YNortheastern U.S.§!, §YMidwestern U.S.§!, und §YSouthern U.S.§!.\n"
  pfp_merge_usa_effect_annex:0 "§YÖstliche USA§! annektieren alle zuvor aufgeführten Vasallen und erhalten deren Truppen.\n"
  pfp_merge_usa_effect_cores:0 "§YÖstliche USA§! erhalten die Kerngebiete und Ansprüche der annektierten Marionettenstaaten.\n"

  pfp_merge_western_usa_is_formed_tt:0 "Die westlichen Vereinigten Staaten wurden geformt.\n"
  pfp_merge_eastern_usa_is_formed_tt:0 "Die östlichen Vereinigten Staaten wurden geformt.\n"

  pfp_merge_united_states:0 "Die Vereinigten Staaten einigen"
  pfp_merge_united_states_desc:0 "Von den sonnenverbrannten Wüsten des Südwestens bis zu den Industriekorridoren des Nordostens, von den goldenen Feldern des Mittleren Westens bis zu den Bayous des tiefen Südens — Amerika war nie nur eine Region, sondern alle zusammen. Ost und West haben jeweils ihre Stärke bewiesen. Nun müssen sie beweisen, dass sie eine Nation sind."
  pfp_merge_united_states_not_yet_formed_tt:0 "Die Vereinigten Staaten wurden noch nicht vereint.\n"
  pfp_merge_united_states_effect_form:0 "§YVereinigte Staaten§! entsteht durch die Vereinigung von §YWestliche Vereinigte Staaten§! und §YÖstliche USA§!.\n"
  pfp_merge_united_states_effect_annex:0 "§YVereinigte Staaten§! annektieren alle zuvor aufgeführten Vasallen und erhalten deren Truppen.\n"
  pfp_merge_united_states_effect_cores:0 "§YVereinigte Staaten§! gewinnen die Kerngebiete und Ansprüche der annektierten Marionetten.\n"



  # China
  pfp_merge_china:0 "China vereinen"
  pfp_merge_china_desc:0 "Seit mehr als zweitausend Jahren antworteten die Provinzen des Reichs der Mitte einem einzigen Hof, gebunden durch das Mandat des Himmels und die konfuzianische Ordnung, die jede Dynastie überdauerte. Jede trägt die Erinnerung an ein vereintes China — die Zersplitterung war eine Katastrophe, kein Schicksal."
  pfp_merge_china_not_yet_formed_tt:0 "China wurde noch nicht vereint.\n"
  pfp_merge_china_effect_form:0 "§YChina§! entsteht durch die Vereinigung von §YZhili§!, §YShandong§!, §YHenan§!, §YShanxi§!, §YLiangjiang§!, §YMin-Zhe§!, §YHuguang§!, §YLiangguang§!, §YYun-Gui§!, und §YSichuan§!.\n"
  pfp_merge_china_effect_annex:0 "§YChina§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_china_effect_cores:0 "§YChina§! erhält die Kerngebiete und Ansprüche der annektierten Marionettenstaaten.\n"

  pfp_merge_china_manchuria:0 "Die Mandschurei in China eingliedern"
  pfp_merge_china_manchuria_desc:0 "Die angestammte Heimat der Qing-Dynastie und das industrielle Kraftwerk des nordöstlichen Chinas, ausgebaut zu einer Region der Schwerindustrie und Eisenbahnen. Seine Kohle und sein Eisen haben dazu beigetragen, die moderne Welt anzutreiben; nun werden sie Chinas Wiederherstellung antreiben."
  pfp_merge_china_is_formed_tt:0 "Ein vereintes China existiert unter unseren Marionettenstaaten.\n"
  pfp_merge_china_manchuria_not_yet_absorbed_tt:0 "Die Mandschurei wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_manchuria_effect_annex:0 "§YChina§! annektiert §YDie Mandschurei§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_china_inner_mongolia:0 "Die Innere Mongolei in China eingliedern"
  pfp_merge_china_inner_mongolia_desc:0 "Die Steppen an Chinas nördlicher Grenze haben seit der Zeit der Xiongnu die Grenze zwischen dem besiedelten Ackerland und der nomadischen Steppe markiert — eine so umstrittene Grenze, dass sie die Chinesische Mauer inspirierte. Seine Eingliederung dehnt die chinesische Autorität über den südlichen Rand des mongolischen Plateaus aus und sichert die Zugänge nach Peking."
  pfp_merge_china_inner_mongolia_not_yet_absorbed_tt:0 "Die Innere Mongolei wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_inner_mongolia_effect_annex:0 "§YChina§! annektiert §YDie Innere Mongolei§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_china_shaan_gan:0 "Shaan-Gan in China eingliedern"
  pfp_merge_china_shaan_gan_desc:0 "Dieses Gebiet birgt den großen Bogen des Gelben Flusses und die alte Hauptstadt Chang'an — heute Xian — wo vierzehn Kaiserdynastien am Knotenpunkt der Seidenstraße Hof hielten. Das Herz Chinas seit dreitausend Jahren; seine Rückkehr vervollständigt unsere Kontrolle über den Nordwesten."
  pfp_merge_china_shaan_gan_not_yet_absorbed_tt:0 "Shaan-Gan wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_shaan_gan_effect_annex:0 "§YChina§! annektiert §YShaan-Gan§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_china_qinghai:0 "Qinghai in China eingliedern"
  pfp_merge_china_qinghai_desc:0 "Hoch am nordöstlichen Rand des Tibetischen Plateaus birgt dieses Gebiet die Quellen des Gelben Flusses und des Jangtsekiangs — die beiden Lebensadern der chinesischen Zivilisation. Seine Eingliederung verankert Chinas westliches Inneres und schließt das geografische Tor nach Tibet."
  pfp_merge_china_qinghai_not_yet_absorbed_tt:0 "Qinghai wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_qinghai_effect_annex:0 "§YChina§! annektiert §YQinghai§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_china_taiwan:0 "Taiwan in China eingliedern"
  pfp_merge_china_taiwan_desc:0 "Diese Insel liegt jenseits einer Meerenge, die schmal genug ist, um das Festland bei klarem Wetter zu sehen. Sie wechselte die Hände, hörte aber nie auf, mit dem Schicksal des Festlands verflochten zu sein; die Zeit ist gekommen, sie wieder in die Nation zu integrieren."
  pfp_merge_china_taiwan_not_yet_absorbed_tt:0 "Taiwan wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_taiwan_effect_annex:0 "§YChina§! annektiert §YTaiwan§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_china_east_turkestan:0 "Ostturkestan in China eingliedern"
  pfp_merge_china_east_turkestan_desc:0 "Die Wüstenbecken und Oasenstädte des fernen Westens waren der Ort, wo die alte Seidenstraße Seide nach Westen und Ideen nach Osten trug. Seine weiten Steppen und Bodenschätze machen es strategisch unverzichtbar; seine Eingliederung vervollständigt Chinas zentralasiatische Grenze."
  pfp_merge_china_east_turkestan_not_yet_absorbed_tt:0 "Ostturkestan wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_east_turkestan_requires_border_tt:0 "Tibet, Qinghai oder Shaan-Gan muss zuerst in China eingegliedert werden.\n"
  pfp_merge_china_east_turkestan_effect_annex:0 "§YChina§! annektiert §YOstturkestan§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_china_tibet:0 "Tibet in China eingliedern"
  pfp_merge_china_tibet_desc:0 "Das Dach der Welt — ein Plateau so hoch, dass Armeen die Höhe spüren, bevor sie den Feind spüren. Die Flüsse, die von seinen Gletschern herabsteigen, bewässern die Hälfte Asiens. Es unter konsolidierte Kontrolle zu bringen, sichert unsere gesamte Südwestgrenze."
  pfp_merge_china_tibet_not_yet_absorbed_tt:0 "Tibet wurde noch nicht in China eingegliedert.\n"
  pfp_merge_china_tibet_effect_annex:0 "§YChina§! annektiert §YTibet§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  # East Africa
  pfp_merge_east_africa:0 "Ostafrika vereinen"
  pfp_merge_east_africa_desc:0 "Von den Quellen des Nils in Sudan und Uganda bis zur somalischen Küste und von den äthiopischen Hochländern, die allein der Kolonisierung widerstanden, bis zu den großen Savannenebenen Tanganjikas umfasst Ostafrika die gesamte Ausdehnung des östlichen Korridors des Kontinents. Diese Länder teilen die Gewässer des Nilbeckens, den Monsunhandel des Indischen Ozeans und eine Geschichte, die von denselben Hochlandkönigreichen, Küstenstädten und Rift-Valley-Zivilisationen geprägt wurde. Durch Kolonialgrenzen in Fragmente aufgeteilt, würde ihre Vereinigung die dominierende Macht des gesamten östlichen Gesichts Afrikas schmieden."
  pfp_merge_east_africa_not_yet_formed_tt:0 "Ostafrika wurde noch nicht vereint.\n"
  pfp_merge_east_africa_effect_form:0 "§YOstafrika§! entsteht durch die Vereinigung von §YEthiopia§!, §YEritrea§!, §YDjibouti§!, §YSomaliland§!, §YSomalia§!, §YKenya§!, §YUganda§!, §YTanganyika§!, und §YSudan§!.\n"
  pfp_merge_east_africa_effect_annex:0 "§YOstafrika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_east_africa_effect_cores:0 "§YOstafrika§! erhält die Kerngebiete und Ansprüche der annektierten Marionettenstaaten.\n"
  pfp_merge_east_africa_is_formed_tt:0 "Ein vereintes Ostafrika existiert unter unseren Marionettenstaaten.\n"














  pfp_merge_east_africa_ruanda_urundi:0 "Ruanda-Urundi in Ostafrika eingliedern"
  pfp_merge_east_africa_ruanda_urundi_desc:0 "Im Hochland über dem Kongobecken gelegen, ist dies eines der am dichtesten besiedelten Gebiete Afrikas — klein an Fläche, aber bedeutsam in der Geografie, eingeklemmt zwischen den Großen Seen und dem Steilhang des Grabenbruchs. Seine Eingliederung schließt die Lücke in unserer zentralafrikanischen Grenze."
  pfp_merge_east_africa_ruanda_urundi_not_yet_absorbed_tt:0 "Ruanda-Urundi wurde noch nicht in Ostafrika eingegliedert.\n"
  pfp_merge_east_africa_ruanda_urundi_effect_annex:0 "§YOstafrika§! annektiert §YRuanda-Urundi§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"





  pfp_merge_north_africa:0 "Nordafrika vereinen"
  pfp_merge_north_africa_desc:0 "Von den Atlas-Bergen Marokkos bis zu den Ufern des Nils war die nordafrikanische Küste vier Jahrtausende lang das Kreuzungszentrum der mediterranen Zivilisation. Einst unter Rom und den großen islamischen Kalifaten vereint, teilen der Maghreb und das Niltal ein gemeinsames Erbe, das Kolonialgrenzen lange getrennt haben. Ihre Vereinigung würde eine Macht schmieden, die in der Lage ist, die gesamte Mittelmeerwelt neu zu gestalten."
  pfp_merge_north_africa_not_yet_formed_tt:0 "Nordafrika wurde noch nicht vereint.\n"
  pfp_merge_north_africa_effect_form:0 "§YNordafrika§! entsteht durch die Vereinigung von §YMorocco§!, §YAlgeria§!, §YTunisia§!, §YLibya§!, und §YEgypt§!.\n"
  pfp_merge_north_africa_effect_annex:0 "§YNordafrika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_north_africa_effect_cores:0 "§YNordafrika§! erhält die Kernansprüche der annektierten Marionetten.\n"
  pfp_merge_north_africa_is_formed_tt:0 "Ein vereintes Nordafrika existiert unter unseren Marionetten.\n"











  pfp_merge_north_africa_western_sahara:0 "Westsahara in Nordafrika eingliedern"
  pfp_merge_north_africa_western_sahara_desc:0 "Dieses weite, dünn besiedelte Gebiet erstreckt sich von der Atlantikküste in die Sahara und bewacht die westlichen Zugänge zum Maghreb. Seine Eingliederung verankert Nordafrikas Atlantikflanke und sichert die südliche Wüstengrenze."
  pfp_merge_north_africa_western_sahara_not_yet_absorbed_tt:0 "Die Westsahara wurde noch nicht in Nordafrika eingegliedert.\n"
  pfp_merge_north_africa_western_sahara_effect_annex:0 "§YNordafrika§! annektiert §YWestsahara§! und gewinnt seine Kerne und eingliederbaren Gebiete.\n"

  pfp_merge_north_africa_rif:0 "Das Rif in Nordafrika eingliedern"
  pfp_merge_north_africa_rif_desc:0 "Gedrückt an die Mittelmeerküste Nordmarokkos, boten die Rifberge einer kurzen und heftigen Republik Zuflucht, die sowohl Spanien als auch Frankreich trotz bevor sie 1926 niedergeschlagen wurde. Ihre Berberstämme haben die Fremdherrschaft nie vollständig akzeptiert. Das Rif in Nordafrika einzugliedern ist ebenso sehr ein Akt der Versöhnung wie der Eroberung."
  pfp_merge_north_africa_rif_not_yet_absorbed_tt:0 "Das Rif wurde noch nicht in Nordafrika eingegliedert.\n"
  pfp_merge_north_africa_rif_effect_annex:0 "§YNordafrika§! annektiert §YDas Rif§! und gewinnt seine Kerne und eingliederbaren Gebiete.\n"

  pfp_merge_west_africa:0 "Westafrika formen"
  pfp_merge_west_africa_desc:0 "Von den Sahelgebieten Mauretaniens und Malis bis zu den tropischen Wäldern der Goldküste und des Nigerdeltas umfasst Westafrika das Herzland der alten Sahel-Reiche. Die Königreiche Mali, Songhai und Ghana beherrschten einst die transsaharischen Handelsrouten, die das Mittelmeer mit dem subsaharischen Afrika verbanden. Durch Kolonialgrenzen in ein Dutzend Fragmente verstreut, teilen diese Länder tiefe Bindungen der Kultur, Religion und Geschichte. Ihre Vereinigung würde eine Großmacht an der Atlantikküste Afrikas wiederherstellen."
  pfp_merge_west_africa_not_yet_formed_tt:0 "Westafrika wurde noch nicht vereint.\n"
  pfp_merge_west_africa_effect_form:0 "§YWestafrika§! entsteht durch die Vereinigung von §YNiger§!, §YMali§!, §YNigeria§!, §YTogo§!, §YDahomey§!, §YGold Coast§!, §YUpper Volta§!, §YIvory Coast§!, §YGuinea§!, §YSierra Leone§!, §YSenegal§!, §YGambia§!, und §YMauritania§!.\n"
  pfp_merge_west_africa_effect_annex:0 "§YWestafrika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_west_africa_effect_cores:0 "Alle Kerne und eingliederbaren Gebiete werden auf §YWestafrika§! übertragen.\n"
  pfp_merge_west_africa_is_formed_tt:0 "Westafrika wurde geformt.\n"
  pfp_merge_west_africa_guinea_bissau:0 "Guinea-Bissau in Westafrika eingliedern"
  pfp_merge_west_africa_guinea_bissau_desc:0 "Ein Küstenstreifen und Hinterland, herausgeschnitten aus dem senegambischen Hinterland, war Guinea-Bissau jahrhundertelang eine Zwischenstation des portugiesischen Sklavenhandels, bevor es zu einem vergessenen Hinterland der Kolonialzeit wurde. Seine Völker teilen Sprache und Kultur mit ihren Nachbarn jenseits jeder Grenze. Die Eingliederung in Westafrika würde den Küstenrand des neuen Staates vervollständigen."
  pfp_merge_west_africa_guinea_bissau_not_yet_absorbed_tt:0 "Guinea-Bissau wurde noch nicht in Westafrika eingegliedert.\n"
  pfp_merge_west_africa_guinea_bissau_effect_annex:0 "§YWestafrika§! annektiert §YGuinea-Bissau§! und gewinnt seine Kerne und eingliederbaren Gebiete.\n"
  pfp_merge_west_africa_liberia:0 "Liberia in Westafrika eingliedern"
  pfp_merge_west_africa_liberia_desc:0 "Im 19. Jahrhundert als Zufluchtsort für befreite amerikanische Sklaven gegründet, hebt sich Liberia von jeder anderen Nation an der westafrikanischen Küste ab — nominell unabhängig, während die Kolonialmächte den Rest der Region unter sich aufteilten. Seine ameriko-liberianische Herrschaftsklasse hat eine fragile Souveränität zwischen den großen europäischen Imperien aufrechterhalten. In der sich abzeichnenden neuen Ordnung würde die Eingliederung in ein vereintes Westafrika es endlich in seinem afrikanischen Umfeld verankern."
  pfp_merge_west_africa_liberia_not_yet_absorbed_tt:0 "Liberia wurde noch nicht in Westafrika eingegliedert.\n"
  pfp_merge_west_africa_liberia_effect_annex:0 "§YWestafrika§! annektiert §YLiberia§! und gewinnt seine Kerne und eingliederbaren Gebiete.\n"
  pfp_merge_west_africa_cape_verde:0 "Kap Verde in Westafrika eingliedern"
  pfp_merge_west_africa_cape_verde_desc:0 "Die Kapverdischen Inseln, verstreut im Atlantik etwa fünfhundert Kilometer vor der senegalesischen Küste, waren ein unbewohntes Vulkanarchipel, als portugiesische Seeleute im 15. Jahrhundert dort landeten. Sie wurden zu einer wichtigen Zwischenstation des Atlantikhandels, der Europa, Afrika und Amerika verband. Weit vom Festland entfernt, würde ihre Integration in Westafrika die Reichweite des neuen Staates über die Gewässer hinaus ausdehnen."
  pfp_merge_west_africa_cape_verde_not_yet_absorbed_tt:0 "Kap Verde wurde noch nicht in Westafrika eingegliedert.\n"
  pfp_merge_west_africa_cape_verde_effect_annex:0 "§YWestafrika§! annektiert §YKap Verde§! und gewinnt seine Kerne und eingliederbaren Gebiete.\n"
  pfp_merge_eastern_russia:0 "Eastern Russia formen"
  pfp_merge_france:0 "Frankreich einigen"
  pfp_merge_france_alps:0 "the French Alps in France eingliedern"
  pfp_merge_germany:0 "Deutschland einigen"
  pfp_merge_germany_konigsberg:0 "Königsberg in Germany eingliedern"
  pfp_merge_great_britain:0 "Großbritannien einigen"
  pfp_merge_great_britain_northern_ireland:0 "Northern Ireland in Great Britain eingliedern"
  pfp_merge_iberia:0 "Iberien einigen"
  pfp_merge_italy:0 "Italien einigen"
  pfp_merge_italy_sardinia:0 "Sardinia in Italy eingliedern"
  pfp_merge_japan:0 "Japan einigen"
  pfp_merge_russia:0 "Russia formen"
  pfp_merge_western_russia:0 "Western Russia formen"
  pfp_merge_western_russia_karelia:0 "Karelia in Western Russia eingliedern"
  pfp_merge_western_russia_murmansk:0 "Murmansk in Western Russia eingliedern"
  pfp_merge_western_russia_northern_caucasus:0 "Northern Caucasus in Western Russia eingliedern"
  pfp_merge_yugoslavia:0 "Jugoslawien einigen"
  pfp_merge_yugoslavia_macedonia:0 "Macedonia in Yugoslavia eingliedern"
  pfp_merge_yugoslavia_montenegro:0 "Montenegro in Yugoslavia eingliedern"
  pfp_merge_eastern_russia_desc:0 "Jenseits des Uralgebirges liegt die größte zusammenhängende Landmasse der Welt, die sich von der Bergachse Asiens bis nach Wladiwostok an der Pazifikküste erstreckt. Die Transsibirische Eisenbahn wurde gebaut, um diese Weite regierbar zu machen; nun wird sie diese Territorien unter einer Autorität zusammenbinden."
  pfp_merge_france_alps_desc:0 "Eine natürliche Festung an Frankreichs südöstlicher Grenze — die Gipfel und Pässe, die das Rhônetal von der Poebene trennen, wurden umstritten, seit Hannibal seine Elefanten hindurchführte. Ihre Eingliederung vervollständigt Frankreichs Alpengrenze und schließt die Zugänge aus Italien."
  pfp_merge_france_desc:0 "Liberté, égalité, fraternité — die Ideale der Republik gehören keiner einzelnen Region; sie gehören ganz Frankreich. Der industrielle Norden, gezeichnet von zwei großen auf seinem Boden ausgetragenen Kriegen, und der sonnenwarme Süden mit Wurzeln, die bis ins römische Gallien zurückreichen, sind zwei Hälften einer Zivilisation. Die Trikolore wehte über beiden; sie wird es wieder."
  pfp_merge_germany_desc:0 "Bismarck schmiedete die deutsche Nation durch Eisen und Blut — es bedurfte zweier katastrophaler Kriege, um sie erneut zu zerbrechen. Ob entlang des Rheins, der Elbe oder älterer Hohenzollern-Grenzen geteilt, teilen die deutschen Lande eine Sprache, eine Kultur und ein Jahrtausend verflochtener Geschichte bis zum Heiligen Römischen Reich."
  pfp_merge_germany_konigsberg_desc:0 "Die alte Hauptstadt Preußens — wo die Hohenzollern zu Königen gekrönt wurden und Immanuel Kant sein ganzes Leben verbrachte, ohne es je zu verlassen. Von den Deutschordensrittern im dreizehnten Jahrhundert erbaut, gehört diese baltische Bernstein-Handelsfestung keiner anderen Nation als Deutschland."
  pfp_merge_great_britain_desc:0 "Drei Nationen, die sich eine Insel teilen, sind seit den Unionsgesetzen durch eine Krone verbunden, doch die Bande zwischen ihnen reichen tiefer als jedes königliche Dekret. Von den Kohlentälern des südlichen Wales bis zu den Werften des Clyde und den Fabriken der Midlands haben diese Völker gemeinsam ein Imperium aufgebaut. Es ist Zeit, die Union wiederzuaufbauen, auf der dieses Imperium errichtet wurde."
  pfp_merge_great_britain_northern_ireland_desc:0 "Die dauerhafteste politische Frage Großbritanniens — ein Zipfel Irlands, der sich entschied, unter der Krone zu bleiben, die Insel zu spalten und Nachbarn gegen Nachbarn über Generationen aufzubringen. Was auch immer seine turbulente Geschichte, seine Position am North Channel macht es strategisch untrennbar vom britischen Festland."
  pfp_merge_iberia_desc:0 "Die Königreiche, die das Zeitalter der Entdeckungen von derselben sonnenverbrannten Halbinsel aus starteten, teilten die Welt zwischen sich in Tordesillas auf. Ihre jahrhundertealte Rivalität ist real, aber ebenso ihre Verwandtschaft — dieselben Römerstraßen verbinden Lissabon mit Madrid, dieselben Atlantikwinde formten beide Kronen. Als Iberien vereint können sie das Prestige der alten iberischen Welt erneut ausstrahlen."
  pfp_merge_italy_desc:0 "Seit Dante von einem Italien schrieb und Machiavelli von einem Fürsten träumte, der es einen könnte, widersteht die Halbinsel der Vereinigung. Die zerstreuten Erben der römischen Zivilisation — jeder stolz auf seine eigene Vergangenheit, aber jeder unvollständig ohne die anderen — haben lang genug gewartet. Das Risorgimento war nur der erste Versuch; nun kann er vollendet werden."
  pfp_merge_italy_sardinia_desc:0 "Diese Insel wechselte die Hände zwischen Aragoniern, Savoyern und Habsburgern, bevor sie zum nominellen Sitz des Hauses Savoyen wurde — der Dynastie, die Italien schließlich einte. Ihr raues Inneres und ihre Küstenpositionen machen sie zum westlichen Anker von Italiens Kontrolle über das Tyrrhenische Meer."
  pfp_merge_japan_desc:0 "Die heiligen Heimatinseln bilden seit der Zeit der alten Kaiser eine einzige Nation. Ihre Teilung ist eine Aberration, eine Wunde, die einem Volk zugefügt wurde, das durch Einheit definiert wird. Die Wiederherstellung der Heimatinseln ist nicht nur ein politischer Akt — es ist die Erfüllung des Kokutai, des nationalen Wesens selbst."
  pfp_merge_russia_desc:0 "Zwei Hälften eines Kolosses, künstlich getrennt durch dieselbe Katastrophe, die den Staat zerschmetterte. Von der Ostseeküste bis zum Pazifik, von der arktischen Tundra bis zu den Ausläufern des Kaukasus — die russischen Lande gehören zusammen. Der Bär hat durchgehalten. Russland ist wieder ganz."
  pfp_merge_western_russia_desc:0 "Die großen Flüsse der westlichen Ebene — Wolga, Don, Dnjepr — waren stets die Lebensadern der russischen Zivilisation, die Länder zusammenbindend, die seit dem Zeitalter der Zaren einer einzigen Autorität gehorchten. Diese Territorien waren niemals wirklich getrennte Nationen; sie waren Fragmente eines zerbrochenen Ganzen."
  pfp_merge_western_russia_karelia_desc:0 "Ein Land mit zehntausend Seen und dichtem Wald, diese Grenzregion ist dort, wo Russland und seine nordischen Nachbarn seit Jahrhunderten um die Kontrolle ringen. Seine Wälder und Wasserwege gehören zu den am härtesten verteidigten Geländen auf dem Kontinent; nun fallen sie unter einheitliche russische Autorität und sichern die nordwestlichen Zugänge nach Leningrad."
  pfp_merge_western_russia_murmansk_desc:0 "Russlands einziger eisfreier Arktikhafen, das ganze Jahr über schiffbar gehalten durch den Ausläufer des Golfstroms, der bis zu diesem Breitengrad reicht. Wer diesen Hafen hält, hält das Arktikportal — und die Konvoi-Route, die in jedem Konflikt, der Russland von Norden her auf die Probe stellte, ihren strategischen Wert bewiesen hat."
  pfp_merge_western_russia_northern_caucasus_desc:0 "Die rastlose Grenze russischer Expansion seit Jermolows brutalen Feldzügen — eine Region stolzer Bergvölker, die Unterwerfung nie leicht hingenommen haben. Doch seine Ölfelder und seine Position, die die Landbrücke zwischen dem Schwarzen Meer und dem Kaspischen Meer beherrscht, machen es zu einem strategisch zu wichtigen Gebiet, um es außerhalb unserer Kontrolle zu lassen."
  pfp_merge_yugoslavia_desc:0 "Aus den Trümmern der osmanischen und habsburgischen Reiche geschnitzt, wurden die südslawischen Völker — Južni Slaveni — lange als Träumer abgetan, die glaubten, diese Länder könnten eins sein. Nun ist der Traum zum Greifen nah. Brüderlichkeit und Einheit — bratstvo i jedinstvo — werden mehr als eine Parole sein."
  pfp_merge_yugoslavia_macedonia_desc:0 "Wo Alexander der Große ein Imperium aufbaute und wo jede Balkammacht seither einen Preis gesehen hat, der es wert war, dafür zu kämpfen. Seine Position am Kreuzungspunkt der Halbinsel — wo griechische, bulgarische, serbische und türkische Ambitionen seit Generationen aufeinandertrafen — macht es zum Schlüssel zur Beherrschung des südlichen Balkans."
  pfp_merge_yugoslavia_montenegro_desc:0 "Ein Land der schwarzen Berge und wilden Krieger — ein Königreich, das fünf Jahrhunderten osmanischen Drucks durch Gelände und Beharrlichkeit allein widerstand. Ihre langjährige Verbundenheit mit den anderen südslawischen Völkern macht ihre Eingliederung nicht zu einer Eroberung, sondern zu einer Heimkehr."
