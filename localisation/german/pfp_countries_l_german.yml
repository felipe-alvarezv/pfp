  pfp_merge_central_africa:0 "Central Africa formen"
  pfp_merge_central_africa_cameroon:0 "Cameroon in Central Africa eingliedern"
  pfp_merge_central_africa_cameroon_desc:0 "Als Völkerbundsmandat nach dem Großen Krieg zwischen Frankreich und Großbritannien aufgeteilt, überbrückt Kamerun die Lücke zwischen West- und Zentralafrika. Seine Hochebenen führen hinunter zu einer fruchtbaren Küste, und seine Position am Ellenbogen Afrikas macht es zu einem natürlichen Bindeglied zwischen den atlantischen Gebieten im Westen und dem Kongobecken unten. Seine Eingliederung würde die nordwestliche Grenze Zentralafrikas schließen."
  pfp_merge_central_africa_cameroon_effect_annex:0 "§YZentralafrika§! annektiert §YCameroon§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_central_africa_cameroon_not_yet_absorbed_tt:0 "Kamerun wurde noch nicht eingegliedert.\n"
  pfp_merge_central_africa_chad:0 "Chad in Central Africa eingliedern"
  pfp_merge_central_africa_chad_desc:0 "Das nördlichste Gebiet Französisch-Äquatorialafrikas, Tschad, erstreckt sich von den Ausläufern der Sahara bis zu den Baumwollebenen des Südens. Der Tschadsee, sein großes Binnenmeer, ist seit tausend Jahren ein Kreuzungspunkt des Saharahandels. Seine Eingliederung würde Zentralafrikas nördliche Reichweite verankern und die Föderation vervollständigen, die Frankreich einst von Brazzaville aus verwaltete."
  pfp_merge_central_africa_chad_effect_annex:0 "§YZentralafrika§! annektiert §YChad§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_central_africa_chad_not_yet_absorbed_tt:0 "Tschad wurde noch nicht eingegliedert.\n"
  pfp_merge_central_africa_desc:0 "The Congo Basin is the heart of equatorial Africa — a vast river system draining one of the largest tropical rainforests on earth, rich in rubber, copper, and ivory beyond the reckoning of any contemporary power. The Belgian Congo, vast and largely unmapped, is a state unto itself. Around it, the forests and savannahs of the surrounding territories await unification into a single Central African state that would rank among the continent's great powers."
  pfp_merge_central_africa_effect_annex:0 "§YZentralafrika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_central_africa_equatorial_guinea:0 "Equatorial Guinea in Central Africa eingliedern"
  pfp_merge_central_africa_equatorial_guinea_desc:0 "Spaniens einziges Territorium auf dem afrikanischen Festland, Äquatorialguinea ist eine kleine Enklave, die zwischen Kamerun und Gabun eingeklemmt ist — ein kolonialer Überbleibsel mit wenig eigenem strategischem Gewicht, aber erheblichem Symbolwert. Seine Eingliederung würde die Küstenlinie Zentralafrikas vervollständigen und die letzte in Fremdbesitz befindliche Enklave in der Region beseitigen."
  pfp_merge_central_africa_equatorial_guinea_effect_annex:0 "§YZentralafrika§! annektiert §YEquatorial Guinea§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_central_africa_equatorial_guinea_not_yet_absorbed_tt:0 "Äquatorialguinea wurde noch nicht eingegliedert.\n"
  pfp_merge_central_africa_gabon:0 "Gabon in Central Africa eingliedern"
  pfp_merge_central_africa_gabon_desc:0 "Libreville — als Siedlung für befreite Sklaven in der Tradition von Freetown gegründet — verankert die Atlantikküste des äquatorialen Afrikas. Die dichten Wälder Gabuns wurden kaum berührt; was darunter liegt, beginnt erst jetzt verstanden zu werden. Seine Küstenlage und der Flusszugang würden Zentralafrika ein zweites Fenster zum Atlantik geben."
  pfp_merge_central_africa_gabon_effect_annex:0 "§YZentralafrika§! annektiert §YGabon§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_central_africa_gabon_not_yet_absorbed_tt:0 "Gabun wurde noch nicht eingegliedert.\n"
  pfp_merge_central_africa_is_formed_tt:0 "Ein vereintes Zentralafrika existiert unter unseren Marionettenstaaten.\n"
  pfp_merge_central_africa_not_yet_formed_tt:0 "Zentralafrika wurde noch nicht vereint.\n"
  pfp_merge_central_africa_puppets_ready_tt:0 "§YBelgian Congo§! and §YCongo-Brazzaville§!:\n"
  pfp_merge_central_africa_ubangi_shari:0 "Ubangi-Shari in Central Africa eingliedern"
  pfp_merge_central_africa_ubangi_shari_desc:0 "Benannt nach den zwei Flüssen, die es im Norden und Osten begrenzen, nimmt Ubangi-Shari das Plateau zwischen dem Kongobecken und dem Sahel ein. Es ist nach Kolonialstandards dünn verwaltet und spärlich besiedelt — ein Territorium, dessen wahrer Wert in seiner Position als innere Brücke zwischen Zentralafrika und den Territorien im Norden liegt."
  pfp_merge_central_africa_ubangi_shari_effect_annex:0 "§YZentralafrika§! annektiert §YUbangi-Shari§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_central_africa_ubangi_shari_not_yet_absorbed_tt:0 "Ubangi-Shari wurde noch nicht eingegliedert.\n"
  pfp_merge_central_africa_effect_form:0 "§YZentralafrika§! entsteht durch die Vereinigung von §YBelgian Congo§! und §YCongo-Brazzaville§!.\n"
  pfp_merge_central_africa_effect_cores:0 "§YZentralafrika§! erhält die Kerngebiete und Ansprüche der annektierten Marionetten.\n"
  pfp_merge_south_africa_puppets_ready_tt:0 "§YSüdafrika§!, §YSouth West Africa§!, §YAngola§!, §YBechuanaland§!, §YNorthern Rhodesia§!, §YSouthern Rhodesia§!, §YNyasaland§!, §YMozambique§!:\n"
  pfp_merge_south_africa:0 "South Africa schmieden"
  pfp_merge_south_africa_desc:0 "Von den windgepeitschten Atlantikküsten Angolas und Südwestafrikas bis zur Mosambikanischen Küste des Indischen Ozeans, und vom Sambesi-Tal bis zum Kap der Guten Hoffnung, umfasst das südliche Afrika die industriell am weitesten entwickelte und strategisch wichtigste Region des Kontinents. Unter seinen Böden liegen die weltgrößten Konzentrationen von Gold und Diamanten — der Reichtum, der europäische Mächte in ein Jahrhundert der Rivalität, des Krieges und des Eisenbahnbaus zog und den Transvaal zum wirtschaftlichen Herzland des Kontinents machte. Durch Kolonialgrenzen in britische, portugiesische und ehemalige deutsche Territorien aufgeteilt, teilen diese Länder eine gemeinsame Geografie großer Flüsse, Hochplateaus und Indischer Ozean-Küstenlinien. Ihre Vereinigung würde eine Macht schmieden, die sowohl den Atlantik als auch die Kaproute beherrscht — das südliche Tor zwischen den großen Ozeanen der Welt."
  pfp_merge_south_africa_not_yet_formed_tt:0 "Südafrika wurde noch nicht vereint.\n"
  pfp_merge_south_africa_effect_form:0 "§YSüdafrika§! entsteht durch die Vereinigung von §YSüdafrika§!, §YSouth West Africa§!, §YAngola§!, §YBechuanaland§!, §YNorthern Rhodesia§!, §YSouthern Rhodesia§!, §YNyasaland§!, und §YMozambique§!.\n"
  pfp_merge_south_africa_effect_annex:0 "§YSüdafrika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_south_africa_effect_cores:0 "§YSüdafrika§! erhält die Kerngebiete und Ansprüche der annektierten Marionetten.\n"
  pfp_merge_south_africa_is_formed_tt:0 "Südafrika wurde gegründet.\n"
  pfp_merge_south_africa_madagascar:0 "Madagascar in South Africa eingliedern"
  pfp_merge_south_africa_madagascar_desc:0 "Vom afrikanischen Festland durch den Mosambikkanal getrennt, ist Madagaskar die viertgrößte Insel der Welt und eine der biologisch charakteristischsten. Seine Häfen beherrschen die Seewege des westlichen Indischen Ozeans und die Zufahrten zum Mosambikkanal. Seine Eingliederung würde Südafrikas Reichweite auf die umliegenden Gewässer ausdehnen und die maritimen Zugänge zur Kaproute sichern."
  pfp_merge_south_africa_madagascar_not_yet_absorbed_tt:0 "Madagaskar wurde noch nicht in Südafrika eingegliedert.\n"
  pfp_merge_south_africa_madagascar_effect_annex:0 "§YSüdafrika§! annektiert §YMadagascar§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_scandinavia_puppets_ready_tt:0 "§YNorway§!, §YSweden§!, §YDenmark§!:\n"
  pfp_merge_scandinavia:0 "Scandinavia schmieden"
  pfp_merge_scandinavia_desc:0 "Von den Fjorden Norwegens bis zu den Erzfeldern Nordschwedes und den flachen Ebenen Dänemarks teilen die drei skandinavischen Königreiche ein gemeinsames Erbe, das bis in die Wikingerzeit zurückreicht — Seefahrer, Händler und Krieger, die einst die Küsten Europas vom Baltikum bis zum Atlantik beherrschten. In getrennte Kronen durch Jahrhunderte dynastischer Rivalität geteilt, sprechen diese Völker verwandte Sprachen, praktizieren dieselbe Tradition und haben mehr ihrer Geschichte miteinander verflochten als getrennt verbracht. Ihre Wiedervereinigung unter einem einzigen Banner würde die dominierende Macht der Nordmeere wiederherstellen."
  pfp_merge_scandinavia_not_yet_formed_tt:0 "Skandinavien wurde noch nicht vereint.\n"
  pfp_merge_scandinavia_effect_form:0 "§YSkandinavien§! entsteht durch die Vereinigung von §YNorway§!, §YSweden§!, und §YDenmark§!.\n"
  pfp_merge_scandinavia_effect_annex:0 "§YSkandinavien§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_scandinavia_effect_cores:0 "§YSkandinavien§! erhält die Kerngebiete und Ansprüche der annektierten Marionetten.\n"
  pfp_merge_scandinavia_is_formed_tt:0 "Skandinavien wurde gegründet.\n"
  pfp_merge_scandinavia_iceland:0 "Iceland in Scandinavia eingliedern"
  pfp_merge_scandinavia_iceland_desc:0 "Die ersten nordischen Siedler, die im neunten Jahrhundert auf Island landeten, fanden eine Insel aus Feuer und Eis am Rand der bekannten Welt — ein Land aus Vulkangipfeln, Gletschern und Geysiren, das nie menschliche Besiedlung gekannt hatte. Jahrhundertelang diente es als ferner Vorposten der skandinavischen Zivilisation, Heimat der Sagas, die die Erinnerung an das Wikingerzeitalter bewahrten. Seine Eingliederung würde Skandinaviens Reichweite in den Nordatlantik ausdehnen und die Seewege zwischen Europa und der weiteren Welt sichern."
  pfp_merge_scandinavia_iceland_not_yet_absorbed_tt:0 "Island wurde noch nicht in Skandinavien eingegliedert.\n"
  pfp_merge_scandinavia_iceland_effect_annex:0 "§YSkandinavien§! annektiert §YIceland§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"
  pfp_merge_scandinavia_greenland:0 "Greenland in Scandinavia eingliedern"
  pfp_merge_scandinavia_greenland_desc:0 "Erik der Rote nannte es Grönland, um Siedler anzulocken, und fünf Jahrhunderte lang schlugen sich nordische Kolonisten in seiner Südwestküste durch, bevor sie aus den historischen Aufzeichnungen verschwanden. Die weltgrößte Insel sitzt über den nördlichen Seewegen und birgt unter ihrem Eisschild Ressourcen, die das kommende Jahrhundert prägen könnten. Seine Eingliederung würde Skandinavien einen Brückenkopf an der Spitze der Welt geben."
  pfp_merge_scandinavia_greenland_not_yet_absorbed_tt:0 "Grönland wurde noch nicht in Skandinavien eingegliedert.\n"
  pfp_merge_scandinavia_greenland_effect_annex:0 "§YSkandinavien§! annektiert §YGreenland§! und erhält dessen Kerngebiete und annektierbare Territorien.\n"

  pfp_merge_baltic:0 "Die Baltischen Staaten vereinen"
  pfp_merge_baltic_desc:0 "Durch den Golf von Riga getrennt, aber durch Bernsteinküsten, lutherischen Glauben und Jahrhunderte gemeinsamer Unterwerfung verbunden, bilden Estland und Lettland das nördliche Herz der baltischen Welt. Beide Nationen erkämpften sich ihre Unabhängigkeit im Chaos der Nachkriegszeit, indem sie aus den Trümmern der russischen und deutschen Imperien Staatlichkeit formten. Ihre Union würde die nördliche Ostseeküste konsolidieren und den Grundstein für eine breitere Konföderation bis an die litauische Grenze legen."
  pfp_merge_baltic_not_yet_formed_tt:0 "Die Baltischen Staaten wurden noch nicht vereint.\n"
  pfp_merge_baltic_puppets_ready_tt:0 "§YEstland§!, §YLettland§!:\n"
  pfp_merge_baltic_effect_form:0 "§YBaltische Staaten§! entsteht durch die Vereinigung von §YEstland§! und §YLettland§!.\n"
  pfp_merge_baltic_effect_annex:0 "§YBaltische Staaten§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_baltic_effect_cores:0 "§YBaltische Staaten§! erhält die Kernansprüche der annektierten Satelliten.\n"
  pfp_merge_baltic_is_formed_tt:0 "Die Baltischen Staaten wurden geformt.\n"
  pfp_merge_baltic_lithuania:0 "Litauen in die Baltischen Staaten eingliedern"
  pfp_merge_baltic_lithuania_desc:0 "Litauen war das letzte heidnische Königreich Europas — ein mittelalterlicher Gigant, der sich einst unter den Jagiellonen von der Ostsee bis zum Schwarzen Meer erstreckte. Katholisch, wo seine nördlichen Nachbarn lutherisch sind, teilt es dennoch dieselbe Bernsteinküste, dieselbe geopolitische Verwundbarkeit und dieselbe hart erkämpfte Unabhängigkeit. Sein Beitritt vervollständigt die baltische Union und erstreckt die Konföderation nach Süden."
  pfp_merge_baltic_lithuania_not_yet_absorbed_tt:0 "Litauen wurde noch nicht in die Baltischen Staaten eingegliedert.\n"
  pfp_merge_baltic_lithuania_effect_annex:0 "§YBaltische Staaten§! annektiert §YLitauen§! und erhält seine Kerne und Kerngebiete.\n"

  pfp_merge_central_america:0 "Mittelamerika vereinen"
  pfp_merge_central_america_desc:0 "Die Nationen des zentralamerikanischen Isthmus — Guatemala, Honduras, El Salvador, Nicaragua, Costa Rica und Panama — waren einst unter der kurzlebigen Föderalen Republik Mittelamerika vereint, bevor Streitigkeiten sie 1838 auseinanderrissen. Verbunden durch eine gemeinsame Sprache, koloniales Erbe und die schmale Landbrücke zwischen zwei Kontinenten, besitzen diese Nationen strategische Kontrolle über die Zugänge zum Panamakanal. Ihre Wiedervereinigung würde den ältesten Traum des Isthmus neubeleben: ein einziger Staat, der Karibik und Pazifik beherrscht."
  pfp_merge_central_america_not_yet_formed_tt:0 "Mittelamerika wurde noch nicht vereint.\n"
  pfp_merge_central_america_puppets_ready_tt:0 "§YGuatemala§!, §YHonduras§!, §YEl Salvador§!, §YNicaragua§!, §YCosta Rica§!, §YPanama§!:\n"
  pfp_merge_central_america_effect_form:0 "§YMittelamerika§! entsteht durch die Vereinigung von §YGuatemala§!, §YHonduras§!, §YEl Salvador§!, §YNicaragua§!, §YCosta Rica§!, und §YPanama§!.\n"
  pfp_merge_central_america_effect_annex:0 "§YMittelamerika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_central_america_effect_cores:0 "§YMittelamerika§! erhält die Kerngebiete und Ansprüche der annektierten Marionetten.\n"
  pfp_merge_central_america_is_formed_tt:0 "Ein vereintes Mittelamerika existiert unter unseren Marionetten.\n"
  pfp_merge_central_america_belize:0 "Belize in Mittelamerika absorbieren"
  pfp_merge_central_america_belize_desc:0 "Britisch-Honduras ist ein Überbleibsel der Piratenära — eine englischsprachige Enklave eingeklemmt zwischen Guatemala und der Karibik, von Guatemala als gestohlenes Territorium beansprucht und von Großbritannien als Holzkolonie und spätere Kronbesitzung gehalten. Die Einverleibung in Mittelamerika würde die territorialen Ambitionen seiner Nachbarn erfüllen und den Isthmus unter einer einzigen Verwaltung konsolidieren."
  pfp_merge_central_america_belize_not_yet_absorbed_tt:0 "Belize wurde noch nicht in Mittelamerika absorbiert.\n"
  pfp_merge_central_america_belize_effect_annex:0 "§YMittelamerika§! annektiert §YBelize§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"

  pfp_merge_west_indies:0 "Westindische Inseln vereinen"
  pfp_merge_west_indies_desc:0 "Kuba, Hispaniola und der Inselbogen der Karibik bilden das Herzstück des karibischen Meeres. Die Vereinigung von Kuba, Haiti und der Dominikanischen Republik unter einer Flagge würde den Traum einer Westindischen Inseln-Föderation neu beleben."
  pfp_merge_west_indies_not_yet_formed_tt:0 "Die Westindischen Inseln wurden noch nicht vereint.\n"
  pfp_merge_west_indies_puppets_ready_tt:0 "§YKuba§!, §YDominikanische Republik§!, §YHaiti§!:\n"
  pfp_merge_west_indies_effect_form:0 "§YWestindische Inseln§! entsteht durch die Vereinigung von §YKuba§!, §YDominikanische Republik§!, und §YHaiti§!.\n"
  pfp_merge_west_indies_effect_annex:0 "§YWestindische Inseln§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_west_indies_effect_cores:0 "§YWestindische Inseln§! erhält die Kerngebiete und Ansprüche der annektierten Marionetten.\n"
  pfp_merge_west_indies_is_formed_tt:0 "Ein vereintes Westindien existiert unter unseren Marionetten.\n"
  pfp_merge_west_indies_jamaica:0 "Jamaika in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_jamaica_desc:0 "Jamaika war das Kronjuwel der britischen Karibik — die Insel der Zuckerplantagen und der Blauen Berge, deren Rhythmen des Widerstands die atlantische Welt prägten. Seine Eingliederung in die Westindischen Inseln bringt die größte der englischsprachigen Inseln ins Bündnis."
  pfp_merge_west_indies_jamaica_not_yet_absorbed_tt:0 "Jamaika wurde noch nicht in die Westindischen Inseln absorbiert.\n"
  pfp_merge_west_indies_jamaica_effect_annex:0 "§YWestindische Inseln§! annektiert §YJamaika§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_bahamas:0 "Bahamas in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_bahamas_desc:0 "Der Bahamas-Archipel bewacht das nördliche Tor zur Karibik, seine Flachwasserbänke und Inselketten erstrecken sich von Florida bis Hispaniola. Ihre Eingliederung erweitert die Reichweite der Westindischen Inseln bis an die Schwelle der Amerikas."
  pfp_merge_west_indies_bahamas_not_yet_absorbed_tt:0 "Die Bahamas wurden noch nicht in die Westindischen Inseln absorbiert.\n"
  pfp_merge_west_indies_bahamas_effect_annex:0 "§YWestindische Inseln§! annektiert §YBahamas§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_puerto_rico:0 "Puerto Rico in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_puerto_rico_desc:0 "Puerto Rico liegt an der Nordostecke des Karibischen Meeres — eine spanischsprachige Insel, deren strategische Lage die Mona-Passage beherrscht. Seine Eingliederung unter das Banner der Westindischen Inseln vervollständigt den Bogen der Großen Antillen."
  pfp_merge_west_indies_puerto_rico_not_yet_absorbed_tt:0 "Puerto Rico wurde noch nicht in die Westindischen Inseln absorbiert.\n"
  pfp_merge_west_indies_puerto_rico_effect_annex:0 "§YWestindische Inseln§! annektiert §YPuerto Rico§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_french_antilles:0 "Französische Antillen in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_french_antilles_desc:0 "Martinique und Guadeloupe sind die letzten Überreste des französischen Karibikreiches, ihre Kreolkultur eine Mischung aus afrikanischen, europäischen und indianischen Wurzeln. Ihre Annexion in die Westindischen Inseln absorbiert die letzte französische Präsenz in den Kleinen Antillen."
  pfp_merge_west_indies_french_antilles_not_yet_absorbed_tt:0 "Die Französischen Antillen wurden noch nicht absorbiert.\n"
  pfp_merge_west_indies_french_antilles_effect_annex:0 "§YWestindische Inseln§! annektiert §YFranzösische Antillen§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_british_antilles:0 "Britische Antillen in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_british_antilles_desc:0 "Die Windward- und Leeward-Inseln bilden eine verstreute Kette britischer Besitzungen entlang des östlichen Randes der Karibik. Ihre Eingliederung konsolidiert die Kleinen Antillen unter einer einzigen Verwaltung."
  pfp_merge_west_indies_british_antilles_not_yet_absorbed_tt:0 "Die Britischen Antillen wurden noch nicht absorbiert.\n"
  pfp_merge_west_indies_british_antilles_effect_annex:0 "§YWestindische Inseln§! annektiert §YBritische Antillen§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_dutch_antilles:0 "Niederländische Antillen in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_dutch_antilles_desc:0 "Curaçao und seine Schwesterinseln vor der venezolanischen Küste sind die Überreste des niederländischen Handelsimperiums in der Karibik, ihre Ölraffinerien und Freihäfen machen sie zu den wohlhabendsten Inseln der Region. Ihre Absorption beendet die letzte europäische Kolonialpräsenz in der südlichen Karibik."
  pfp_merge_west_indies_dutch_antilles_not_yet_absorbed_tt:0 "Die Niederländischen Antillen wurden noch nicht absorbiert.\n"
  pfp_merge_west_indies_dutch_antilles_effect_annex:0 "§YWestindische Inseln§! annektiert §YNiederländische Antillen§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_trinidad:0 "Trinidad und Tobago in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_trinidad_desc:0 "Trinidad, direkt vor der venezolanischen Küste, ist die südlichste Insel der Karibikkette und eine ihrer wohlhabendsten — seine Ölfelder und das weltoffene Port of Spain machen es zu einem begehrten Besitz. Seine Eingliederung in die Westindischen Inseln verankert die Südflanke der Föderation."
  pfp_merge_west_indies_trinidad_not_yet_absorbed_tt:0 "Trinidad und Tobago wurden noch nicht absorbiert.\n"
  pfp_merge_west_indies_trinidad_effect_annex:0 "§YWestindische Inseln§! annektiert §YTrinidad und Tobago§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_bermuda:0 "Bermuda in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_bermuda_desc:0 "Bermuda liegt weit nördlich der Hauptkaribikkette, ein mittelatlantischer britischer Besitz, dessen rosa Sandstrände und strategischer Marinehafen es zu einem Eckpfeiler britischer Macht im westlichen Atlantik gemacht haben. Seine Eingliederung erweitert die Reichweite der Westindischen Inseln in den offenen Ozean."
  pfp_merge_west_indies_bermuda_not_yet_absorbed_tt:0 "Bermuda wurde noch nicht in die Westindischen Inseln absorbiert.\n"
  pfp_merge_west_indies_bermuda_effect_annex:0 "§YWestindische Inseln§! annektiert §YBermuda§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_west_indies_belize:0 "Belize in die Westindischen Inseln absorbieren"
  pfp_merge_west_indies_belize_desc:0 "Britisch-Honduras ist eine kleine englischsprachige Enklave auf dem mittelamerikanischen Festland, deren kulturelle Bindungen an die britische Karibik sie zu einem natürlichen Kandidaten für die Eingliederung in die Westindischen Inseln statt zu ihren spanischsprachigen Nachbarn macht. Seine Annexion vereint das letzte britische Territorium der westlichen Karibik mit der Föderation."
  pfp_merge_west_indies_belize_not_yet_absorbed_tt:0 "Belize wurde noch nicht in die Westindischen Inseln absorbiert.\n"
  pfp_merge_west_indies_belize_effect_annex:0 "§YWestindische Inseln§! annektiert §YBelize§! und erhält dessen Kerngebiete und kolonisierbare Territorien.\n"
  pfp_merge_transcaucasia:0 "Transkaukasien vereinen"
  pfp_merge_transcaucasia_desc:0 "Georgien, Armenien und Aserbaidschan liegen an der Kreuzung von Europa und Asien, ihre Schicksale durch den Kaukasus verflochten, der sie hält. Öl aus Baku, Mangan aus Chiatura, Seide aus Tiflis — die transkaukasischen Republiken sind zusammen reicher als getrennt. Als Transkaukasien vereint, können sie dem Druck der Großmächte auf beiden Seiten widerstehen und eine Zukunft nach ihren eigenen Bedingungen gestalten."
  pfp_merge_transcaucasia_not_yet_formed_tt:0 "Transkaukasien wurde noch nicht vereint.\n"
  pfp_merge_transcaucasia_puppets_ready_tt:0 "§YGeorgien§!, §YArmenien§!, §YAserbaidschan§!:\n"
  pfp_merge_transcaucasia_effect_form:0 "§YTranskaukasien§! entsteht durch die Vereinigung von §YGeorgien§!, §YArmenien§!, und §YAserbaidschan§!.\n"
  pfp_merge_transcaucasia_effect_annex:0 "§YTranskaukasien§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_transcaucasia_effect_cores:0 "§YTranskaukasien§! erhält alle Kerngebiete und kolonisierbaren Territorien der fusionierten Vasallen.\n"
  pfp_merge_turkestan:0 "Turkestan vereinen"
  pfp_merge_turkestan_desc:0 "Durch die Steppen und Wüsten Zentralasiens teilen fünf Republiken ein gemeinsames türkisches Erbe, dieselben großen Flüsse und dasselbe koloniale Erbe. Kasachstan, Kirgisistan, Tadschikistan, Usbekistan und Turkmenistan wurden durch sowjetischen Verwaltungsbeschluss geteilt; ihre Vereinigung als Turkestan würde eine kulturelle und geografische Kohärenz wiederherstellen, die die Kartografie zerbrochen hat."
  pfp_merge_turkestan_not_yet_formed_tt:0 "Turkestan wurde noch nicht vereint.\n"
  pfp_merge_turkestan_puppets_ready_tt:0 "§YKasachstan§!, §YKirgisistan§!, §YTadschikistan§!, §YUsbekistan§!, §YTurkmenistan§!:\n"
  pfp_merge_turkestan_effect_form:0 "§YTurkestan§! entsteht durch die Vereinigung von §YKasachstan§!, §YKirgisistan§!, §YTadschikistan§!, §YUsbekistan§!, und §YTurkmenistan§!.\n"
  pfp_merge_turkestan_effect_annex:0 "§YTurkestan§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_turkestan_effect_cores:0 "§YTurkestan§! erhält alle Kerngebiete und kolonisierbaren Territorien der fusionierten Vasallen.\n"
  pfp_merge_indochina:0 "Indochina vereinen"
  pfp_merge_indochina_desc:0 "Vietnam, Laos und Kambodscha wurden unter französischer Verwaltung als Indochine zusammengeführt — eine einzige Kolonialeinheit, regiert von Hanoi und Saigon. Die Flüsse, die durch diese Länder fließen, die Handelswege, die gemeinsamen buddhistischen Traditionen und Jahrhunderte verflochtener Geschichte sprechen für die Einheit. Als Indochina vereint, können sie mit einer Stimme gegen jede Macht sprechen, die ihre Spaltung ausnutzen würde."
  pfp_merge_indochina_not_yet_formed_tt:0 "Indochina wurde noch nicht vereint.\n"
  pfp_merge_indochina_puppets_ready_tt:0 "§YVietnam§!, §YLaos§!, §YKambodscha§!:\n"
  pfp_merge_indochina_effect_form:0 "§YIndochina§! entsteht durch die Vereinigung von §YVietnam§!, §YLaos§!, und §YKambodscha§!.\n"
  pfp_merge_indochina_effect_annex:0 "§YIndochina§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_indochina_effect_cores:0 "§YIndochina§! erhält alle Kerngebiete und kolonisierbaren Territorien der fusionierten Vasallen.\n"
  pfp_merge_indochina_is_formed_tt:0 "Ein vereintes Indochina existiert unter unseren Vasallen.\n"
  pfp_merge_indochina_siam:0 "Siam absorbieren"
  pfp_merge_indochina_siam_desc:0 "Siam steht abseits von Französisch-Indochina — nie kolonialisiert, nie gebrochen. Aber von Territorien umgeben, die nun unter indochinesischer Verwaltung vereint sind, kann es keine Insel der Unabhängigkeit bleiben. Die Zeit ist gekommen, Siam in die größere indochinesische Union einzubringen."
  pfp_merge_indochina_siam_not_yet_absorbed_tt:0 "Siam wurde noch nicht in Indochina eingegliedert.\n"
  pfp_merge_indochina_siam_effect_annex:0 "§YIndochina§! annektiert §YSiam§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_indochina_burma:0 "Burma absorbieren"
  pfp_merge_indochina_burma_desc:0 "Burma war lange mit Indien unter britischer Verwaltung verbunden, aber seine Geografie stellt es fest in die indochinesische Sphäre. Das Irrawaddy-Tal, der mit seinen Nachbarn geteilte buddhistische Glaube, die Reisfelder, die die Region ernähren — Burma gehört zur indochinesischen Welt. Seine Angliederung vervollständigt die kontinentale Union."
  pfp_merge_indochina_burma_not_yet_absorbed_tt:0 "Burma wurde noch nicht in Indochina eingegliedert.\n"
  pfp_merge_indochina_burma_effect_annex:0 "§YIndochina§! annektiert §YBirma§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_indochina_malaysia:0 "Malaysia absorbieren"
  pfp_merge_indochina_malaysia_desc:0 "Die Malaiische Halbinsel verbindet das kontinentale Indochina mit der Inselwelt des Pazifik. Malaysias Kautschukplantagen, Zinnminen und die strategische Position an der Straße von Malakka machen es zu einem unverzichtbaren Zusatz für jede indochinesische Union mit Ambitionen in der weiteren Region."
  pfp_merge_indochina_malaysia_not_yet_absorbed_tt:0 "Malaysia wurde noch nicht in Indochina eingegliedert.\n"
  pfp_merge_indochina_malaysia_effect_annex:0 "§YIndochina§! annektiert §YMalaysia§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_indochina_singapore:0 "Singapur absorbieren"
  pfp_merge_indochina_singapore_desc:0 "An der Südspitze der Malaiischen Halbinsel beherrscht Singapur die enge Meerenge, durch die die Hälfte des Welthandels fließen muss. Sein Hafen gehört zu den geschäftigsten der Welt, seine Lage zu den strategisch bedeutsamsten. In Indochina eingegliedert, wird Singapur zum maritimen Tor eines vereinten südostasiatischen Staates."
  pfp_merge_indochina_singapore_not_yet_absorbed_tt:0 "Singapur wurde noch nicht in Indochina eingegliedert.\n"
  pfp_merge_indochina_singapore_effect_annex:0 "§YIndochina§! annektiert §YSingapur§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_australasia:0 "Australasien vereinen"
  pfp_merge_australasia_desc:0 "Australien, Neuseeland und Papua-Neuguinea verankern den südlichen Pazifik — drei britische Territorien, deren Nähe und gemeinsames Erbe die Einheit zu einer natürlichen Bestrebung machen. Der riesige Kontinent, die Insel am Ende der Welt und die tropische Halbinsel beherrschen zusammen einen Ozean. Als Australasien vereint, können sie Macht über den Pazifik projizieren und ihre gemeinsame maritime Zukunft sichern."
  pfp_merge_australasia_not_yet_formed_tt:0 "Australasien wurde noch nicht vereint.\n"
  pfp_merge_australasia_puppets_ready_tt:0 "§YAustralien§!, §YNeuseeland§!, §YPapua-Neuguinea§!:\n"
  pfp_merge_australasia_effect_form:0 "§YAustralasien§! entsteht durch die Vereinigung von §YAustralien§!, §YNeuseeland§!, und §YPapua-Neuguinea§!.\n"
  pfp_merge_australasia_effect_annex:0 "§YAustralasien§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_australasia_effect_cores:0 "§YAustralasien§! erhält alle Kerngebiete und kolonisierbaren Territorien der fusionierten Vasallen.\n"
  pfp_merge_australasia_is_formed_tt:0 "Ein vereintes Australasien existiert unter unseren Vasallen.\n"
  pfp_merge_australasia_solomon_islands:0 "Salomonen absorbieren"
  pfp_merge_australasia_solomon_islands_desc:0 "Die Salomonen-Inselkette erstreckt sich nordostwärts von Papua-Neuguinea in das Herz des Pazifik. Ihre Inseln sind seit langem Teil der britischen Pazifikwelt, ihr Schicksal durch Nähe und Kolonialverwaltung an Australien gebunden. Ihre Eingliederung in Australasien festigt den südwestlichen Pazifik unter einem einzigen Banner."
  pfp_merge_australasia_solomon_islands_not_yet_absorbed_tt:0 "Die Salomonen wurden noch nicht in Australasien eingegliedert.\n"
  pfp_merge_australasia_solomon_islands_effect_annex:0 "§YAustralasien§! annektiert §YSalomonen§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_australasia_bougainville:0 "Bougainville absorbieren"
  pfp_merge_australasia_bougainville_desc:0 "Bougainville, obwohl geografisch näher an den Salomonen, wurde unter dem australischen Mandat über Neuguinea verwaltet. Seine Lage im Bismarck-Archipel und seine Kupferressourcen machen seine Eingliederung in Australasien zu einer natürlichen Erweiterung regionaler Autorität."
  pfp_merge_australasia_bougainville_not_yet_absorbed_tt:0 "Bougainville wurde noch nicht in Australasien eingegliedert.\n"
  pfp_merge_australasia_bougainville_effect_annex:0 "§YAustralasien§! annektiert §YBougainville§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_australasia_new_caledonia:0 "Neukaledonien absorbieren"
  pfp_merge_australasia_new_caledonia_desc:0 "Neukaledonien liegt am südlichen Ende des Korallenmeeres, mit Nickelreserven zu den reichsten der Welt. Ein französischer Besitz nach Geschichte, stellt seine Geografie es fest in die australasische Sphäre. Seine Eingliederung fügt der Pazifikunion strategische Tiefe und mineralischen Reichtum hinzu."
  pfp_merge_australasia_new_caledonia_not_yet_absorbed_tt:0 "Neukaledonien wurde noch nicht in Australasien eingegliedert.\n"
  pfp_merge_australasia_new_caledonia_effect_annex:0 "§YAustralasien§! annektiert §YNeukaledonien§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_australasia_vanuatu:0 "Vanuatu absorbieren"
  pfp_merge_australasia_vanuatu_desc:0 "Die Neuen Hebriden wurden unter einem eigentümlichen anglofranzösischen Kondominium verwaltet — einem gemeinsamen Protektorat, das gleichzeitig von zwei Mächten regiert wurde. Die Eingliederung Vanuatus in Australasien beendet diese koloniale Anomalie und bringt den Archipel in die Pazifikunion, die die Geografie stets vorgesehen hat."
  pfp_merge_australasia_vanuatu_not_yet_absorbed_tt:0 "Vanuatu wurde noch nicht in Australasien eingegliedert.\n"
  pfp_merge_australasia_vanuatu_effect_annex:0 "§YAustralasien§! annektiert §YVanuatu§! und erhält dessen Kerngebiete und kolonisierbaren Territorien.\n"
  pfp_merge_levant:0 "Die Levante vereinen"
  pfp_merge_levant_desc:0 "Palästina, Jordanien, der Libanon und Syrien teilen mehr als eine Grenze — sie teilen den Fruchtbaren Halbmond, die Wiege der Zivilisation selbst. Von den Küsten des Mittelmeers bis zu den Sanden der Syrischen Wüste haben diese Länder jahrtausende zwischen Imperien gewechselt. Unter vereinter Herrschaft als Levante können sie endlich ihr eigenes Schicksal bestimmen."
  pfp_merge_levant_not_yet_formed_tt:0 "Die Levante wurde noch nicht vereint.\n"
  pfp_merge_levant_puppets_ready_tt:0 "§YJordanien§!, §YPalästina§!, §YLibanon§!, §YSyrien§!:\n"
  pfp_merge_levant_effect_form:0 "§YLevante§! entsteht durch die Vereinigung von §YJordanien§!, §YPalästina§!, §YLibanon§!, und §YSyrien§!.\n"
  pfp_merge_levant_effect_annex:0 "§YLevante§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_levant_effect_cores:0 "§YLevante§! erhält alle Kerngebiete und kolonisierbaren Territorien der fusionierten Vasallen.\n"
  pfp_merge_mittelafrika:0 "Mittelafrika errichten"
  pfp_merge_mittelafrika_desc:0 "Deutschlands koloniale Vision eines vereinten zentralafrikanischen Dominions wurde im Großen Krieg nie verwirklicht. Doch die Teile bleiben: Kamerun im Westen, Tanganjika im Osten, Südwestafrika im Süden. Mit diesen unter unserer Verwaltung konsolidierten Territorien mag der Traum von einem kontinentalen afrikanischen Imperium, das sich von Meer zu Meer erstreckt, noch verwirklicht werden."
  pfp_merge_mittelafrika_not_yet_formed_tt:0 "Mittelafrika wurde noch nicht vereint.\n"
  pfp_merge_mittelafrika_puppets_ready_tt:0 "§YKamerun§!, §YTanganjika§!, §YDeutsch-Südwestafrika§!:\n"
  pfp_merge_mittelafrika_effect_form:0 "§YMittelafrika§! entsteht durch die Vereinigung von §YKamerun§!, §YTanganjika§!, und §YDeutsch-Südwestafrika§!.\n"
  pfp_merge_mittelafrika_effect_annex:0 "§YMittelafrika§! annektiert alle zuvor aufgeführten Vasallen und erhält deren Truppen.\n"
  pfp_merge_mittelafrika_effect_cores:0 "§YMittelafrika§! erhält alle Kerngebiete und kolonisierbaren Territorien der fusionierten Vasallen.\n"
  pfp_merge_mittelafrika_is_formed_tt:0 "Mittelafrika wurde gegründet.\n"
  pfp_merge_mittelafrika_togo:0 "Togo absorbieren"
  pfp_merge_mittelafrika_togo_desc:0 "Togo war vor dem Großen Krieg ein deutsches Schutzgebiet, bei dessen Abschluss zwischen Frankreich und Großbritannien aufgeteilt. Als ehemalige deutsche Kolonie ist sein Platz im neuen Mittelafrika natürlich. Seine Eingliederung vervollständigt die westliche Flanke des zentralafrikanischen Imperiums."
  pfp_merge_mittelafrika_togo_not_yet_absorbed_tt:0 "§YTogo§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_togo_effect_annex:0 "§YMittelafrika§! gliedert §YTogo§! (Q40) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_ruanda_urundi:0 "Ruanda-Urundi absorbieren"
  pfp_merge_mittelafrika_ruanda_urundi_desc:0 "Ruanda-Urundi, seit dem Großen Krieg unter belgischem Mandat verwaltet, liegt im Herzen Afrikas zwischen Tanganjika und dem Kongo. Seine Eingliederung in Mittelafrika schließt die Lücke zwischen Deutschlands ost- und zentralafrikanischen Besitzungen."
  pfp_merge_mittelafrika_ruanda_urundi_not_yet_absorbed_tt:0 "§YRuanda-Urundi§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_ruanda_urundi_effect_annex:0 "§YMittelafrika§! gliedert §YRuanda-Urundi§! (Q66) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_gabon:0 "Gabun absorbieren"
  pfp_merge_mittelafrika_gabon_desc:0 "Gabuns äquatoriale Regenwälder und das Ogooué-Flussbecken machen es zu einem der reichsten Territorien des Kontinents. Eine ehemalige französische Besitzung, seine strategische Lage an der Atlantikküste macht es zu einem wichtigen Erwerb für Mittelafrkas westlichen Zugang."
  pfp_merge_mittelafrika_gabon_not_yet_absorbed_tt:0 "§YGabun§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_gabon_effect_annex:0 "§YMittelafrika§! gliedert §YGabun§! (Q38) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_congo_brazzaville:0 "Kongo-Brazzaville absorbieren"
  pfp_merge_mittelafrika_congo_brazzaville_desc:0 "Der Französische Kongo liegt am Nordufer des Kongo-Flusses, direkt gegenüber dem Belgischen Kongo. Seine Wälder und Flüsse speisen das Herz Afrikas, und seine Eingliederung in Mittelafrika festigt den deutschen Einfluss entlang des Kongobeckens."
  pfp_merge_mittelafrika_congo_brazzaville_not_yet_absorbed_tt:0 "§YKongo-Brazzaville§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_congo_brazzaville_effect_annex:0 "§YMittelafrika§! gliedert §YKongo-Brazzaville§! (Q39) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_northern_rhodesia:0 "Nordrhodesien absorbieren"
  pfp_merge_mittelafrika_northern_rhodesia_desc:0 "Der Kupfergürtel Nordrhodesiens gehört zu den reichsten Mineralvorkommen Afrikas. Als britisches Protektorat, das die Kap-nach-Kairo-Route verbindet, durchschneidet seine Eingliederung in Mittelafrika diese imperiale Ader und liefert dem zentralafrikanischen Staat eine riesige Ressourcenbasis."
  pfp_merge_mittelafrika_northern_rhodesia_not_yet_absorbed_tt:0 "§YNordrhodesien§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_northern_rhodesia_effect_annex:0 "§YMittelafrika§! gliedert §YNordrhodesien§! (Q63) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_southern_rhodesia:0 "Südrhodesien absorbieren"
  pfp_merge_mittelafrika_southern_rhodesia_desc:0 "Südrhodesien, von britischen Kolonisten unter Cecil Rhodes besiedelt, bewacht die Straße zwischen Limpopo und Sambesi. Seine fruchtbaren Hochländer und wachsende Siedlerbevölkerung machen es zu einer Beute, die es wert ist, in das expandierende Mittelafrika eingegliedert zu werden."
  pfp_merge_mittelafrika_southern_rhodesia_not_yet_absorbed_tt:0 "§YSüdrhodesien§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_southern_rhodesia_effect_annex:0 "§YMittelafrika§! gliedert §YSüdrhodesien§! (Q69) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_angola:0 "Angola absorbieren"
  pfp_merge_mittelafrika_angola_desc:0 "Angola erstreckt sich von der Atlantikküste tief in das afrikanische Innere, sein Plateau reich an Diamanten, Öl und fruchtbarem Land. Eine portugiesische Besitzung seit Jahrhunderten, bietet seine Eingliederung in Mittelafrika dem zentralafrikanischen Staat einen wichtigen Atlantikzugang."
  pfp_merge_mittelafrika_angola_not_yet_absorbed_tt:0 "§YAngola§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_angola_effect_annex:0 "§YMittelafrika§! gliedert §YAngola§! (Q67) ein und erhält dessen Gebiet und Truppen.\n"
  pfp_merge_mittelafrika_mozambique:0 "Mosambik absorbieren"
  pfp_merge_mittelafrika_mozambique_desc:0 "Mosambiks lange Indischer-Ozean-Küstenlinie und der Hafen von Lourenço Marques kontrollieren den seewärtigen Zugang zum binnenliegenden südlichen Afrika. Seine Eingliederung in Mittelafrika vervollständigt die östliche Meeresfront des zentralafrikanischen Imperiums."
  pfp_merge_mittelafrika_mozambique_not_yet_absorbed_tt:0 "§YMosambik§! wurde noch nicht von §YMittelafrika§! eingegliedert.\n"
  pfp_merge_mittelafrika_mozambique_effect_annex:0 "§YMittelafrika§! gliedert §YMosambik§! (Q68) ein und erhält dessen Gebiet und Truppen.\n"




