  pfp_merge_central_africa:0 "Former Central Africa"
  pfp_merge_central_africa_cameroon:0 "Absorber Cameroon dans Central Africa"
  pfp_merge_central_africa_cameroon_desc:0 "Mandat de la Société des Nations partagé entre la France et la Grande-Bretagne après la Grande Guerre, le Cameroun fait le pont entre l'Afrique occidentale et l'Afrique centrale. Ses hautes terres descendent vers une côte fertile, et sa position au coude de l'Afrique en fait un lien naturel entre les territoires tournés vers l'Atlantique à l'ouest et le bassin du Congo en dessous. Son absorption fermerait la frontière nord-ouest de l'Afrique centrale."
  pfp_merge_central_africa_cameroon_effect_annex:0 "§YAfrique centrale§! annexe §YCameroon§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_central_africa_cameroon_not_yet_absorbed_tt:0 "Le Cameroun n'a pas encore été absorbé.\n"
  pfp_merge_central_africa_chad:0 "Absorber Chad dans Central Africa"
  pfp_merge_central_africa_chad_desc:0 "Territoire le plus septentrional de l'Afrique équatoriale française, le Tchad s'étend des franges du Sahara aux plaines cotonnières du Sud. Le lac Tchad, sa grande mer intérieure, est un carrefour du commerce saharien depuis un millénaire. Son intégration ancrerait l'Afrique centrale dans son avancée septentrionale et compléterait la fédération que la France administrait jadis depuis Brazzaville."
  pfp_merge_central_africa_chad_effect_annex:0 "§YAfrique centrale§! annexe §YChad§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_central_africa_chad_not_yet_absorbed_tt:0 "Le Tchad n'a pas encore été absorbé.\n"
  pfp_merge_central_africa_desc:0 "The Congo Basin is the heart of equatorial Africa — a vast river system draining one of the largest tropical rainforests on earth, rich in rubber, copper, and ivory beyond the reckoning of any contemporary power. The Belgian Congo, vast and largely unmapped, is a state unto itself. Around it, the forests and savannahs of the surrounding territories await unification into a single Central African state that would rank among the continent's great powers."
  pfp_merge_central_africa_effect_annex:0 "§YAfrique centrale§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_central_africa_equatorial_guinea:0 "Absorber Equatorial Guinea dans Central Africa"
  pfp_merge_central_africa_equatorial_guinea_desc:0 "Seul territoire espagnol sur le continent africain, la Guinée équatoriale est une petite enclave coincée entre le Cameroun et le Gabon — un vestige colonial au poids stratégique propre négligeable, mais à la valeur symbolique significative. Son absorption compléterait le littoral de l'Afrique centrale et éliminerait la dernière enclave en mains étrangères dans la région."
  pfp_merge_central_africa_equatorial_guinea_effect_annex:0 "§YAfrique centrale§! annexe §YEquatorial Guinea§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_central_africa_equatorial_guinea_not_yet_absorbed_tt:0 "La Guinée équatoriale n'a pas encore été absorbée.\n"
  pfp_merge_central_africa_gabon:0 "Absorber Gabon dans Central Africa"
  pfp_merge_central_africa_gabon_desc:0 "Libreville — fondée comme colonie d'esclaves libérés dans la tradition de Freetown — ancre la côte atlantique de l'Afrique équatoriale. Les forêts denses du Gabon n'ont guère été touchées ; ce qui se cache en dessous commence seulement à être compris. Sa position côtière et l'accès fluvial offriraient à l'Afrique centrale une deuxième fenêtre sur l'Atlantique."
  pfp_merge_central_africa_gabon_effect_annex:0 "§YAfrique centrale§! annexe §YGabon§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_central_africa_gabon_not_yet_absorbed_tt:0 "Le Gabon n'a pas encore été absorbé.\n"
  pfp_merge_central_africa_is_formed_tt:0 "L'Afrique centrale a été formée.\n"
  pfp_merge_central_africa_not_yet_formed_tt:0 "L'Afrique centrale n'a pas encore été formée.\n"
  pfp_merge_central_africa_puppets_ready_tt:0 "§YBelgian Congo§! and §YCongo-Brazzaville§!:\n"
  pfp_merge_central_africa_ubangi_shari:0 "Absorber Ubangi-Shari dans Central Africa"
  pfp_merge_central_africa_ubangi_shari_desc:0 "Nommé d'après les deux fleuves qui le bordent au nord et à l'est, l'Oubangui-Chari occupe le plateau entre le bassin du Congo et le Sahel. Il est faiblement administré et peu peuplé selon les normes coloniales — un territoire dont la vraie valeur réside dans sa position comme pont intérieur entre l'Afrique centrale et les territoires au nord."
  pfp_merge_central_africa_ubangi_shari_effect_annex:0 "§YAfrique centrale§! annexe §YUbangi-Shari§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_central_africa_ubangi_shari_not_yet_absorbed_tt:0 "L'Oubangui-Chari n'a pas encore été absorbé.\n"
  pfp_merge_central_africa_effect_form:0 "§YAfrique centrale§! est formée par la fusion de §YBelgian Congo§! et §YCongo-Brazzaville§!.\n"
  pfp_merge_central_africa_effect_cores:0 "§YAfrique centrale§! obtient les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_south_africa_puppets_ready_tt:0 "§YAfrique du Sud§!, §YSouth West Africa§!, §YAngola§!, §YBechuanaland§!, §YNorthern Rhodesia§!, §YSouthern Rhodesia§!, §YNyasaland§!, §YMozambique§!:\n"
  pfp_merge_south_africa:0 "Former South Africa"
  pfp_merge_south_africa_desc:0 "Des côtes atlantiques balayées par les vents d'Angola et du Sud-Ouest africain jusqu'au littoral mozambicain de l'océan Indien, et de la vallée du Zambèze jusqu'au cap de Bonne-Espérance, l'Afrique australe englobe la région la plus industriellement développée et stratégiquement vitale du continent. Sous ses sols gisent les plus grandes concentrations mondiales d'or et de diamants — la richesse qui attira les puissances européennes dans un siècle de rivalité, de guerre et de construction ferroviaire, faisant du Transvaal le cœur économique du continent. Divisées par des frontières coloniales en territoires britanniques, portugais et anciennement allemands, ces terres partagent une géographie commune de grands fleuves, de hauts plateaux et de littoraux de l'océan Indien. Leur unification forgerait une puissance commandant à la fois l'Atlantique et la route du Cap — la porte méridionale entre les grands océans du monde."
  pfp_merge_south_africa_not_yet_formed_tt:0 "L'Afrique du Sud n'a pas encore été formée.\n"
  pfp_merge_south_africa_effect_form:0 "§YAfrique du Sud§! est formée par la fusion de §YAfrique du Sud§!, §YSouth West Africa§!, §YAngola§!, §YBechuanaland§!, §YNorthern Rhodesia§!, §YSouthern Rhodesia§!, §YNyasaland§!, et §YMozambique§!.\n"
  pfp_merge_south_africa_effect_annex:0 "§YAfrique du Sud§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_south_africa_effect_cores:0 "§YAfrique du Sud§! obtient les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_south_africa_is_formed_tt:0 "L'Afrique du Sud a été formée.\n"
  pfp_merge_south_africa_madagascar:0 "Absorber Madagascar dans South Africa"
  pfp_merge_south_africa_madagascar_desc:0 "Séparée du continent africain par le canal du Mozambique, Madagascar est la quatrième plus grande île du monde et l'une des plus biologiquement distinctes. Ses ports commandent les voies maritimes de l'océan Indien occidental et les approches du canal du Mozambique. Son absorption étendrait la portée de l'Afrique du Sud sur les eaux environnantes, sécurisant les approches maritimes de la route du Cap."
  pfp_merge_south_africa_madagascar_not_yet_absorbed_tt:0 "Madagascar n'a pas encore été absorbé dans l'Afrique du Sud.\n"
  pfp_merge_south_africa_madagascar_effect_annex:0 "§YAfrique du Sud§! annexe §YMadagascar§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_scandinavia_puppets_ready_tt:0 "§YNorway§!, §YSweden§!, §YDenmark§!:\n"
  pfp_merge_scandinavia:0 "Former Scandinavia"
  pfp_merge_scandinavia_desc:0 "Des fjords de Norvège aux gisements miniers du nord de la Suède et aux plaines danoises, les trois royaumes scandinaves partagent un héritage commun remontant à l'ère des Vikings — marins, commerçants et guerriers qui commandèrent jadis les côtes européennes de la Baltique à l'Atlantique. Divisés en couronnes séparées par des siècles de rivalités dynastiques, ces peuples parlent des langues apparentées, pratiquent la même tradition religieuse et ont passé plus de leur histoire entremêlés que séparés. Leur réunification sous une seule bannière restaurerait la puissance dominante des mers du Nord."
  pfp_merge_scandinavia_not_yet_formed_tt:0 "La Scandinavie n'a pas encore été formée.\n"
  pfp_merge_scandinavia_effect_form:0 "§YScandinavie§! est formée par la fusion de §YNorway§!, §YSweden§!, et §YDenmark§!.\n"
  pfp_merge_scandinavia_effect_annex:0 "§YScandinavie§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_scandinavia_effect_cores:0 "§YScandinavie§! obtient les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_scandinavia_is_formed_tt:0 "La Scandinavie a été formée.\n"
  pfp_merge_scandinavia_iceland:0 "Absorber Iceland dans Scandinavia"
  pfp_merge_scandinavia_iceland_desc:0 "Les premiers colons norrois qui débarquèrent en Islande au IXe siècle découvrirent une île de feu et de glace au bout du monde connu — une terre de pics volcaniques, de glaciers et de geysers qui n'avait jamais connu d'occupation humaine. Pendant des siècles, elle servit d'avant-poste lointain de la civilisation scandinave, foyer des sagas qui préservèrent le souvenir de l'âge viking. Son intégration étendrait la portée de la Scandinavie dans l'Atlantique nord, sécurisant les voies maritimes entre l'Europe et le reste du monde."
  pfp_merge_scandinavia_iceland_not_yet_absorbed_tt:0 "L'Islande n'a pas encore été absorbée dans la Scandinavie.\n"
  pfp_merge_scandinavia_iceland_effect_annex:0 "§YScandinavie§! annexe §YIceland§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_scandinavia_greenland:0 "Absorber Greenland dans Scandinavia"
  pfp_merge_scandinavia_greenland_desc:0 "Erik le Rouge nomma cette île Groenland pour attirer des colons, et pendant cinq siècles des colonisateurs norrois taillèrent une existence précaire dans ses côtes sud-occidentales avant de disparaître des archives historiques. La plus grande île du monde surplombe les routes maritimes septentrionales et renferme sous sa calotte glaciaire des ressources qui pourraient définir le siècle à venir. Son intégration donnerait à la Scandinavie un pied au sommet du monde."
  pfp_merge_scandinavia_greenland_not_yet_absorbed_tt:0 "Le Groenland n'a pas encore été absorbé dans la Scandinavie.\n"
  pfp_merge_scandinavia_greenland_effect_annex:0 "§YScandinavie§! annexe §YGreenland§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_baltic:0 "Former les États baltes"
  pfp_merge_baltic_desc:0 "Séparées par le golfe de Riga mais liées par des côtes d'ambre, la foi luthérienne et des siècles de sujétion commune, l'Estonie et la Lettonie forment le cœur septentrional du monde baltique. Les deux nations ont obtenu leur indépendance dans le chaos de l'après-guerre, façonnant leur souveraineté sur les décombres des empires russe et allemand. Leur union consoliderait le littoral baltique du nord et poserait les fondations d'une confédération plus large jusqu'à la frontière lituanienne."
  pfp_merge_baltic_not_yet_formed_tt:0 "Les États baltes n'ont pas encore été formés.\n"
  pfp_merge_baltic_puppets_ready_tt:0 "§YEstonie§!, §YLettonie§!:\n"
  pfp_merge_baltic_effect_form:0 "§YÉtats baltes§! est formée par la fusion de §YEstonie§! et §YLettonie§!.\n"
  pfp_merge_baltic_effect_annex:0 "§YÉtats baltes§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_baltic_effect_cores:0 "§YÉtats baltes§! gagne les noyaux et revendications des pantins annexés.\n"
  pfp_merge_baltic_is_formed_tt:0 "Les États baltes ont été formés.\n"
  pfp_merge_baltic_lithuania:0 "Absorber la Lituanie dans les États baltes"
  pfp_merge_baltic_lithuania_desc:0 "La Lituanie fut le dernier royaume païen d'Europe — un géant médiéval qui s'étendit jadis de la Baltique à la mer Noire sous les Jagelons. Catholique là où ses voisins du nord sont luthériens, elle partage néanmoins la même côte d'ambre, la même vulnérabilité géopolitique et la même indépendance chèrement gagnée. Son incorporation achève l'union baltique en étendant la fédération vers le sud."
  pfp_merge_baltic_lithuania_not_yet_absorbed_tt:0 "La Lituanie n'a pas encore été absorbée dans les États baltes.\n"
  pfp_merge_baltic_lithuania_effect_annex:0 "§YÉtats baltes§! annexe §YLituanie§!, gagnant ses noyaux et territoires.\n"

  pfp_merge_central_america:0 "Former l'Amérique centrale"
  pfp_merge_central_america_desc:0 "Les nations de l'isthme centraméricain — le Guatemala, le Honduras, El Salvador, le Nicaragua, le Costa Rica et le Panama — étaient autrefois unies sous la République fédérale d'Amérique centrale, avant que les querelles politiques ne les séparent en 1838. Liées par une langue commune, un héritage colonial partagé et l'étroite bande de terre reliant deux continents, ces nations détiennent une maîtrise stratégique des approches du canal de Panama. Leur réunification raviverait le plus ancien rêve de l'isthme : un État unique commandant à la fois les Caraïbes et le Pacifique."
  pfp_merge_central_america_not_yet_formed_tt:0 "L'Amérique centrale n'a pas encore été formée.\n"
  pfp_merge_central_america_puppets_ready_tt:0 "§YGuatemala§!, §YHonduras§!, §YEl Salvador§!, §YNicaragua§!, §YCosta Rica§!, §YPanama§!:\n"
  pfp_merge_central_america_effect_form:0 "§YAmérique centrale§! est formée par la fusion de §YGuatemala§!, §YHonduras§!, §YEl Salvador§!, §YNicaragua§!, §YCosta Rica§!, et §YPanama§!.\n"
  pfp_merge_central_america_effect_annex:0 "§YAmérique centrale§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_central_america_effect_cores:0 "§YAmérique centrale§! obtient les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_central_america_is_formed_tt:0 "L'Amérique centrale a été formée.\n"
  pfp_merge_central_america_belize:0 "Absorber le Belize dans l'Amérique centrale"
  pfp_merge_central_america_belize_desc:0 "Le Honduras britannique est un vestige de l'ère des boucaniers — une enclave anglophone coincée entre le Guatemala et les Caraïbes, revendiquée par le Guatemala comme territoire volé et maintenue par la Grande-Bretagne comme colonie forestière devenue possession de la Couronne. Son incorporation en Amérique centrale satisferait les ambitions territoriales de ses voisins et consoliderait l'isthme sous une administration unique, comblant la dernière lacune du pont terrestre."
  pfp_merge_central_america_belize_not_yet_absorbed_tt:0 "Le Belize n'a pas encore été absorbé dans l'Amérique centrale.\n"
  pfp_merge_central_america_belize_effect_annex:0 "§YAmérique centrale§! annexe §YBelize§!, gagnant ses noyaux et territoires colonisables.\n"

  pfp_merge_west_indies:0 "Former les Antilles"
  pfp_merge_west_indies_desc:0 "Cuba, Hispaniola et l'arc des îles des Caraïbes forment le cœur de la mer caribéenne. L'union de Cuba, d'Haïti et de la République dominicaine sous un seul drapeau raviverait le rêve d'une fédération des Antilles."
  pfp_merge_west_indies_not_yet_formed_tt:0 "Les Antilles n'ont pas encore été formées.\n"
  pfp_merge_west_indies_puppets_ready_tt:0 "§YCuba§!, §YRépublique dominicaine§!, §YHaïti§!:\n"
  pfp_merge_west_indies_effect_form:0 "§YAntilles§! est formée par la fusion de §YCuba§!, §YRépublique dominicaine§!, et §YHaïti§!.\n"
  pfp_merge_west_indies_effect_annex:0 "§YAntilles§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_west_indies_effect_cores:0 "§YAntilles§! obtient les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_west_indies_is_formed_tt:0 "Les Antilles ont été formées.\n"
  pfp_merge_west_indies_jamaica:0 "Absorber la Jamaïque dans les Antilles"
  pfp_merge_west_indies_jamaica_desc:0 "La Jamaïque était le joyau de la Couronne des Caraïbes britanniques — l'île des plantations de canne à sucre et des Montagnes Bleues, dont les rythmes de résistance ont façonné le monde atlantique. Son absorption dans les Indes occidentales intègre la plus grande des îles anglophones dans l'ensemble."
  pfp_merge_west_indies_jamaica_not_yet_absorbed_tt:0 "La Jamaïque n'a pas encore été absorbée dans les Antilles.\n"
  pfp_merge_west_indies_jamaica_effect_annex:0 "§YAntilles§! annexe §YJamaïque§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_bahamas:0 "Absorber les Bahamas dans les Antilles"
  pfp_merge_west_indies_bahamas_desc:0 "L'archipel des Bahamas garde la porte d'entrée nord des Caraïbes, ses hauts-fonds et ses chaînes d'îles s'étendant de la Floride à Hispaniola. Leur incorporation étend la portée des Indes occidentales jusqu'au seuil même des Amériques."
  pfp_merge_west_indies_bahamas_not_yet_absorbed_tt:0 "Les Bahamas n'ont pas encore été absorbées dans les Antilles.\n"
  pfp_merge_west_indies_bahamas_effect_annex:0 "§YAntilles§! annexe §YBahamas§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_puerto_rico:0 "Absorber Porto Rico dans les Antilles"
  pfp_merge_west_indies_puerto_rico_desc:0 "Porto Rico se trouve au coin nord-est de la mer des Caraïbes — une île hispanophone dont la position stratégique commande le Passage de la Mona. Son rattachement aux Indes occidentales complète l'arc des Grandes Antilles."
  pfp_merge_west_indies_puerto_rico_not_yet_absorbed_tt:0 "Porto Rico n'a pas encore été absorbé dans les Antilles.\n"
  pfp_merge_west_indies_puerto_rico_effect_annex:0 "§YAntilles§! annexe §YPorto Rico§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_french_antilles:0 "Absorber les Antilles françaises dans les Antilles"
  pfp_merge_west_indies_french_antilles_desc:0 "La Martinique et la Guadeloupe sont les derniers vestiges de l'empire caribéen français, leur culture créole mêlant racines africaines, européennes et amérindiennes. Leur annexion aux Indes occidentales absorbe la dernière présence française dans les Petites Antilles."
  pfp_merge_west_indies_french_antilles_not_yet_absorbed_tt:0 "Les Antilles françaises n'ont pas encore été absorbées dans les Antilles.\n"
  pfp_merge_west_indies_french_antilles_effect_annex:0 "§YAntilles§! annexe §YAntilles françaises§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_british_antilles:0 "Absorber les Antilles britanniques dans les Antilles"
  pfp_merge_west_indies_british_antilles_desc:0 "Les îles du Vent et les îles Sous-le-Vent forment une chaîne éparpillée de possessions britanniques longeant le bord oriental des Caraïbes. Leur absorption consolide les Petites Antilles sous une administration unique."
  pfp_merge_west_indies_british_antilles_not_yet_absorbed_tt:0 "Les Antilles britanniques n'ont pas encore été absorbées dans les Antilles.\n"
  pfp_merge_west_indies_british_antilles_effect_annex:0 "§YAntilles§! annexe §YAntilles britanniques§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_dutch_antilles:0 "Absorber les Antilles néerlandaises dans les Antilles"
  pfp_merge_west_indies_dutch_antilles_desc:0 "Curaçao et ses îles sœurs au large de la côte vénézuélienne sont les vestiges de l'empire commercial néerlandais dans les Caraïbes, leurs raffineries de pétrole et ports francs en faisant les îles les plus prospères de la région. Leur absorption met fin à la dernière présence coloniale européenne dans la Caraïbe méridionale."
  pfp_merge_west_indies_dutch_antilles_not_yet_absorbed_tt:0 "Les Antilles néerlandaises n'ont pas encore été absorbées dans les Antilles.\n"
  pfp_merge_west_indies_dutch_antilles_effect_annex:0 "§YAntilles§! annexe §YAntilles néerlandaises§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_trinidad:0 "Absorber Trinité-et-Tobago dans les Antilles"
  pfp_merge_west_indies_trinidad_desc:0 "Trinidad, au large de la côte vénézuélienne, est l'île la plus méridionale de la chaîne caribéenne et l'une des plus prospères — ses champs pétrolifères et le cosmopolite Port d'Espagne en faisant une possession de choix. Son absorption dans les Indes occidentales ancre le flanc sud de la fédération."
  pfp_merge_west_indies_trinidad_not_yet_absorbed_tt:0 "Trinité-et-Tobago n'a pas encore été absorbée dans les Antilles.\n"
  pfp_merge_west_indies_trinidad_effect_annex:0 "§YAntilles§! annexe §YTrinité-et-Tobago§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_bermuda:0 "Absorber les Bermudes dans les Antilles"
  pfp_merge_west_indies_bermuda_desc:0 "Les Bermudes se trouvent bien au nord de la chaîne caribéenne principale, une possession britannique au milieu de l'Atlantique dont les plages de sable rose et le mouillage naval stratégique en ont fait un pilier de la puissance britannique dans l'Atlantique occidental. Leur absorption étend la portée des Indes occidentales vers le large."
  pfp_merge_west_indies_bermuda_not_yet_absorbed_tt:0 "Les Bermudes n'ont pas encore été absorbées dans les Antilles.\n"
  pfp_merge_west_indies_bermuda_effect_annex:0 "§YAntilles§! annexe §YBermudes§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_west_indies_belize:0 "Absorber le Belize dans les Antilles"
  pfp_merge_west_indies_belize_desc:0 "Le Honduras britannique est une petite enclave anglophone sur le continent centraméricain, ses liens culturels avec les Caraïbes britanniques en faisant un candidat naturel à l'absorption dans les Indes occidentales plutôt que dans ses voisins hispanophones. Son annexion unit le dernier territoire britannique des Caraïbes occidentales à la fédération."
  pfp_merge_west_indies_belize_not_yet_absorbed_tt:0 "Le Belize n'a pas encore été absorbé dans les Antilles.\n"
  pfp_merge_west_indies_belize_effect_annex:0 "§YAntilles§! annexe §YBelize§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_transcaucasia:0 "Former la Transcaucasie"
  pfp_merge_transcaucasia_desc:0 "La Géorgie, l’Arménie et l’Azerbaïdjan se trouvent au carrefour de l’Europe et de l’Asie, leurs destins entrelacés par les montagnes du Caucase qui les bercent. Le pétrole de Bakou, le manganèse de Chiatura, la soie de Tbilissi — les républiques transcaucasiennes sont plus riches ensemble que séparées. Unies sous le nom de Transcaucasie, elles peuvent résister aux pressions des grandes puissances de chaque côté et forger un avenir selon leurs propres termes."
  pfp_merge_transcaucasia_not_yet_formed_tt:0 "La Transcaucasie n’a pas encore été formée.\n"
  pfp_merge_transcaucasia_puppets_ready_tt:0 "§YGéorgie§!, §YArménie§!, §YAzerbaïdjan§!:\n"
  pfp_merge_transcaucasia_effect_form:0 "§YTranscaucasie§! est formée par la fusion de §YGéorgie§!, §YArménie§!, et §YAzerbaïdjan§!.\n"
  pfp_merge_transcaucasia_effect_annex:0 "§YTranscaucasie§! annexe tous les vassaux précédemment listés gagnant leurs troupes.\n"
  pfp_merge_transcaucasia_effect_cores:0 "§YTranscaucasie§! gagne tous les noyaux et territoires colonisables des vassaux fusionnés.\n"
  pfp_merge_turkestan:0 "Former le Turkestan"
  pfp_merge_turkestan_desc:0 "À travers les steppes et les déserts d’Asie centrale, cinq républiques partagent un héritage turcique commun, les mêmes grands fleuves et le même héritage colonial. Le Kazakhstan, le Kirghizistan, le Tadjikistan, l’Ouzbékistan et le Turkménistan ont été divisés par décret administratif soviétique ; leur unification sous le nom de Turkestan restaurerait une cohérence culturelle et géographique que la cartographie a brisée."
  pfp_merge_turkestan_not_yet_formed_tt:0 "Le Turkestan n’a pas encore été formé.\n"
  pfp_merge_turkestan_puppets_ready_tt:0 "§YKazakhstan§!, §YKirghizistan§!, §YTadjikistan§!, §YOuzbékistan§!, §YTurkménistan§!:\n"
  pfp_merge_turkestan_effect_form:0 "§YTurkestan§! est formée par la fusion de §YKazakhstan§!, §YKirghizistan§!, §YTadjikistan§!, §YOuzbékistan§!, et §YTurkménistan§!.\n"
  pfp_merge_turkestan_effect_annex:0 "§YTurkestan§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_turkestan_effect_cores:0 "§YTurkestan§! gagne tous les noyaux et territoires colonisables des vassaux fusionnés.\n"
  pfp_merge_indochina:0 "Former l'Indochine"
  pfp_merge_indochina_desc:0 "Le Viêt Nam, le Laos et le Cambodge furent liés ensemble sous l’administration française sous le nom d’Indochine — une seule unité coloniale gouvernée depuis Hanoï et Saigon. Les fleuves qui traversent ces terres, les routes commerciales, les traditions bouddhistes communes et des siècles d’histoire entrelacée plaident pour l’unité. Fusionnées sous le nom d’Indochine, elles peuvent parler d’une seule voix contre toute puissance qui exploiterait leur division."
  pfp_merge_indochina_not_yet_formed_tt:0 "L'Indochine n'a pas encore été formée.\n"
  pfp_merge_indochina_puppets_ready_tt:0 "§YViêt Nam§!, §YLaos§!, §YCambodge§!:\n"
  pfp_merge_indochina_effect_form:0 "§YIndochine§! est formée par la fusion de §YViêt Nam§!, §YLaos§!, et §YCambodge§!.\n"
  pfp_merge_indochina_effect_annex:0 "§YIndochine§! annexe tous les vassaux précédemment listés gagnant leurs troupes.\n"
  pfp_merge_indochina_effect_cores:0 "§YIndochine§! gagne tous les noyaux et territoires colonisables des vassaux fusionnés.\n"
  pfp_merge_indochina_is_formed_tt:0 "L'Indochine a été formée.\n"
  pfp_merge_indochina_siam:0 "Absorber le Siam"
  pfp_merge_indochina_siam_desc:0 "Le Siam se distingue de l’Indochine française — jamais colonisé, jamais brisé. Mais entouré de territoires désormais unis sous l’administration indochinoise, il ne peut rester une île d’indépendance. Le moment est venu d’intégrer le Siam dans la grande union indochinoise."
  pfp_merge_indochina_siam_not_yet_absorbed_tt:0 "Le Siam n'a pas encore été absorbé par l'Indochine.\n"
  pfp_merge_indochina_siam_effect_annex:0 "§YIndochine§! annexe §YSiam§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_indochina_burma:0 "Absorber la Birmanie"
  pfp_merge_indochina_burma_desc:0 "La Birmanie était longtemps liée à l’Inde sous l’administration britannique, mais sa géographie la place fermement dans la sphère indochinoise. La vallée de l’Irrawaddy, la foi bouddhiste partagée avec ses voisins, les rizières qui nourrissent la région — la Birmanie appartient au monde indochinois. Son absorption achève l’union continentale."
  pfp_merge_indochina_burma_not_yet_absorbed_tt:0 "La Birmanie n'a pas encore été absorbée par l'Indochine.\n"
  pfp_merge_indochina_burma_effect_annex:0 "§YIndochine§! annexe §YBirmanie§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_indochina_malaysia:0 "Absorber la Malaisie"
  pfp_merge_indochina_malaysia_desc:0 "La péninsule Malaise relie l’Indochine continentale au monde insulaire du Pacifique. Les plantations de caoutchouc de la Malaisie, ses mines d’étain et sa position stratégique astride le détroit de Malacca en font un ajout indispensable à toute union indochinoise avec des ambitions dans la région élargie."
  pfp_merge_indochina_malaysia_not_yet_absorbed_tt:0 "La Malaisie n'a pas encore été absorbée par l'Indochine.\n"
  pfp_merge_indochina_malaysia_effect_annex:0 "§YIndochine§! annexe §YMalaisie§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_indochina_singapore:0 "Absorber Singapour"
  pfp_merge_indochina_singapore_desc:0 "À la pointe sud de la péninsule Malaise, Singapour commande le détroit étroit par lequel doit passer la moitié du commerce mondial. Son port compte parmi les plus animés de la planète, sa position parmi les plus stratégiques. Absorbée dans l’Indochine, Singapour devient la porte maritime d’un État unié d’Asie du Sud-Est."
  pfp_merge_indochina_singapore_not_yet_absorbed_tt:0 "Singapour n'a pas encore été absorbé par l'Indochine.\n"
  pfp_merge_indochina_singapore_effect_annex:0 "§YIndochine§! annexe §YSingapour§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_australasia:0 "Former l'Australasie"
  pfp_merge_australasia_desc:0 "L’Australie, la Nouvelle-Zélande et la Papouasie-Nouvelle-Guinée ancrent le Pacifique austral — trois territoires britanniques dont la proximité et l’héritage commun font de l’unité une aspiration naturelle. Le vaste continent, l’île au bout du monde et la péninsule tropicale commandent ensemble un océan. Unies sous le nom d’Australasie, elles peuvent projeter leur puissance à travers le Pacifique et sécuriser leur avenir maritime commun."
  pfp_merge_australasia_not_yet_formed_tt:0 "L'Australasie n'a pas encore été formée.\n"
  pfp_merge_australasia_puppets_ready_tt:0 "§YAustralie§!, §YNouvelle-Zélande§!, §YPapouasie-Nouvelle-Guinée§!:\n"
  pfp_merge_australasia_effect_form:0 "§YAustralasie§! est formée par la fusion de §YAustralie§!, §YNouvelle-Zélande§!, et §YPapouasie-Nouvelle-Guinée§!.\n"
  pfp_merge_australasia_effect_annex:0 "§YAustralasie§! annexe tous les vassaux précédemment listés gagnant leurs troupes.\n"
  pfp_merge_australasia_effect_cores:0 "§YAustralasie§! gagne tous les noyaux et territoires colonisables des vassaux fusionnés.\n"
  pfp_merge_australasia_is_formed_tt:0 "L'Australasie a été formée.\n"
  pfp_merge_australasia_solomon_islands:0 "Absorber les Îles Salomon"
  pfp_merge_australasia_solomon_islands_desc:0 "La chaîne des Îles Salomon s’étire vers le nord-est depuis la Papouasie-Nouvelle-Guinée jusqu’au cœur du Pacifique. Leurs îles font depuis longtemps partie du monde pacifique britannique, leur destin lié à l’Australie par la proximité et l’administration coloniale. Leur absorption dans l’Australasie consolide le Pacifique sud-ouest sous une seule bannière."
  pfp_merge_australasia_solomon_islands_not_yet_absorbed_tt:0 "Les Îles Salomon n'ont pas encore été absorbées par l'Australasie.\n"
  pfp_merge_australasia_solomon_islands_effect_annex:0 "§YAustralasie§! annexe §YÎles Salomon§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_australasia_bougainville:0 "Absorber Bougainville"
  pfp_merge_australasia_bougainville_desc:0 "Bougainville, bien que géographiquement plus proche des Îles Salomon, était administré sous le mandat australien sur la Nouvelle-Guinée. Sa position dans l’archipel Bismarck et ses ressources en cuivre font de son absorption dans l’Australasie une extension naturelle de l’autorité régionale."
  pfp_merge_australasia_bougainville_not_yet_absorbed_tt:0 "Bougainville n'a pas encore été absorbé par l'Australasie.\n"
  pfp_merge_australasia_bougainville_effect_annex:0 "§YAustralasie§! annexe §YBougainville§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_australasia_new_caledonia:0 "Absorber la Nouvelle-Calédonie"
  pfp_merge_australasia_new_caledonia_desc:0 "La Nouvelle-Calédonie se trouve à l’extrémité sud de la mer de Corail, ses réserves de nickel comptant parmi les plus riches de la planète. Possession française de longue date, sa géographie la place pleinement dans la sphère australasienne. Son absorption ajoute une profondeur stratégique et des richesses minérales à l’union pacifique."
  pfp_merge_australasia_new_caledonia_not_yet_absorbed_tt:0 "La Nouvelle-Calédonie n'a pas encore été absorbée par l'Australasie.\n"
  pfp_merge_australasia_new_caledonia_effect_annex:0 "§YAustralasie§! annexe §YNouvelle-Calédonie§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_australasia_vanuatu:0 "Absorber Vanuatu"
  pfp_merge_australasia_vanuatu_desc:0 "Les Nouvelles-Hébrides étaient administrées sous un curieux Condominium anglo-français — un protectorat conjoint gouverné par deux puissances simultanément. L’absorption du Vanuatu dans l’Australasie met fin à cette anomalie coloniale et intègre l’archipel dans l’union pacifique que la géographie a toujours prévue."
  pfp_merge_australasia_vanuatu_not_yet_absorbed_tt:0 "Vanuatu n'a pas encore été absorbé par l'Australasie.\n"
  pfp_merge_australasia_vanuatu_effect_annex:0 "§YAustralasie§! annexe §YVanuatu§!, gagnant ses noyaux et territoires colonisables.\n"
  pfp_merge_levant:0 "Former le Levant"
  pfp_merge_levant_desc:0 "La Palestine, la Jordanie, le Liban et la Syrie partagent plus qu’une frontière — ils partagent le Croissant fertile, le berceau de la civilisation elle-même. Des rives de la Méditerranée aux sables du désert syrien, ces terres ont passé d’empire en empire depuis des millénaires. Sous un gouvernement unifié sous le nom de Levant, ils peuvent enfin déterminer leur propre destin."
  pfp_merge_levant_not_yet_formed_tt:0 "Le Levant n’a pas encore été formé.\n"
  pfp_merge_levant_puppets_ready_tt:0 "§YJordanie§!, §YPalestine§!, §YLiban§!, §YSyrie§!:\n"
  pfp_merge_levant_effect_form:0 "§YLevant§! est formée par la fusion de §YJordanie§!, §YPalestine§!, §YLiban§!, et §YSyrie§!.\n"
  pfp_merge_levant_effect_annex:0 "§YLevant§! annexe tous les vassaux précédemment listés gagnant leurs troupes.\n"
  pfp_merge_levant_effect_cores:0 "§YLevant§! gagne tous les noyaux et territoires colonisables des vassaux fusionnés.\n"
  pfp_merge_mittelafrika:0 "Former la Mittelafrika"
  pfp_merge_mittelafrika_desc:0 "La vision coloniale allemande d’un dominion centrafriquain unifié ne s’est jamais réalisée lors de la Grande Guerre. Mais les pièces demeurent : le Cameroun à l’ouest, le Tanganyika à l’est, le Sud-Ouest africain au sud. Ces territoires consolidés sous notre administration, le rêve d’un empire africain continental s’étendant de mer en mer pourrait encore se réaliser."
  pfp_merge_mittelafrika_not_yet_formed_tt:0 "Mittelafrika n’a pas encore été formé.\n"
  pfp_merge_mittelafrika_puppets_ready_tt:0 "§YCameroun§!, §YTanganyika§!, §YAfrique du Sud-Ouest§!:\n"
  pfp_merge_mittelafrika_effect_form:0 "§YMittelafrika§! est formée par la fusion de §YCameroun§!, §YTanganyika§!, et §YAfrique du Sud-Ouest§!.\n"
  pfp_merge_mittelafrika_effect_annex:0 "§YMittelafrika§! annexe tous les vassaux précédemment listés gagnant leurs troupes.\n"
  pfp_merge_mittelafrika_effect_cores:0 "§YMittelafrika§! gagne tous les noyaux et territoires colonisables des vassaux fusionnés.\n"
  pfp_merge_mittelafrika_is_formed_tt:0 "Mittelafrika a été formé.\n"
  pfp_merge_mittelafrika_togo:0 "Absorber le Togo"
  pfp_merge_mittelafrika_togo_desc:0 "Le Togo était un protectorat allemand avant la Grande Guerre, partagé entre la France et la Grande-Bretagne à son issue. En tant qu’ancienne colonie allemande, sa place au sein du nouveau Mittelafrika est naturelle. Son absorption complète le flanc occidental de l’empire centrafriquain."
  pfp_merge_mittelafrika_togo_not_yet_absorbed_tt:0 "§YTogo§! n’a pas encore été absorbé par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_togo_effect_annex:0 "§YMittelafrika§! absorbe §YTogo§! (Q40), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_ruanda_urundi:0 "Absorber le Ruanda-Urundi"
  pfp_merge_mittelafrika_ruanda_urundi_desc:0 "Le Ruanda-Urundi, administré sous mandat belge depuis la Grande Guerre, se trouve au cœur de l’Afrique entre le Tanganyika et le Congo. Son absorption dans Mittelafrika comble le fossé entre les possessions est-africaines et centre-africaines de l’Allemagne."
  pfp_merge_mittelafrika_ruanda_urundi_not_yet_absorbed_tt:0 "§YRuanda-Urundi§! n’a pas encore été absorbé par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_ruanda_urundi_effect_annex:0 "§YMittelafrika§! absorbe §YRuanda-Urundi§! (Q66), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_gabon:0 "Absorber le Gabon"
  pfp_merge_mittelafrika_gabon_desc:0 "Les forêts tropicales équatoriales du Gabon et le bassin du fleuve Ogooué en font l’un des territoires les plus riches du continent. Ancienne possession française, sa position stratégique sur la côte atlantique en fait une acquisition vitale pour l’accès occidental de Mittelafrika."
  pfp_merge_mittelafrika_gabon_not_yet_absorbed_tt:0 "§YGabon§! n’a pas encore été absorbé par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_gabon_effect_annex:0 "§YMittelafrika§! absorbe §YGabon§! (Q38), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_congo_brazzaville:0 "Absorber le Congo-Brazzaville"
  pfp_merge_mittelafrika_congo_brazzaville_desc:0 "Le Congo français se trouve sur la rive nord du fleuve Congo, directement en face du Congo belge. Ses forêts et ses fleuves alimentent le cœur de l’Afrique, et son absorption dans Mittelafrika consolide l’influence allemande le long du bassin congolais."
  pfp_merge_mittelafrika_congo_brazzaville_not_yet_absorbed_tt:0 "§YCongo-Brazzaville§! n’a pas encore été absorbé par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_congo_brazzaville_effect_annex:0 "§YMittelafrika§! absorbe §YCongo-Brazzaville§! (Q39), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_northern_rhodesia:0 "Absorber la Rhoésie du Nord"
  pfp_merge_mittelafrika_northern_rhodesia_desc:0 "La ceinture cuivrière de la Rhodésie du Nord compte parmi les gisements minéraux les plus riches d’Afrique. Protectorat britannique reliant la route du Cap au Caire, son absorption dans Mittelafrika coupe cette artère impériale et livre une vaste base de ressources à l’État centrafriquain."
  pfp_merge_mittelafrika_northern_rhodesia_not_yet_absorbed_tt:0 "§YRhodésie du Nord§! n’a pas encore été absorbée par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_northern_rhodesia_effect_annex:0 "§YMittelafrika§! absorbe §YRhodésie du Nord§! (Q63), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_southern_rhodesia:0 "Absorber la Rhoésie du Sud"
  pfp_merge_mittelafrika_southern_rhodesia_desc:0 "La Rhodésie du Sud, peuplée par des colons britanniques sous Cecil Rhodes, garde la route entre le Limpopo et le Zambezi. Ses hauts plateaux fertiles et sa population croissante de colons en font un prix valant la peine d’être absorbé dans le Mittelafrika en expansion."
  pfp_merge_mittelafrika_southern_rhodesia_not_yet_absorbed_tt:0 "§YRhodésie du Sud§! n’a pas encore été absorbée par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_southern_rhodesia_effect_annex:0 "§YMittelafrika§! absorbe §YRhodésie du Sud§! (Q69), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_angola:0 "Absorber l’Angola"
  pfp_merge_mittelafrika_angola_desc:0 "L’Angola s’étend de la côte atlantique jusqu’au fond de l’intérieur africain, son plateau riche en diamants, pétrole et terres fertiles. Possession portugaise depuis des siècles, son absorption dans Mittelafrika offre à l’État centrafriquain un accès vital à l’Atlantique."
  pfp_merge_mittelafrika_angola_not_yet_absorbed_tt:0 "§YAngola§! n’a pas encore été absorbé par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_angola_effect_annex:0 "§YMittelafrika§! absorbe §YAngola§! (Q67), gagnant son territoire et ses troupes.\n"
  pfp_merge_mittelafrika_mozambique:0 "Absorber le Mozambique"
  pfp_merge_mittelafrika_mozambique_desc:0 "Le long littoral océanique indien du Mozambique et le port de Lorenzo Marques contrôlent l’approche maritime de l’Afrique australe enclávée. Son absorption dans Mittelafrika achève la façade maritime orientale de l’empire centrafriquain."
  pfp_merge_mittelafrika_mozambique_not_yet_absorbed_tt:0 "§YMozambique§! n’a pas encore été absorbé par §YMittelafrika§!.\n"
  pfp_merge_mittelafrika_mozambique_effect_annex:0 "§YMittelafrika§! absorbe §YMozambique§! (Q68), gagnant son territoire et ses troupes.\n"




