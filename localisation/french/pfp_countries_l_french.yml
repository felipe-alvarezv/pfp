  # United States
  pfp_merge_western_usa:0 "Former les États-Unis occidentaux"
  pfp_merge_western_usa_desc:0 "La côte du Pacifique et les Montagnes Rocheuses ont toujours été le bord sauvage et indomptable de l'expérience américaine — des rivages ensoleillés de Californie aux sommets enneigés des Cascades. Avant que le continent puisse être réunifié, l'Ouest doit d'abord parler d'une seule voix."
  pfp_merge_western_usa_not_yet_formed_tt:0 "Les États-Unis occidentaux n'ont pas encore été formés.\n"
  pfp_merge_western_usa_effect_form:0 "§YÉtats-Unis occidentaux§! est formée par la fusion de §YÉtats-Unis Pacifique§! et §YÉtats-Unis Rocheuses§!.\n"
  pfp_merge_western_usa_effect_annex:0 "§YÉtats-Unis occidentaux§! annexent tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_western_usa_effect_cores:0 "§YÉtats-Unis occidentaux§! obtiennent les noyaux et les revendications des pantins annexés.\n"

  pfp_merge_usa:0 "Former les États-Unis"
  pfp_merge_usa_desc:0 "Des usines et des ports du nord-est aux champs et aux villes du sud, en passant par le grand cœur industriel du midwest, ces trois régions furent les piliers de la nation la plus puissante que le monde ait jamais connue. L'Union a été préservée une fois au prix énorme ; elle peut être rebâtie."
  pfp_merge_usa_not_yet_formed_tt:0 "Les États-Unis n'ont pas encore été formés.\n"
  pfp_merge_usa_effect_form:0 "§YÉtats-Unis orientaux§! est formée par la fusion de §YNortheastern U.S.§!, §YMidwestern U.S.§!, et §YSouthern U.S.§!.\n"
  pfp_merge_usa_effect_annex:0 "§YÉtats-Unis orientaux§! annexent tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_usa_effect_cores:0 "§YÉtats-Unis orientaux§! acquièrent les noyaux et revendications des marionnettes annexées.\n"

  pfp_merge_western_usa_is_formed_tt:0 "Les États-Unis occidentaux ont été formés.\n"
  pfp_merge_eastern_usa_is_formed_tt:0 "Les États-Unis orientaux ont été formés.\n"

  pfp_merge_united_states:0 "Former les États-Unis"
  pfp_merge_united_states_desc:0 "Des déserts brûlés du Sud-Ouest aux corridors industriels du Nord-Est, des champs dorés du Midwest aux bayous du Deep South, l'Amérique n’a jamais été qu'une région — elle était toutes. L'Est et l'Ouest ont chacun prouvé leur force. Il leur reste à prouver qu'ils ne font qu'une seule nation."
  pfp_merge_united_states_not_yet_formed_tt:0 "Les États-Unis n'ont pas encore été formés.\n"
  pfp_merge_united_states_effect_form:0 "§YÉtats-Unis§! est formée par la fusion de §YÉtats-Unis occidentaux§! et §YÉtats-Unis orientaux§!.\n"
  pfp_merge_united_states_effect_annex:0 "§YÉtats-Unis§! annexent tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_united_states_effect_cores:0 "§YÉtats-Unis§! obtiennent les noyaux et les revendications des pantins annexés.\n"



  # China
  pfp_merge_china:0 "Former la Chine"
  pfp_merge_china_desc:0 "Pendant plus de deux mille ans, les provinces du Royaume du Milieu répondaient à une seule cour, liées par le Mandat du Ciel et l'ordre confucéen qui a survécu à chaque dynastie. Chacune porte la mémoire d'une Chine unifiée — la fragmentation fut une catastrophe, non une destinée."
  pfp_merge_china_not_yet_formed_tt:0 "La Chine n'a pas encore été formée.\n"
  pfp_merge_china_effect_form:0 "§YLa Chine§! est formée par la fusion de §YZhili§!, §YShandong§!, §YHenan§!, §YShanxi§!, §YLiangjiang§!, §YMin-Zhe§!, §YHuguang§!, §YLiangguang§!, §YYun-Gui§!, et §YSichuan§!.\n"
  pfp_merge_china_effect_annex:0 "§YLa Chine§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_china_effect_cores:0 "§YLa Chine§! acquiert les noyaux et revendications des marionnettes annexées.\n"

  pfp_merge_china_manchuria:0 "Absorber la Mandchourie dans la Chine"
  pfp_merge_china_manchuria_desc:0 "La patrie ancestrale de la dynastie Qing et le moteur industriel du nord-est de la Chine, façonné en une région d'industrie lourde et de chemins de fer. Son charbon et son fer ont contribué à alimenter le monde moderne ; ils alimenteront désormais la restauration de la Chine."
  pfp_merge_china_is_formed_tt:0 "La Chine a été formée.\n"
  pfp_merge_china_manchuria_not_yet_absorbed_tt:0 "La Mandchourie n'a pas encore été absorbée dans la Chine.\n"
  pfp_merge_china_manchuria_effect_annex:0 "§YLa Chine§! annexe §YLa Mandchourie§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_china_inner_mongolia:0 "Absorber la Mongolie Intérieure dans la Chine"
  pfp_merge_china_inner_mongolia_desc:0 "Les steppes du nord de la Chine ont marqué la frontière entre les terres agricoles et la steppe nomade depuis l'époque des Xiongnu — une frontière si disputée qu'elle a inspiré la Grande Muraille. Son incorporation étend l'autorité chinoise sur le bord méridional du plateau mongol et sécurise les approches de Pékin."
  pfp_merge_china_inner_mongolia_not_yet_absorbed_tt:0 "La Mongolie Intérieure n'a pas encore été absorbée dans la Chine.\n"
  pfp_merge_china_inner_mongolia_effect_annex:0 "§YLa Chine§! annexe §YLa Mongolie Intérieure§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_china_shaan_gan:0 "Absorber le Shaan-Gan dans la Chine"
  pfp_merge_china_shaan_gan_desc:0 "Ce territoire berce le grand méandre du Fleuve Jaune et l'ancienne capitale de Chang'an — aujourd'hui Xian — où quatorze dynasties impériales tenaient cour à l'axe de la Route de la Soie. Cœur de la Chine pendant trois mille ans, son retour complète notre emprise sur le nord-ouest."
  pfp_merge_china_shaan_gan_not_yet_absorbed_tt:0 "Le Shaan-Gan n'a pas encore été absorbé dans la Chine.\n"
  pfp_merge_china_shaan_gan_effect_annex:0 "§YLa Chine§! annexe §YLe Shaan-Gan§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_china_qinghai:0 "Absorber le Qinghai dans la Chine"
  pfp_merge_china_qinghai_desc:0 "Haut sur le bord nord-est du plateau tibétain, ce territoire berce les sources du Fleuve Jaune et du Yangtsé — les deux artères de la civilisation chinoise. Son incorporation ancre l'intérieur occidental de la Chine et ferme la porte géographique vers le Tibet."
  pfp_merge_china_qinghai_not_yet_absorbed_tt:0 "Le Qinghai n'a pas encore été absorbé dans la Chine.\n"
  pfp_merge_china_qinghai_effect_annex:0 "§YLa Chine§! annexe §YLe Qinghai§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_china_taiwan:0 "Absorber Taïwan dans la Chine"
  pfp_merge_china_taiwan_desc:0 "Cette île se trouve de l'autre côté d'un détroit si étroit qu'on peut voir le continent par temps clair. Elle a changé de mains mais n'a jamais cessé d'être liée au destin du continent ; le moment est venu de la ramener dans le giron national."
  pfp_merge_china_taiwan_not_yet_absorbed_tt:0 "Taïwan n'a pas encore été absorbé dans la Chine.\n"
  pfp_merge_china_taiwan_effect_annex:0 "§YLa Chine§! annexe §YTaïwan§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_china_east_turkestan:0 "Absorber le Turkestan oriental dans la Chine"
  pfp_merge_china_east_turkestan_desc:0 "Les bassins désertiques et les villes-oasis de l'extrême occident furent là où l'ancienne Route de la Soie transportait la soie vers l'ouest et les idées vers l'est. Ses vastes steppes et ses richesses minérales le rendent stratégiquement indispensable ; son incorporation complète la frontière d'Asie centrale de la Chine."
  pfp_merge_china_east_turkestan_not_yet_absorbed_tt:0 "Le Turkestan oriental n'a pas encore été absorbé dans la Chine.\n"
  pfp_merge_china_east_turkestan_requires_border_tt:0 "Le Tibet, le Qinghai ou le Shaan-Gan doit d'abord être absorbé dans la Chine.\n"
  pfp_merge_china_east_turkestan_effect_annex:0 "§YLa Chine§! annexe §YLe Turkestan oriental§!, gagnant ses noyaux et territoires annexables.\n"

  pfp_merge_china_tibet:0 "Absorber le Tibet dans la Chine"
  pfp_merge_china_tibet_desc:0 "Le toit du monde — un plateau si haut que les armées qui le traversent ressentent l'altitude avant l'ennemi. Les rivières qui descendent de ses glaciers arrosent la moitié de l'Asie. L'intégrer sous un contrôle consolidé sécurise l'ensemble de notre frontière sud-ouest."
  pfp_merge_china_tibet_not_yet_absorbed_tt:0 "Le Tibet n'a pas encore été absorbé dans la Chine.\n"
  pfp_merge_china_tibet_effect_annex:0 "§YLa Chine§! annexe §YLe Tibet§!, gagnant ses noyaux et territoires annexables.\n"

  # East Africa
  pfp_merge_east_africa:0 "Former l'Afrique de l'Est"
  pfp_merge_east_africa_desc:0 "Des sources du Nil au Soudan et en Ouganda jusqu'à la côte somalienne, des hauts plateaux éthiopiens qui seuls ont résisté à la colonisation aux grandes plaines de savane du Tanganyika, l'Afrique orientale embrasse toute l'étendue du corridor oriental du continent. Ces terres partagent les eaux du bassin du Nil, le commerce de mousson de l'océan Indien, et une histoire façonnée par les mêmes royaumes des hautes terres, cités-États côtières et civilisations du Rift. Divisées en fragments par les frontières coloniales, leur unification forgerait la puissance dominante de tout le versant oriental de l'Afrique."
  pfp_merge_east_africa_not_yet_formed_tt:0 "L'Afrique de l'Est n'a pas encore été formée.\n"
  pfp_merge_east_africa_effect_form:0 "§YL'Afrique de l'Est§! est formée par la fusion de §YEthiopia§!, §YEritrea§!, §YDjibouti§!, §YSomaliland§!, §YSomalia§!, §YKenya§!, §YUganda§!, §YTanganyika§!, et §YSudan§!.\n"
  pfp_merge_east_africa_effect_annex:0 "§YL'Afrique de l'Est§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_east_africa_effect_cores:0 "§YL'Afrique de l'Est§! acquiert les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_east_africa_is_formed_tt:0 "L'Afrique de l'Est a été formée.\n"














  pfp_merge_east_africa_ruanda_urundi:0 "Absorber le Ruanda-Urundi dans l'Afrique de l'Est"
  pfp_merge_east_africa_ruanda_urundi_desc:0 "Niché dans les hautes terres au-dessus du bassin du Congo, c'est l'un des territoires les plus densément peuplés d'Afrique — petit en superficie mais significatif géographiquement, coincé entre les Grands Lacs et l'escarpement de la Rift Valley. Son incorporation comble le vide de notre frontière en Afrique centrale."
  pfp_merge_east_africa_ruanda_urundi_not_yet_absorbed_tt:0 "Le Ruanda-Urundi n'a pas encore été absorbé dans l'Afrique de l'Est.\n"
  pfp_merge_east_africa_ruanda_urundi_effect_annex:0 "§YL'Afrique de l'Est§! annexe §YLe Ruanda-Urundi§!, gagnant ses noyaux et territoires annexables.\n"





  pfp_merge_north_africa:0 "Former l'Afrique du Nord"
  pfp_merge_north_africa_desc:0 "Des montagnes de l'Atlas au Maroc jusqu'aux rives du Nil, la côte nord-africaine a été le carrefour de la civilisation méditerranéenne pendant quatre mille ans. Jadis unie sous Rome et les grands califats islamiques, le Maghreb et la vallée du Nil partagent un héritage commun que les frontières coloniales ont longtemps divisé. Leur unification forgerait une puissance capable de remodeler l'ensemble du monde méditerranéen."
  pfp_merge_north_africa_not_yet_formed_tt:0 "L'Afrique du Nord n'a pas encore été formée.\n"
  pfp_merge_north_africa_effect_form:0 "§YL'Afrique du Nord§! est formée par la fusion de §YMorocco§!, §YAlgeria§!, §YTunisia§!, §YLibya§!, et §YEgypt§!.\n"
  pfp_merge_north_africa_effect_annex:0 "§YL'Afrique du Nord§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_north_africa_effect_cores:0 "§YL'Afrique du Nord§! obtient les noyaux et les revendications des marionnettes annexées.\n"
  pfp_merge_north_africa_is_formed_tt:0 "L'Afrique du Nord a été formée.\n"











  pfp_merge_north_africa_western_sahara:0 "Absorber le Sahara occidental dans l'Afrique du Nord"
  pfp_merge_north_africa_western_sahara_desc:0 "S'étendant dans le Sahara depuis la rive atlantique, ce vaste territoire à peine peuplé garde les approches occidentales du Maghreb. Son absorption ancre le flanc atlantique de l'Afrique du Nord et sécurise la frontière désertique méridionale."
  pfp_merge_north_africa_western_sahara_not_yet_absorbed_tt:0 "Le Sahara occidental n'a pas encore été absorbé dans l'Afrique du Nord.\n"
  pfp_merge_north_africa_western_sahara_effect_annex:0 "§YL'Afrique du Nord§! annexe §YLe Sahara occidental§!, gagnant ses noyaux et territoires incorporables.\n"

  pfp_merge_north_africa_rif:0 "Absorber le Rif dans l'Afrique du Nord"
  pfp_merge_north_africa_rif_desc:0 "Adossée au littoral méditerranéen du nord du Maroc, la montagne du Rif a abrité une courte et farouche république qui défia l'Espagne et la France avant d'être écrasée en 1926. Ses clans berbères n'ont jamais pleinement accepté la domination étrangère. Intégrer le Rif dans l'Afrique du Nord est autant un acte de réconciliation que de conquête."
  pfp_merge_north_africa_rif_not_yet_absorbed_tt:0 "Le Rif n'a pas encore été absorbé dans l'Afrique du Nord.\n"
  pfp_merge_north_africa_rif_effect_annex:0 "§YL'Afrique du Nord§! annexe §YLe Rif§!, gagnant ses noyaux et territoires incorporables.\n"

  pfp_merge_west_africa:0 "Former l'Afrique de l'Ouest"
  pfp_merge_west_africa_desc:0 "Des marges sahariennes de la Mauritanie et du Mali aux forêts tropicales de la Côte-de-l'Or et du delta du Niger, l'Afrique de l'Ouest englobe le cœur des anciens empires sahéliens. Les royaumes du Mali, de Songhaï et du Ghana dominèrent jadis les routes commerciales trans-sahariennes qui reliaient la Méditerranée à l'Afrique subsaharienne. Dispersées par les frontières coloniales en une dizaine de fragments, ces terres partagent de profonds liens de culture, de religion et d'histoire. Leur unification restaurerait une grande puissance sur la côte atlantique de l'Afrique."
  pfp_merge_west_africa_not_yet_formed_tt:0 "L'Afrique de l'Ouest n'a pas encore été formée.\n"
  pfp_merge_west_africa_effect_form:0 "§YL'Afrique de l'Ouest§! est formée par la fusion de §YNiger§!, §YMali§!, §YNigeria§!, §YTogo§!, §YDahomey§!, §YGold Coast§!, §YUpper Volta§!, §YIvory Coast§!, §YGuinea§!, §YSierra Leone§!, §YSenegal§!, §YGambia§!, et §YMauritania§!.\n"
  pfp_merge_west_africa_effect_annex:0 "§YL'Afrique de l'Ouest§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_west_africa_effect_cores:0 "Tous les noyaux et territoires incorporables sont transférés à §YL'Afrique de l'Ouest§!.\n"
  pfp_merge_west_africa_is_formed_tt:0 "L'Afrique de l'Ouest a été formée.\n"
  pfp_merge_west_africa_guinea_bissau:0 "Absorber la Guinée-Bissau dans l'Afrique de l'Ouest"
  pfp_merge_west_africa_guinea_bissau_desc:0 "Une étroite bande de côte et d'intérieur taillée dans l'arrière-pays sénégambien, la Guinée-Bissau a passé des siècles comme relais du commerce portugais des esclaves avant de devenir un arrière-pays oublié de l'ère coloniale. Ses peuples partagent langue et culture avec leurs voisins de chaque côté de la frontière. L'absorber dans l'Afrique de l'Ouest compléterait le bord côtier du nouvel État."
  pfp_merge_west_africa_guinea_bissau_not_yet_absorbed_tt:0 "La Guinée-Bissau n'a pas encore été absorbée dans l'Afrique de l'Ouest.\n"
  pfp_merge_west_africa_guinea_bissau_effect_annex:0 "§YL'Afrique de l'Ouest§! annexe §YLa Guinée-Bissau§!, gagnant ses noyaux et territoires incorporables.\n"
  pfp_merge_west_africa_liberia:0 "Absorber le Libéria dans l'Afrique de l'Ouest"
  pfp_merge_west_africa_liberia_desc:0 "Fondé au XIXe siècle comme refuge pour les esclaves américains libérés, le Libéria se distingue de toutes les autres nations de la côte ouest-africaine — indépendant de nom tandis que les puissances coloniales se partageaient le reste de la région entre elles. Sa classe dirigeante américo-libérienne a maintenu une souveraineté fragile entre les grands empires européens. Dans le nouvel ordre qui se dessine, l'absorption dans une Afrique de l'Ouest unifiée l'ancrerait enfin à son environnement africain."
  pfp_merge_west_africa_liberia_not_yet_absorbed_tt:0 "Le Libéria n'a pas encore été absorbé dans l'Afrique de l'Ouest.\n"
  pfp_merge_west_africa_liberia_effect_annex:0 "§YL'Afrique de l'Ouest§! annexe §YLe Libéria§!, gagnant ses noyaux et territoires incorporables.\n"
  pfp_merge_west_africa_cape_verde:0 "Absorber le Cap-Vert dans l'Afrique de l'Ouest"
  pfp_merge_west_africa_cape_verde_desc:0 "Dispersé dans l'Atlantique à quelque cinq cents kilomètres au large des côtes sénégalaises, l'archipel du Cap-Vert était inhabité lorsque les marins portugais y débarquèrent pour la première fois au XVe siècle. Il devint une escale vitale du commerce atlantique, reliant l'Europe, l'Afrique et les Amériques. Distant du continent, son intégration dans l'Afrique de l'Ouest étendrait la portée du nouvel État au-delà des mers."
  pfp_merge_west_africa_cape_verde_not_yet_absorbed_tt:0 "Le Cap-Vert n'a pas encore été absorbé dans l'Afrique de l'Ouest.\n"
  pfp_merge_west_africa_cape_verde_effect_annex:0 "§YL'Afrique de l'Ouest§! annexe §YLe Cap-Vert§!, gagnant ses noyaux et territoires incorporables.\n"
  pfp_merge_eastern_russia:0 "Former Eastern Russia"
  pfp_merge_france:0 "Former la France"
  pfp_merge_france_alps:0 "Absorber the French Alps dans France"
  pfp_merge_germany:0 "Former l'Allemagne"
  pfp_merge_germany_konigsberg:0 "Absorber Königsberg dans Germany"
  pfp_merge_great_britain:0 "Former la Grande-Bretagne"
  pfp_merge_great_britain_northern_ireland:0 "Absorber Northern Ireland dans Great Britain"
  pfp_merge_iberia:0 "Former l'Ibérie"
  pfp_merge_italy:0 "Former l'Italie"
  pfp_merge_italy_sardinia:0 "Absorber Sardinia dans Italy"
  pfp_merge_japan:0 "Former le Japon"
  pfp_merge_russia:0 "Former Russia"
  pfp_merge_western_russia:0 "Former Western Russia"
  pfp_merge_western_russia_karelia:0 "Absorber Karelia dans Western Russia"
  pfp_merge_western_russia_murmansk:0 "Absorber Murmansk dans Western Russia"
  pfp_merge_western_russia_northern_caucasus:0 "Absorber Northern Caucasus dans Western Russia"
  pfp_merge_yugoslavia:0 "Former la Yougoslavie"
  pfp_merge_yugoslavia_macedonia:0 "Absorber Macedonia dans Yugoslavia"
  pfp_merge_yugoslavia_montenegro:0 "Absorber Montenegro dans Yugoslavia"
  pfp_merge_eastern_russia_desc:0 "Au-delà des monts Oural s'étend la plus grande masse continentale du monde, depuis l'épine dorsale montagneuse de l'Asie jusqu'à Vladivostok sur la côte pacifique. Le Transsibérien fut construit pour rendre cette immensité gouvernable ; il reliera désormais ces territoires sous une seule autorité."
  pfp_merge_france_alps_desc:0 "Une forteresse naturelle sur la frontière sud-est de la France — les cols et sommets qui séparent la vallée du Rhône de la plaine du Pô ont été disputés depuis qu'Hannibal y fit passer ses éléphants. Leur incorporation complète la frontière alpine de la France et ferme les approches depuis l'Italie."
  pfp_merge_france_desc:0 "Liberté, égalité, fraternité — les idéaux de la République n'appartiennent à aucune région en particulier ; ils appartiennent à toute la France. Le nord industriel, marqué par deux grandes guerres livrées sur son sol, et le sud ensoleillé aux racines plongeant dans la Gaule romaine, sont deux moitiés d'une même civilisation. Le tricolore a flotté sur les deux ; il flottera de nouveau."
  pfp_merge_germany_desc:0 "Bismarck a forgé la nation allemande par le fer et le sang — il a fallu deux guerres catastrophiques pour la briser à nouveau. Qu'elle soit divisée le long du Rhin, de l'Elbe ou d'anciennes frontières hohenzollern, les terres allemandes partagent une langue, une culture et un millénaire d'histoire commune remontant au Saint-Empire romain germanique."
  pfp_merge_germany_konigsberg_desc:0 "L'ancienne capitale de la Prusse — là où les Hohenzollern furent couronnés rois et où Emmanuel Kant passa toute sa vie sans jamais en partir. Bâtie par les Chevaliers teutoniques au treizième siècle, cette forteresse baltique du commerce d'ambre n'appartient à nulle autre nation qu'à l'Allemagne."
  pfp_merge_great_britain_desc:0 "Trois nations partageant une seule île sont liées par une Couronne depuis les Actes d'Union, mais les liens entre elles vont plus loin que tout décret royal. Des vallées charbonnières du sud du Pays de Galles aux chantiers navals de la Clyde et aux usines des Midlands, ces peuples ont bâti un empire ensemble. Il est temps de rebâtir l'union sur laquelle cet empire était fondé."
  pfp_merge_great_britain_northern_ireland_desc:0 "La question politique la plus durable de la Grande-Bretagne — un coin d'Irlande qui a choisi de rester sous la Couronne, divisant l'île et opposant voisin à voisin pendant des générations. Quelle que soit son histoire tumultueuse, sa position commandant le chenal du Nord la rend stratégiquement inséparable du continent britannique."
  pfp_merge_iberia_desc:0 "Les royaumes qui lancèrent l'ère des découvertes depuis la même péninsule ensoleillée se partagèrent le monde à Tordesillas. Leur rivalité séculaire est réelle, mais leur parenté l'est aussi — les mêmes voies romaines relient Lisbonne à Madrid, les mêmes vents atlantiques ont façonné les deux couronnes. Unies en Ibérie, elles peuvent rayonner de nouveau le prestige de l'ancien monde ibérique."
  pfp_merge_italy_desc:0 "Depuis que Dante écrivit sur une Italie unie et que Machiavel rêva d'un prince qui pourrait l'unifier, la péninsule résiste à l'unification. Les héritiers épars de la civilisation romaine — chacun fier de son propre passé, mais chacun incomplet sans les autres — ont attendu assez longtemps. Le Risorgimento n'était que la première tentative ; il peut maintenant être achevé."
  pfp_merge_italy_sardinia_desc:0 "Cette île a changé de mains entre Aragonais, Savoyards et Habsbourg avant de devenir le siège nominal de la maison de Savoie — la dynastie qui unifia finalement l'Italie. Son intérieur accidenté et ses positions côtières en font l'ancre occidentale de l'emprise de l'Italie sur la mer Tyrrhénienne."
  pfp_merge_japan_desc:0 "Les îles natales sacrées forment une seule nation depuis l'ère des anciens empereurs. Leur division est une aberration, une blessure infligée à un peuple défini par l'unité. La restauration des îles natales n'est pas seulement un acte politique — c'est l'accomplissement du kokutai, l'essence nationale elle-même."
  pfp_merge_russia_desc:0 "Deux moitiés d'un même colosse, artificiellement divisées par la même catastrophe qui a brisé l'État. De la côte baltique au Pacifique, de la toundra arctique aux contreforts du Caucase — les terres russes se doivent d'être ensemble. L'Ours a tenu bon. La Russie est de nouveau entière."
  pfp_merge_western_russia_desc:0 "Les grands fleuves de la plaine occidentale — la Volga, le Don, le Dniepr — ont toujours été les artères de la civilisation russe, reliant des terres qui ont répondu à une seule autorité depuis l'époque des Tsars. Ces territoires n'ont jamais été de vraies nations séparées ; ils étaient des fragments d'un ensemble brisé."
  pfp_merge_western_russia_karelia_desc:0 "Une terre de dix mille lacs et de denses forêts, cette région frontalière est là où la Russie et ses voisins nordiques se disputent le contrôle depuis des siècles. Ses forêts et ses voies d'eau constituent certains des terrains les plus farouchement défendus du continent ; ils tombent désormais sous l'autorité russe unifiée, sécurisant les approches nord-ouest de Leningrad."
  pfp_merge_western_russia_murmansk_desc:0 "Le seul port arctique russe sans glace, maintenu navigable toute l'année par la queue du Gulf Stream qui atteint cette latitude. Qui tient ce port tient la porte arctique — et la route des convois qui a prouvé sa valeur stratégique dans chaque conflit ayant mis la Russie à l'épreuve par le nord."
  pfp_merge_western_russia_northern_caucasus_desc:0 "La frontière agitée de l'expansion russe depuis les brutales campagnes de Yermolov — une région de fiers peuples montagnards qui n'ont jamais accepté la sujétion à la légère. Pourtant ses champs pétrolifères et sa position commandant le pont terrestre entre la mer Noire et la Caspienne en font un enjeu stratégique trop vital pour rester hors de notre contrôle."
  pfp_merge_yugoslavia_desc:0 "Taillés dans les ruines des empires ottoman et habsbourgeois, les peuples slaves du sud — Južni Slaveni — furent longtemps pris pour des rêveurs en croyant que ces terres pouvaient n'en former qu'une. Le rêve est désormais à portée de main. Fraternité et unité — bratstvo i jedinstvo — seront plus qu'un slogan."
  pfp_merge_yugoslavia_macedonia_desc:0 "Là où Alexandre le Grand bâtit un empire, et où chaque puissance balkanique depuis a vu un prix valant la peine d'être disputé. Sa position au carrefour de la péninsule — où les ambitions grecques, bulgares, serbes et turques se sont heurtées pendant des générations — en fait la clé pour dominer les Balkans méridionaux."
  pfp_merge_yugoslavia_montenegro_desc:0 "Une terre de montagnes noires et de guerriers farouches — un royaume qui résista cinq siècles de pression ottomane par le terrain et la ténacité seuls. Leur fraternité de longue date avec les autres peuples slaves du sud fait de leur intégration non une conquête mais un retour au foyer."
  pfp_merge_eastern_russia_effect_annex:0 "§YLa Russie Orientale§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_eastern_russia_effect_cores:0 "§YLa Russie Orientale§! acquiert les noyaux et revendications des marionnettes annexées.\n"
  pfp_merge_eastern_russia_effect_form:0 "§YOural§! est formée par la fusion de §YUrals§!, §YSiberia§!, et §YFar East Russia§!.\n"
  pfp_merge_eastern_russia_is_formed_tt:0 "La Russie Orientale a été formée.\n"
  pfp_merge_eastern_russia_not_yet_formed_tt:0 "La Russie Orientale n'a pas encore été formée.\n"
  pfp_merge_france_alps_effect_annex:0 "§YLa France§! annexe §YLes Alpes françaises§!, gagnant ses noyaux et territoires annexables.\n"
  pfp_merge_france_alps_not_yet_absorbed_tt:0 "Les Alpes françaises n'ont pas encore été absorbées dans la France.\n"
