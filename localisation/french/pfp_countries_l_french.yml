  ## PFP MERGER DECISIONS ##
  pfp_merge_canada:0 "Former le Canada"
  pfp_merge_canada_desc:0 "Un seul dominion s'étendait autrefois sur la moitié nord du continent, des rivages de l'Atlantique aux prairies de l'ouest, uni par le chemin de fer transcontinental et un héritage colonial commun. La distance entre Halifax et Vancouver est vaste, mais les liens du droit, de la langue et de l'histoire sont plus profonds que toute division temporaire."

  pfp_merge_canada_quebec:0 "Absorber le Québec dans le Canada"
  pfp_merge_canada_quebec_desc:0 "Le cœur francophone sur les rives du Saint-Laurent défend sa langue et sa culture distincte depuis trois siècles — assez longtemps pour mériter le nom de belle province. Le Canada étant unifié, le moment est venu de l'intégrer dans la nation ; ses rivières, ses villes et ses habitants appartiennent au pays qui les entoure."
