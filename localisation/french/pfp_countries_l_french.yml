  pfp_merge_canada_not_yet_formed_tt:0 "Le Canada n'a pas encore été formé.\n"
  pfp_merge_puppet_must_core_owned_territories_tt:0 "Doit avoir incorporé tous les territoires occupés actuellement pouvant être annexés.\n"
