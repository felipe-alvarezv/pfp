  pfp_merge_arabia:0 "Former l'Arabie"
  pfp_merge_arabia_desc:0 "Des sables du Nejd aux côtes d'Oman, la péninsule arabique est depuis longtemps un carrefour de foi et de commerce. Les villes de La Mecque et de Médine ancrent une civilisation plus ancienne que toute autre ; les routes de l'encens du Dhofar définissaient autrefois le commerce du monde antique. Unies en Arabie, ces royaumes peuvent reprendre leur place au cœur de la civilisation."
  pfp_merge_arabia_not_yet_formed_tt:0 "L'Arabie n'a pas encore été formée.\n"
  pfp_merge_arabia_puppets_ready_tt:0 "§YSaudi Arabia§!, §YYemen§!, §YOman§!:\n"
  pfp_merge_arabia_effect_form:0 "§YL'Arabie§! est formée par la fusion de §YSaudi Arabia§!, §YYemen§!, et §YOman§!.\n"
  pfp_merge_arabia_effect_annex:0 "§YL'Arabie§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_arabia_effect_cores:0 "§YL'Arabie§! acquiert les noyaux et revendications des marionnettes annexées.\n"

  pfp_merge_korea:0 "Former la Corée"
  pfp_merge_korea_desc:0 "Divisée par la guerre et l’idéologie, la péninsule coréenne a longtemps souffert de l’influence étrangère et des luttes intestines. Des rizières du sud aux montagnes du nord, le peuple coréen partage une seule langue, une seule culture et une seule histoire. Le temps est venu de mettre de côté les divisions du présent et de retrouver l’unité du passé."
  pfp_merge_korea_not_yet_formed_tt:0 "La Corée n’a pas encore été formée.\n"
  pfp_merge_korea_puppets_ready_tt:0 "§YCorée du Nord§! et §YCorée du Sud§! :\n"
  pfp_merge_korea_effect_form:0 "§YLa Corée§! est formée par la fusion de §YCorée du Nord§! et §YCorée du Sud§!.\n"
  pfp_merge_korea_effect_annex:0 "§YLa Corée§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_korea_effect_cores:0 "§YLa Corée§! obtient les cœurs et revendications du vassal annexé.\n"

  pfp_merge_guiana:0 "Former les Guyanes"
  pfp_merge_guiana_desc:0 "Trois colonies de trois empires, les Guyanes partagent une géographie commune, un climat commun et un destin commun. Des junɡles de l’intérieur aux fleuves qui se déversent dans l’Atlantique, ces territoires ont plus en commun entre eux qu’avec les capitales lointaines qui les gouvernent. Unies sous le nom de Guyane, elles peuvent forger une nouvelle identité à partir de la terre qu’elles partagent."
  pfp_merge_guiana_not_yet_formed_tt:0 "La Guyane n’a pas encore été formée.\n"
  pfp_merge_guiana_puppets_ready_tt:0 "§YGuyana§!, §YSuriname§! et §YGuyane§! :\n"
  pfp_merge_guiana_effect_form:0 "§YLa Guyane§! est formée par la fusion de §YGuyana§!, §YSuriname§!, et §YGuyane§!.\n"
  pfp_merge_guiana_effect_annex:0 "§YLa Guyane§! annexe tous les vassaux précédemment listés, gagnant leurs troupes.\n"
  pfp_merge_guiana_effect_cores:0 "§YLa Guyane§! obtient les cœurs et revendications des vassaux annexés.\n"

