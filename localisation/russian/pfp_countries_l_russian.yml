  pfp_merge_central_africa:0 "Сформировать Central Africa"
  pfp_merge_central_africa_cameroon:0 "Поглотить Cameroon в Central Africa"
  pfp_merge_central_africa_cameroon_desc:0 "Мандат Лиги Наций, поделённый между Францией и Великобританией после Великой войны, Камерун служит мостом между Западной и Центральной Африкой. Его высокогорья спускаются к плодородному побережью, а положение на локте Африки делает его естественным звеном между территориями, обращёнными к Атлантике на западе, и Конголезским бассейном внизу. Его включение закроет северо-западную границу Центральной Африки."
  pfp_merge_central_africa_cameroon_effect_annex:0 "§YЦентральная Африка§! аннексирует §YКамерун§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_central_africa_cameroon_not_yet_absorbed_tt:0 "Камерун ещё не поглощён.\n"
  pfp_merge_central_africa_chad:0 "Поглотить Chad в Central Africa"
  pfp_merge_central_africa_chad_desc:0 "Самая северная территория Французской Экваториальной Африки, Чад простирается от окраин Сахары до хлопководческих равнин юга. Озеро Чад, его великое внутреннее море, тысячу лет служит перекрёстком сахарской торговли. Его включение закрепит северные рубежи Центральной Африки и завершит федерацию, которой Франция некогда управляла из Браззавиля."
  pfp_merge_central_africa_chad_effect_annex:0 "§YЦентральная Африка§! аннексирует §YЧад§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_central_africa_chad_not_yet_absorbed_tt:0 "Чад ещё не поглощён.\n"
  pfp_merge_central_africa_desc:0 "The Congo Basin is the heart of equatorial Africa — a vast river system draining one of the largest tropical rainforests on earth, rich in rubber, copper, and ivory beyond the reckoning of any contemporary power. The Belgian Congo, vast and largely unmapped, is a state unto itself. Around it, the forests and savannahs of the surrounding territories await unification into a single Central African state that would rank among the continent's great powers."
  pfp_merge_central_africa_effect_annex:0 "§YЦентральная Африка§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_central_africa_equatorial_guinea:0 "Поглотить Equatorial Guinea в Central Africa"
  pfp_merge_central_africa_equatorial_guinea_desc:0 "Единственная территория Испании на африканском материке, Экваториальная Гвинея — маленький анклав, зажатый между Камеруном и Габоном: колониальный пережиток с незначительным собственным стратегическим весом, но существенной символической ценностью. Её поглощение завершит береговую линию Центральной Африки и устранит последний анклав, находящийся в иностранных руках в регионе."
  pfp_merge_central_africa_equatorial_guinea_effect_annex:0 "§YЦентральная Африка§! аннексирует §YЭкваториальная Гвинея§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_central_africa_equatorial_guinea_not_yet_absorbed_tt:0 "Экваториальная Гвинея ещё не поглощена.\n"
  pfp_merge_central_africa_gabon:0 "Поглотить Gabon в Central Africa"
  pfp_merge_central_africa_gabon_desc:0 "Либревиль — основанный как поселение для освобождённых рабов по образцу Фритауна — закрепляет атлантическое побережье экваториальной Африки. Густые леса Габона едва тронуты; то, что скрывается под ними, только начинает открываться. Его прибрежное положение и речной доступ дали бы Центральной Африке второй выход к Атлантике."
  pfp_merge_central_africa_gabon_effect_annex:0 "§YЦентральная Африка§! аннексирует §YГабон§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_central_africa_gabon_not_yet_absorbed_tt:0 "Габон ещё не поглощён.\n"
  pfp_merge_central_africa_is_formed_tt:0 "Центральная Африка образована.\n"
  pfp_merge_central_africa_not_yet_formed_tt:0 "Центральная Африка ещё не образована.\n"
  pfp_merge_central_africa_puppets_ready_tt:0 "§YБельгийское Конго§! and §YКонго-Браззавиль§!:\n"
  pfp_merge_central_africa_ubangi_shari:0 "Поглотить Ubangi-Shari в Central Africa"
  pfp_merge_central_africa_ubangi_shari_desc:0 "Названный в честь двух рек, ограничивающих его с севера и востока, Убангий-Шари занимает плато между Конголезским бассейном и Сахелем. По колониальным меркам он слабо управляем и малонаселён — территория, чья истинная ценность заключается в её положении в качестве внутреннего моста между Центральной Африкой и территориями на севере."
  pfp_merge_central_africa_ubangi_shari_effect_annex:0 "§YЦентральная Африка§! аннексирует §YУбанги-Шари§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_central_africa_ubangi_shari_not_yet_absorbed_tt:0 "Убангий-Шари ещё не поглощён.\n"
  pfp_merge_central_africa_effect_form:0 "§YЦентральная Африка§! образуется путём объединения §YБельгийское Конго§! и §YКонго-Браззавиль§!.\n"
  pfp_merge_central_africa_effect_cores:0 "§YЦентральная Африка§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_south_africa_puppets_ready_tt:0 "§YЮжная Африка§!, §YЮго-Западная Африка§!, §YАнгола§!, §YБечуаналенд§!, §YСеверная Родезия§!, §YЮжная Родезия§!, §YНьясаленд§!, §YМозамбик§!:\n"
  pfp_merge_south_africa:0 "Сформировать South Africa"
  pfp_merge_south_africa_desc:0 "От продуваемых всеми ветрами атлантических берегов Анголы и Юго-Западной Африки до индоокеанского побережья Мозамбика, от долины Замбези до мыса Доброй Надежды — Южная Африка охватывает наиболее промышленно развитый и стратегически важный регион континента. В её недрах залегают крупнейшие в мире запасы золота и алмазов — богатство, втянувшее европейские державы в столетие соперничества, войн и железнодорожного строительства и сделавшее Трансвааль экономическим сердцем континента. Разделённые колониальными границами на британские, португальские и бывшие германские территории, эти земли объединяет общая география великих рек, нагорного плато и индоокеанского побережья. Их объединение создаст державу, контролирующую как Атлантику, так и мыс Горн — южные ворота между великими океанами мира."
  pfp_merge_south_africa_not_yet_formed_tt:0 "Южная Африка ещё не образована.\n"
  pfp_merge_south_africa_effect_form:0 "§YЮжная Африка§! образуется путём объединения §YЮжная Африка§!, §YЮго-Западная Африка§!, §YАнгола§!, §YБечуаналенд§!, §YСеверная Родезия§!, §YЮжная Родезия§!, §YНьясаленд§!, и §YМозамбик§!.\n"
  pfp_merge_south_africa_effect_annex:0 "§YЮжная Африка§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_south_africa_effect_cores:0 "§YЮжная Африка§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_south_africa_is_formed_tt:0 "Южная Африка образована.\n"
  pfp_merge_south_africa_madagascar:0 "Поглотить Madagascar в South Africa"
  pfp_merge_south_africa_madagascar_desc:0 "Отделённый от африканского материка Мозамбикским проливом, Мадагаскар — четвёртый по величине остров в мире и один из наиболее биологически самобытных. Его порты командуют морскими путями западной части Индийского океана и подступами к Мозамбикскому проливу. Его поглощение расширит влияние Южной Африки на окружающие воды и обеспечит морские подходы к мысу Горн."
  pfp_merge_south_africa_madagascar_not_yet_absorbed_tt:0 "Мадагаскар ещё не поглощён Южной Африкой.\n"
  pfp_merge_south_africa_madagascar_effect_annex:0 "§YЮжная Африка§! аннексирует §YМадагаскар§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_scandinavia_puppets_ready_tt:0 "§YНорвегия§!, §YШвеция§!, §YДания§!:\n"
  pfp_merge_scandinavia:0 "Сформировать Scandinavia"
  pfp_merge_scandinavia_desc:0 "От фьордов Норвегии до рудных полей севера Швеции и равнин Дании три скандинавских королевства объединяет общее наследие, уходящее корнями в эпоху викингов — мореходов, торговцев и воинов, некогда владевших европейскими берегами от Балтики до Атлантики. Разделённые на отдельные короны веками династических распрей, эти народы говорят на родственных языках, исповедуют одну традицию и провели большую часть своей истории в тесном переплетении. Их воссоединение под единым знаменем восстановит господствующую державу Северных морей."
  pfp_merge_scandinavia_not_yet_formed_tt:0 "Скандинавия ещё не образована.\n"
  pfp_merge_scandinavia_effect_form:0 "§YСкандинавия§! образуется путём объединения §YНорвегия§!, §YШвеция§!, и §YДания§!.\n"
  pfp_merge_scandinavia_effect_annex:0 "§YСкандинавия§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_scandinavia_effect_cores:0 "§YСкандинавия§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_scandinavia_is_formed_tt:0 "Скандинавия образована.\n"
  pfp_merge_scandinavia_iceland:0 "Поглотить Iceland в Scandinavia"
  pfp_merge_scandinavia_iceland_desc:0 "Первые норвежские переселенцы, высадившиеся на Исландии в IX веке, обнаружили остров огня и льда на краю известного мира — землю вулканических пиков, ледников и гейзеров, никогда не знавшую человеческого заселения. Столетиями она служила далёким форпостом скандинавской цивилизации, родиной саг, сохранивших память об эпохе викингов. Её включение распространит влияние Скандинавии на Северную Атлантику, обеспечив морские пути между Европой и всем остальным миром."
  pfp_merge_scandinavia_iceland_not_yet_absorbed_tt:0 "Исландия ещё не поглощена Скандинавией.\n"
  pfp_merge_scandinavia_iceland_effect_annex:0 "§YСкандинавия§! аннексирует §YИсландия§!, получая её ядра и присоединяемые территории.\n"
  pfp_merge_scandinavia_greenland:0 "Поглотить Greenland в Scandinavia"
  pfp_merge_scandinavia_greenland_desc:0 "Эйрик Рыжий назвал её Гренландией, чтобы привлечь поселенцев, и пять столетий норвежские колонисты влачили жалкое существование на её юго-западном побережье, прежде чем исчезнуть со страниц истории. Крупнейший остров мира расположен над северными морскими путями и хранит под своим ледяным щитом ресурсы, которые могут определить грядущий век. Его включение даст Скандинавии опорный пункт на вершине мира."
  pfp_merge_scandinavia_greenland_not_yet_absorbed_tt:0 "Гренландия ещё не поглощена Скандинавией.\n"
  pfp_merge_scandinavia_greenland_effect_annex:0 "§YСкандинавия§! аннексирует §YГренландия§!, получая её ядра и присоединяемые территории.\n"

  pfp_merge_baltic:0 "Сформировать Прибалтику"
  pfp_merge_baltic_desc:0 "Разделённые Рижским заливом, но связанные янтарными берегами, лютеранской верой и веками общего подчинения, Эстония и Латвия образуют северное сердце балтийского мира. Обе нации обрели независимость в хаосе послевоенного времени, выкроив государственность из обломков российской и германской империй. Их союз укрепил бы северное побережье Балтики и заложил основу для более широкой конфедерации вплоть до литовской границы."
  pfp_merge_baltic_not_yet_formed_tt:0 "Прибалтика ещё не образована.\n"
  pfp_merge_baltic_puppets_ready_tt:0 "§YЭстония§!, §YЛатвия§!:\n"
  pfp_merge_baltic_effect_form:0 "§YПрибалтика§! образуется путём объединения §YЭстония§! и §YЛатвия§!.\n"
  pfp_merge_baltic_effect_annex:0 "§YПрибалтика§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_baltic_effect_cores:0 "§YПрибалтика§! получает коры и претензии аннексированных марионеток.\n"
  pfp_merge_baltic_is_formed_tt:0 "Прибалтика образована.\n"
  pfp_merge_baltic_lithuania:0 "Включить Литву в Прибалтику"
  pfp_merge_baltic_lithuania_desc:0 "Литва была последним языческим королевством Европы — средневековым гигантом, который при Ягеллонах простирался от Балтики до Чёрного моря. Католическая, в отличие от своих лютеранских северных соседей, она тем не менее разделяет те же янтарные берега, ту же геополитическую уязвимость и с трудом завоёванную независимость. Её включение завершает балтийский союз, распространяя федерацию на юг."
  pfp_merge_baltic_lithuania_not_yet_absorbed_tt:0 "Литва ещё не включена в состав Прибалтики.\n"
  pfp_merge_baltic_lithuania_effect_annex:0 "§YПрибалтика§! аннексирует §YЛитву§!, получая её коры и коренизируемые территории.\n"

  pfp_merge_central_america:0 "Сформировать Центральную Америку"
  pfp_merge_central_america_desc:0 "Народы Центральноамериканского перешейка — Гватемала, Гондурас, Сальвадор, Никарагуа, Коста-Рика и Панама — были когда-то объединены под недолговечной Федеральной Республикой Центральной Америки, пока политические распри не разделили их в 1838 году. Связанные общим языком, колониальным наследием и узким сухопутным мостом между двумя континентами, эти нации обладают стратегическим контролем над подступами к Панамскому каналу. Их воссоединение возродит вековую мечту перешейка: единое государство, господствующее над Карибским морем и Тихим океаном."
  pfp_merge_central_america_not_yet_formed_tt:0 "Центральная Америка ещё не образована.\n"
  pfp_merge_central_america_puppets_ready_tt:0 "§YГватемала§!, §YГондурас§!, §YСальвадор§!, §YНикарагуа§!, §YКоста-Рика§!, §YПанама§!:\n"
  pfp_merge_central_america_effect_form:0 "§YЦентральная Америка§! образуется путём объединения §YГватемала§!, §YГондурас§!, §YСальвадор§!, §YНикарагуа§!, §YКоста-Рика§!, и §YПанама§!.\n"
  pfp_merge_central_america_effect_annex:0 "§YЦентральная Америка§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_central_america_effect_cores:0 "§YЦентральная Америка§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_central_america_is_formed_tt:0 "Центральная Америка образована.\n"
  pfp_merge_central_america_belize:0 "Поглотить Белиз в Центральную Америку"
  pfp_merge_central_america_belize_desc:0 "Британский Гондурас — пережиток эпохи флибустьеров: англоязычный анклав, зажатый между Гватемалой и Карибским морем, который Гватемала считает похищенной территорией, а Великобритания удерживает как лесную колонию, ставшую владением Короны. Его включение в Центральную Америку удовлетворит территориальные амбиции соседей и сплотит перешеек под единым управлением."
  pfp_merge_central_america_belize_not_yet_absorbed_tt:0 "Белиз ещё не поглощён Центральной Америкой.\n"
  pfp_merge_central_america_belize_effect_annex:0 "§YЦентральная Америка§! аннексирует §YБелиз§!, получая его ядра и освояемые территории.\n"

  pfp_merge_west_indies:0 "Сформировать Вест-Индию"
  pfp_merge_west_indies_desc:0 "Куба, Гаити и Доминиканская Республика образуют великий островной центр Карибского моря. Их объединение под единым флагом возродит мечту о Федерации Вест-Индии."
  pfp_merge_west_indies_not_yet_formed_tt:0 "Вест-Индия ещё не образована.\n"
  pfp_merge_west_indies_puppets_ready_tt:0 "§YКуба§!, §YДоминиканская Республика§!, §YГаити§!:\n"
  pfp_merge_west_indies_effect_form:0 "§YВест-Индия§! образуется путём объединения §YКуба§!, §YДоминиканская Республика§!, и §YГаити§!.\n"
  pfp_merge_west_indies_effect_annex:0 "§YВест-Индия§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_west_indies_effect_cores:0 "§YВест-Индия§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_west_indies_is_formed_tt:0 "Вест-Индия образована.\n"
  pfp_merge_west_indies_jamaica:0 "Поглотить Ямайку в Вест-Индию"
  pfp_merge_west_indies_jamaica_desc:0 "Ямайка была главной жемчужиной британских Карибов — остров сахарных плантаций и Синих гор, чьи ритмы сопротивления сформировали атлантический мир. Её поглощение Вест-Индией объединяет крупнейший из англоязычных островов с федерацией."
  pfp_merge_west_indies_jamaica_not_yet_absorbed_tt:0 "Ямайка ещё не поглощена Вест-Индией.\n"
  pfp_merge_west_indies_jamaica_effect_annex:0 "§YВест-Индия§! аннексирует §YЯмайку§!, получая её ядра и освояемые территории.\n"
  pfp_merge_west_indies_bahamas:0 "Поглотить Багамы в Вест-Индию"
  pfp_merge_west_indies_bahamas_desc:0 "Багамский архипелаг охраняет северный вход в Карибское море, его мелководные банки и цепочки островов простираются от Флориды до Гаити. Их присоединение распространяет влияние Вест-Индии до самого порога Американского континента."
  pfp_merge_west_indies_bahamas_not_yet_absorbed_tt:0 "Багамы ещё не поглощены Вест-Индией.\n"
  pfp_merge_west_indies_bahamas_effect_annex:0 "§YВест-Индия§! аннексирует §YБагамы§!, получая их ядра и освояемые территории.\n"
  pfp_merge_west_indies_puerto_rico:0 "Поглотить Пуэрто-Рико в Вест-Индию"
  pfp_merge_west_indies_puerto_rico_desc:0 "Пуэрто-Рико расположен в северо-восточном углу Карибского моря — испаноязычный остров, чьё стратегическое положение контролирует пролив Мона. Его включение под знамёна Вест-Индии завершает дугу Больших Антильских островов."
  pfp_merge_west_indies_puerto_rico_not_yet_absorbed_tt:0 "Пуэрто-Рико ещё не поглощено Вест-Индией.\n"
  pfp_merge_west_indies_puerto_rico_effect_annex:0 "§YВест-Индия§! аннексирует §YПуэрто-Рико§!, получая его ядра и освояемые территории.\n"
  pfp_merge_west_indies_french_antilles:0 "Поглотить Французские Антилы в Вест-Индию"
  pfp_merge_west_indies_french_antilles_desc:0 "Мартиника и Гваделупа — последние остатки французской карибской империи, чья креольская культура представляет собой смесь африканских, европейских и индейских корней. Их аннексия в Вест-Индию поглощает последнее французское присутствие на Малых Антильских островах."
  pfp_merge_west_indies_french_antilles_not_yet_absorbed_tt:0 "Французские Антилы ещё не поглощены Вест-Индией.\n"
  pfp_merge_west_indies_french_antilles_effect_annex:0 "§YВест-Индия§! аннексирует §YФранцузские Антилы§!, получая их ядра и освояемые территории.\n"
  pfp_merge_west_indies_british_antilles:0 "Поглотить Британские Антилы в Вест-Индию"
  pfp_merge_west_indies_british_antilles_desc:0 "Наветренные и Подветренные острова образуют разбросанную цепочку британских владений вдоль восточного края Карибского моря. Их поглощение объединяет Малые Антильские острова под единым управлением."
  pfp_merge_west_indies_british_antilles_not_yet_absorbed_tt:0 "Британские Антилы ещё не поглощены Вест-Индией.\n"
  pfp_merge_west_indies_british_antilles_effect_annex:0 "§YВест-Индия§! аннексирует §YБританские Антилы§!, получая их ядра и освояемые территории.\n"
  pfp_merge_west_indies_dutch_antilles:0 "Поглотить Нидерландские Антилы в Вест-Индию"
  pfp_merge_west_indies_dutch_antilles_desc:0 "Кюрасао и его соседние острова у берегов Венесуэлы — остатки нидерландской торговой империи в Карибском море, чьи нефтеперерабатывающие заводы и свободные порты делают их одними из наиболее процветающих островов региона. Их поглощение завершает последнее европейское колониальное присутствие в южной части Карибского моря."
  pfp_merge_west_indies_dutch_antilles_not_yet_absorbed_tt:0 "Нидерландские Антилы ещё не поглощены Вест-Индией.\n"
  pfp_merge_west_indies_dutch_antilles_effect_annex:0 "§YВест-Индия§! аннексирует §YНидерландские Антилы§!, получая их ядра и освояемые территории.\n"
  pfp_merge_west_indies_trinidad:0 "Поглотить Тринидад и Тобаго в Вест-Индию"
  pfp_merge_west_indies_trinidad_desc:0 "Тринидад, расположенный у берегов Венесуэлы, является самым южным островом карибской цепи и одним из наиболее процветающих — его нефтяные месторождения и космополитичный Порт-оф-Спейн делают его ценным владением. Его вхождение в Вест-Индию укрепляет южный фланг федерации."
  pfp_merge_west_indies_trinidad_not_yet_absorbed_tt:0 "Тринидад и Тобаго ещё не поглощены Вест-Индией.\n"
  pfp_merge_west_indies_trinidad_effect_annex:0 "§YВест-Индия§! аннексирует §YТринидад и Тобаго§!, получая их ядра и освояемые территории.\n"
  pfp_merge_west_indies_bermuda:0 "Поглотить Бермуды в Вест-Индию"
  pfp_merge_west_indies_bermuda_desc:0 "Бермуды расположены далеко к северу от основной карибской цепи — среднеатлантическое британское владение, чьи розовые песчаные пляжи и стратегическая военно-морская стоянка сделали его краеугольным камнем британского могущества в западной части Атлантики. Их поглощение расширяет влияние Вест-Индии на открытый океан."
  pfp_merge_west_indies_bermuda_not_yet_absorbed_tt:0 "Бермуды ещё не поглощены Вест-Индией.\n"
  pfp_merge_west_indies_bermuda_effect_annex:0 "§YВест-Индия§! аннексирует §YБермуды§!, получая их ядра и освояемые территории.\n"
  pfp_merge_west_indies_belize:0 "Поглотить Белиз в Вест-Индию"
  pfp_merge_west_indies_belize_desc:0 "Британский Гондурас — небольшой англоязычный анклав на материковой части Центральной Америки, чьи культурные связи с британскими Карибами делают его естественным кандидатом на поглощение Вест-Индией, а не испаноязычными соседями. Его аннексия объединяет последнюю британскую территорию западных Карибов с федерацией."
  pfp_merge_west_indies_belize_not_yet_absorbed_tt:0 "Белиз ещё не поглощён Вест-Индией.\n"
  pfp_merge_west_indies_belize_effect_annex:0 "§YВест-Индия§! аннексирует §YБелиз§!, получая его ядра и освояемые территории.\n"
  pfp_merge_transcaucasia:0 "Сформировать Закавказье"
  pfp_merge_transcaucasia_desc:0 "Грузия, Армения и Азербайджан находятся на перекрестке Европы и Азии, их судьбы переплетены Кавказскими горами. Нефть из Баку, марганец из Чиатуры, шёлк из Тбилиси — закавказские республики богаче вместе, чем по отдельности. Объединённые как Закавказье, они могут противостоять давлению великих держав с обеих сторон и ковать будущее на собственных условиях."
  pfp_merge_transcaucasia_not_yet_formed_tt:0 "Закавказье ещё не образовано.\n"
  pfp_merge_transcaucasia_puppets_ready_tt:0 "§YГрузия§!, §YАрмения§!, §YАзербайджан§!:\n"
  pfp_merge_transcaucasia_effect_form:0 "§YЗакавказье§! образуется путём объединения §YГрузия§!, §YАрмения§!, и §YАзербайджан§!.\n"
  pfp_merge_transcaucasia_effect_annex:0 "§YЗакавказье§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_transcaucasia_effect_cores:0 "§YЗакавказье§! получает все ядра и освояемые территории объединённых вассалов.\n"
  pfp_merge_turkestan:0 "Сформировать Туркестан"
  pfp_merge_turkestan_desc:0 "Сквозь степи и пустыни Центральной Азии пять республик разделяют общее тюркское наследие, одних и тех же великих рек и одинаковое колониальное прошлое. Казахстан, Киргизия, Таджикистан, Узбекистан и Туркменистан были разделены советским административным решением; их объединение как Туркестан восстановило бы культурную и географическую целостность, которую картография разрушила."
  pfp_merge_turkestan_not_yet_formed_tt:0 "Туркестан ещё не образован.\n"
  pfp_merge_turkestan_puppets_ready_tt:0 "§YКазахстан§!, §YКиргизия§!, §YТаджикистан§!, §YУзбекистан§!, §YТуркменистан§!:\n"
  pfp_merge_turkestan_effect_form:0 "§YТуркестан§! образуется путём объединения §YКазахстан§!, §YКиргизия§!, §YТаджикистан§!, §YУзбекистан§!, и §YТуркменистан§!.\n"
  pfp_merge_turkestan_effect_annex:0 "§YТуркестан§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_turkestan_effect_cores:0 "§YТуркестан§! получает все ядра и освояемые территории объединённых вассалов.\n"
  pfp_merge_indochina:0 "Сформировать Индокитай"
  pfp_merge_indochina_desc:0 "Вьетнам, Лаос и Камбоджа были объединены под французским управлением как Индокитай — единая колониальная единица, управлявшаяся из Ханоя и Сайгона. Реки, протекающие сквозь эти земли, торговые пути, общие буддийские традиции и столетия переплетённой истории свидетельствуют в пользу единства. Объединённые как Индокитай, они могут говорить единым голосом против любой державы, которая воспользовалась бы их разделением."
  pfp_merge_indochina_not_yet_formed_tt:0 "Индокитай ещё не образован.\n"
  pfp_merge_indochina_puppets_ready_tt:0 "§YВьетнам§!, §YЛаос§!, §YКамбоджа§!:\n"
  pfp_merge_indochina_effect_form:0 "§YИндокитай§! образуется путём объединения §YВьетнам§!, §YЛаос§!, и §YКамбоджа§!.\n"
  pfp_merge_indochina_effect_annex:0 "§YИндокитай§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_indochina_effect_cores:0 "§YИндокитай§! получает все ядра и освояемые территории объединённых вассалов.\n"
  pfp_merge_indochina_is_formed_tt:0 "Индокитай образован.\n"
  pfp_merge_indochina_siam:0 "Поглотить Сиам"
  pfp_merge_indochina_siam_desc:0 "Сиам стоит особняком от Французского Индокитая — никогда не колонизированный, никогда не сломленный. Но окружённый территориями, ныне объединёнными под индокитайской администрацией, он не может оставаться островом независимости. Пришло время включить Сиам в большой индокитайский союз."
  pfp_merge_indochina_siam_not_yet_absorbed_tt:0 "Сиам ещё не поглощён Индокитаем.\n"
  pfp_merge_indochina_siam_effect_annex:0 "§YИндокитай§! аннексирует §YСиам§!, получая его ядра и освояемые территории.\n"
  pfp_merge_indochina_burma:0 "Поглотить Бирму"
  pfp_merge_indochina_burma_desc:0 "Бирма долго была связана с Индией под британским управлением, но её география твёрдо помещает её в индокитайскую сферу. Долина Иравадди, буддийская вера, общая с соседями, рисовые поля, кормящие регион — Бирма принадлежит индокитайскому миру. Её поглощение завершает континентальный союз."
  pfp_merge_indochina_burma_not_yet_absorbed_tt:0 "Бирма ещё не поглощена Индокитаем.\n"
  pfp_merge_indochina_burma_effect_annex:0 "§YИндокитай§! аннексирует §YБирму§!, получая её ядра и освояемые территории.\n"
  pfp_merge_indochina_malaysia:0 "Поглотить Малайзию"
  pfp_merge_indochina_malaysia_desc:0 "Малайский полуостров связывает континентальный Индокитай с островным миром Тихого океана. Резиновые плантации Малайзии, оловянные рудники и стратегическое положение в Малаккском проливе делают её незаменимым дополнением к любому индокитайскому союзу с амбициями в регионе."
  pfp_merge_indochina_malaysia_not_yet_absorbed_tt:0 "Малайзия ещё не поглощена Индокитаем.\n"
  pfp_merge_indochina_malaysia_effect_annex:0 "§YИндокитай§! аннексирует §YМалайзию§!, получая её ядра и освояемые территории.\n"
  pfp_merge_indochina_singapore:0 "Поглотить Сингапур"
  pfp_merge_indochina_singapore_desc:0 "На южной оконечности Малайского полуострова Сингапур контролирует узкий пролив, через который должна пройти половина мировой торговли. Его порт среди самых загруженных на Земле, его положение среди наиболее стратегических. Поглощённый Индокитаем, Сингапур становится морскими воротами единого южноазиатского государства."
  pfp_merge_indochina_singapore_not_yet_absorbed_tt:0 "Сингапур ещё не поглощён Индокитаем.\n"
  pfp_merge_indochina_singapore_effect_annex:0 "§YИндокитай§! аннексирует §YСингапур§!, получая его ядра и освояемые территории.\n"
  pfp_merge_australasia:0 "Сформировать Австралазию"
  pfp_merge_australasia_desc:0 "Австралия, Новая Зеландия и Папуа — Новая Гвинея якорят южный Тихий океан — три британских территории, чья близость и общее наследие делают единство естественным стремлением. Огромный континент, остров на краю земли и тропический полуостров вместе владеют океаном. Объединённые как Австралазия, они могут проецировать силу через Тихий океан и обеспечить своё общее морское будущее."
  pfp_merge_australasia_not_yet_formed_tt:0 "Австралазия ещё не образована.\n"
  pfp_merge_australasia_puppets_ready_tt:0 "§YАвстралия§!, §YНовая Зеландия§!, §YПапуа — Новая Гвинея§!:\n"
  pfp_merge_australasia_effect_form:0 "§YАвстралазию§! образуется путём объединения §YАвстралия§!, §YНовая Зеландия§!, и §YПапуа — Новая Гвинея§!.\n"
  pfp_merge_australasia_effect_annex:0 "§YАвстралазия§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_australasia_effect_cores:0 "§YАвстралазия§! получает все ядра и освояемые территории объединённых вассалов.\n"
  pfp_merge_australasia_is_formed_tt:0 "Австралазия образована.\n"
  pfp_merge_australasia_solomon_islands:0 "Поглотить Соломоновы острова"
  pfp_merge_australasia_solomon_islands_desc:0 "Цепь Соломоновых островов тянется на северо-восток от Папуа — Новой Гвинеи в сердце Тихого океана. Их острова давно являются частью британского тихоокеанского мира, их судьба связана с Австралией близостью и колониальной администрацией. Их включение в Австралазию укрепляет юго-западный Тихий океан под единым знаменем."
  pfp_merge_australasia_solomon_islands_not_yet_absorbed_tt:0 "Соломоновы острова ещё не поглощены Австралазией.\n"
  pfp_merge_australasia_solomon_islands_effect_annex:0 "§YАвстралазия§! аннексирует §YСоломоновы острова§!, получая их ядра и освояемые территории.\n"
  pfp_merge_australasia_bougainville:0 "Поглотить Бугенвиль"
  pfp_merge_australasia_bougainville_desc:0 "Бугенвиль, хотя географически более близкий к Соломоновым островам, управлялся под австралийским мандатом над Новой Гвинеей. Его положение в архипелаге Бисмарка и его медные ресурсы делают его включение в Австралазию естественным расширением региональной власти."
  pfp_merge_australasia_bougainville_not_yet_absorbed_tt:0 "Бугенвиль ещё не поглощён Австралазией.\n"
  pfp_merge_australasia_bougainville_effect_annex:0 "§YАвстралазия§! аннексирует §YБугенвиль§!, получая его ядра и освояемые территории.\n"
  pfp_merge_australasia_new_caledonia:0 "Поглотить Новую Каледонию"
  pfp_merge_australasia_new_caledonia_desc:0 "Новая Каледония находится на южном конце Кораллового моря, её запасы никеля среди богатейших на Земле. Исторически французское владение, её география помещает её в австралазийскую сферу. Её включение добавляет стратегическую глубину и минеральное богатство в Тихоокеанский союз."
  pfp_merge_australasia_new_caledonia_not_yet_absorbed_tt:0 "Новая Каледония ещё не поглощена Австралазией.\n"
  pfp_merge_australasia_new_caledonia_effect_annex:0 "§YАвстралазия§! аннексирует §YНовую Каледонию§!, получая её ядра и освояемые территории.\n"
  pfp_merge_australasia_vanuatu:0 "Поглотить Вануату"
  pfp_merge_australasia_vanuatu_desc:0 "Новые Гебриды управлялись под своеобразным англо-французским кондоминиумом — совместным протекторатом, которым одновременно управляли две державы. Поглощение Вануату в Австралазию положит конец этой колониальной аномалии и включит архипелаг в тихоокеанский союз."
  pfp_merge_australasia_vanuatu_not_yet_absorbed_tt:0 "Вануату ещё не поглощено Австралазией.\n"
  pfp_merge_australasia_vanuatu_effect_annex:0 "§YАвстралазия§! аннексирует §YВануату§!, получая его ядра и освояемые территории.\n"
  pfp_merge_levant:0 "Сформировать Левант"
  pfp_merge_levant_desc:0 "Палестина, Иордания, Ливан и Сирия делят больше, чем границу — они делят Плодородный полумесяц, колыбель цивилизации самой. От берегов Средиземного моря до песков Сирийской пустыни эти земли переходили от империи к империи на протяжении тысячелетий. Под единой властью как Левант, они наконец могут определить собственную судьбу."
  pfp_merge_levant_not_yet_formed_tt:0 "Левант ещё не образован.\n"
  pfp_merge_levant_puppets_ready_tt:0 "§YИордания§!, §YПалестина§!, §YЛиван§!, §YСирия§!:\n"
  pfp_merge_levant_effect_form:0 "§YЛевант§! образуется путём объединения §YИордания§!, §YПалестина§!, §YЛиван§!, и §YСирия§!.\n"
  pfp_merge_levant_effect_annex:0 "§YЛевант§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_levant_effect_cores:0 "§YЛевант§! получает все ядра и освояемые территории объединённых вассалов.\n"
  pfp_merge_mittelafrika:0 "Сформировать Миттельафрику"
  pfp_merge_mittelafrika_desc:0 "Колониальная визия Германии о едином центральноафриканском доминионе так и не была реализована в Великой войне. Но части остаются: Камерун на западе, Танганьика на востоке, Юго-Западная Африка на юге. При консолидации этих территорий под нашим управлением мечта о континентальной африканской империи ещё может быть достигнута."
  pfp_merge_mittelafrika_not_yet_formed_tt:0 "Миттельафрика ещё не образована.\n"
  pfp_merge_mittelafrika_puppets_ready_tt:0 "§YКамерун§!, §YТанганьика§!, §YЮго-Западная Африка§!:\n"
  pfp_merge_mittelafrika_effect_form:0 "§YМиттельафрику§! образуется путём объединения §YКамерун§!, §YТанганьика§!, и §YЮго-Западная Африка§!.\n"
  pfp_merge_mittelafrika_effect_annex:0 "§YМиттельафрика§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_mittelafrika_effect_cores:0 "§YМиттельафрика§! получает все ядра и освояемые территории объединённых вассалов.\n"
  pfp_merge_mittelafrika_is_formed_tt:0 "Миттельафрика была сформирована.\n"
  pfp_merge_mittelafrika_togo:0 "Поглотить Того"
  pfp_merge_mittelafrika_togo_desc:0 "Того был немецким протекторатом до Великой войны, разделённый между Францией и Великобританией по её окончании. Как бывшая немецкая колония, его место в новом Миттельафрике естественно. Его поглощение завершает западный фланг центральноафриканской империи."
  pfp_merge_mittelafrika_togo_not_yet_absorbed_tt:0 "§YТого§! ещё не поглощён §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_togo_effect_annex:0 "§YМиттельафрика§! поглощает §YТого§! (Q40), получая его территорию и войска.\n"
  pfp_merge_mittelafrika_ruanda_urundi:0 "Поглотить Руанда-Урунди"
  pfp_merge_mittelafrika_ruanda_urundi_desc:0 "Руанда-Урунди, управлявшаяся под бельгийским мандатом с Великой войны, находится в сердце Африки между Танганьикой и Конго. Его поглощение в Миттельафрику заполняет брешь между восточными и центральноафриканскими владениями Германии."
  pfp_merge_mittelafrika_ruanda_urundi_not_yet_absorbed_tt:0 "§YРуанда-Урунди§! ещё не поглощён §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_ruanda_urundi_effect_annex:0 "§YМиттельафрика§! поглощает §YРуанда-Урунди§! (Q66), получая его территорию и войска.\n"
  pfp_merge_mittelafrika_gabon:0 "Поглотить Габон"
  pfp_merge_mittelafrika_gabon_desc:0 "Тропические леса Габона и бассейн реки Огоуэ делают его одним из богатейших территорий континента. Бывшее французское владение, его стратегическое положение на атлантическом побережье делает его важным приобретением для западного доступа Миттельафрики."
  pfp_merge_mittelafrika_gabon_not_yet_absorbed_tt:0 "§YГабон§! ещё не поглощён §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_gabon_effect_annex:0 "§YМиттельафрика§! поглощает §YГабон§! (Q38), получая его территорию и войска.\n"
  pfp_merge_mittelafrika_congo_brazzaville:0 "Поглотить Конго-Браззавиль"
  pfp_merge_mittelafrika_congo_brazzaville_desc:0 "Французское Конго находится на северном берегу реки Конго, прямо напротив Бельгийского Конго. Его леса и реки питают сердце Африки, а его поглощение в Миттельафрику укрепляет немецкое влияние вдоль бассейна Конго."
  pfp_merge_mittelafrika_congo_brazzaville_not_yet_absorbed_tt:0 "§YКонго-Браззавиль§! ещё не поглощён §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_congo_brazzaville_effect_annex:0 "§YМиттельафрика§! поглощает §YКонго-Браззавиль§! (Q39), получая его территорию и войска.\n"
  pfp_merge_mittelafrika_northern_rhodesia:0 "Поглотить Северную Родезию"
  pfp_merge_mittelafrika_northern_rhodesia_desc:0 "Медный пояс Северной Родезии среди богатейших минеральных месторождений Африки. Британский протекторат, связывающий маршрут от Мыса до Каира, при включении в Миттельафрику перерезает эту имперскую артерию и передаёт громадную ресурсную базу центральноафриканскому государству."
  pfp_merge_mittelafrika_northern_rhodesia_not_yet_absorbed_tt:0 "§YСеверная Родезия§! ещё не поглощена §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_northern_rhodesia_effect_annex:0 "§YМиттельафрика§! поглощает §YСеверную Родезию§! (Q63), получая её территорию и войска.\n"
  pfp_merge_mittelafrika_southern_rhodesia:0 "Поглотить Южную Родезию"
  pfp_merge_mittelafrika_southern_rhodesia_desc:0 "Южная Родезия, освоенная британскими колонистами под руководством Сесила Родса, охраняет дорогу между Лимпопо и Замбези. Её плодородные нагорья и растущее население поселенцев делают её ценным приобретением для расширяющегося Миттельафрики."
  pfp_merge_mittelafrika_southern_rhodesia_not_yet_absorbed_tt:0 "§YЮжная Родезия§! ещё не поглощена §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_southern_rhodesia_effect_annex:0 "§YМиттельафрика§! поглощает §YЮжную Родезию§! (Q69), получая её территорию и войска.\n"
  pfp_merge_mittelafrika_angola:0 "Поглотить Анголу"
  pfp_merge_mittelafrika_angola_desc:0 "Ангола простирается от атлантического побережья в глубь африканского внутреннего, её плоскогорье богато алмазами, нефтью и плодородными землями. Португальское владение столетиями, его поглощение в Миттельафрику даёт центральноафриканскому государству жизненно важный атлантический выход к морю."
  pfp_merge_mittelafrika_angola_not_yet_absorbed_tt:0 "§YАнгола§! ещё не поглощена §YМиттельафрикой§!.\n"
  pfp_merge_mittelafrika_angola_effect_annex:0 "§YМиттельафрика§! поглощает §YАнголу§! (Q67), получая её территорию и войска.\n"
  pfp_merge_mittelafrika_mozambique:0 "Поглотить Мозамбик"
  pfp_merge_mittelafrika_mozambique_desc:0 "Длинное побережье Индийского океана Мозамбика и порт Лоуренсу-Маркеш контролируют морской подход к внутренному южному Африке. Его поглощение в Миттельафрику завершает восточный морской фасад центральноафриканской империи."
  pfp_merge_mittelafrika_mozambique_not_yet_absorbed_tt:0 "§YМозамбик§! ещё не поглощён §YМиттельафрикой§!.\n"
