  ## PFP MERGER DECISIONS ##
  pfp_merge_canada:0 "Сформировать Канаду"
  pfp_merge_canada_desc:0 "Единый доминион некогда простирался через северную половину континента — от атлантических берегов до западных прерий, связанный трансконтинентальной железной дорогой и общим колониальным наследием. Расстояние между Галифаксом и Ванкувером огромно, но узы закона, языка и истории глубже любого временного разделения."

  pfp_merge_canada_quebec:0 "Поглотить Квебек в составе Канады"
  pfp_merge_canada_quebec_desc:0 "Франкофонное сердце на берегах реки Святого Лаврентия хранит свой язык и самобытную культуру на протяжении трёх столетий — достаточно долго, чтобы заслужить имя la belle province. С объединённой Канадой пришло время включить её в состав нации; её реки, города и люди принадлежат стране, которая их окружает."
  # Shared tooltip
  pfp_merge_subject_is_military_occupation_tt:0 "Является военной оккупацией [ROOT.GetName].\n"
  pfp_merge_puppet_ready_tt:0 "Должен быть марионеткой военной оккупации со всеми включёнными территориями\n"
  pfp_merge_canada_puppets_ready_tt:0 "§YВосточная Канада§!, §YЗападная Канада§!:\n"
  pfp_merge_china_puppets_ready_tt:0 "§YЧжили§!, §YШаньдун§!, §YХэнань§!, §YШаньси§!, §YЛянцзян§!, §YМинь-Чжэ§!, §YХугуан§!, §YЛянгуан§!, §YЮнь-Гуй§!, §YСычуань§!:\n"
  pfp_merge_east_africa_puppets_ready_tt:0 "§YЭфиопия§!, §YЭритрея§!, §YДжибути§!, §YСомалиленд§!, §YСомали§!, §YКения§!, §YУганда§!, §YТанганьика§!, §YСудан§!:\n"
  pfp_merge_france_puppets_ready_tt:0 "§YСеверная Франция§!, §YЮжная Франция§!:\n"
  pfp_merge_great_britain_puppets_ready_tt:0 "§YАнглия§!, §YШотландия§!, §YУэльс§!:\n"
  pfp_merge_iberia_puppets_ready_tt:0 "§YИспания§!, §YПортугалия§!:\n"
  pfp_merge_italy_puppets_ready_tt:0 "§YЛомбардия-Венеция§!, §YПьемонт§!, §YТоскана§!, §YПапская область§!, §YКоролевство обеих Сицилий§!:\n"
  pfp_merge_north_africa_puppets_ready_tt:0 "§YМарокко§!, §YАлжир§!, §YТунис§!, §YЛивия§!, §YЕгипет§!:\n"
  pfp_merge_western_russia_puppets_ready_tt:0 "§YЦентральная Россия§!, §YЮжная Россия§!, §YВолга§!, §YСеверо-Западная Россия§!:\n"
  pfp_merge_eastern_russia_puppets_ready_tt:0 "§YУрал§!, §YСибирь§!, §YДальневосточная Россия§!:\n"
  pfp_merge_western_usa_puppets_ready_tt:0 "§YСША Тихоокеанский§!, §YСША Скалистые горы§!:\n"
  pfp_merge_west_africa_puppets_ready_tt:0 "§YНигер§!, §YМали§!, §YНигерия§!, §YТого§!, §YДагомея§!, §YЗолотой Берег§!, §YВерхняя Вольта§!, §YБерег Слоновой Кости§!, §YГвинея§!, §YСьерра-Леоне§!, §YСенегал§!, §YГамбия§!, §YМавритания§!:\n"
  pfp_merge_usa_puppets_ready_tt:0 "§YСеверо-Восток США§!, §YСредний Запад США§!, §YЮг США§!:\n"
  pfp_merge_yugoslavia_puppets_ready_tt:0 "§YХорватия§!, §YСловения§!, §YБосния и Герцеговина§!, §YСербия§!:\n"
  # Canada
  pfp_merge_canada_not_yet_formed_tt:0 "Канада ещё не образована.\n"
  pfp_merge_puppet_must_core_owned_territories_tt:0 "Должна иметь ядро на всех занятых в настоящее время ядросодержащих территориях.\n"
  pfp_merge_canada_effect_form:0 "§YКанада§! образуется путём объединения §YВосточная Канада§! и §YЗападная Канада§!.\n"
  pfp_merge_canada_effect_annex:0 "§YКанада§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_canada_effect_cores:0 "§YКанада§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_canada_is_formed_tt:0 "Канада образована.\n"
  pfp_merge_canada_quebec_not_yet_absorbed_tt:0 "Квебек ещё не поглощён Канадой.\n"
  pfp_merge_canada_quebec_effect_annex:0 "§YКанада§! аннексирует §YКвебек§!, получая его ядра и ядросодержащие территории.\n"

  # United States
  pfp_merge_western_usa:0 "Сформировать западные Соединённые Штаты"
  pfp_merge_western_usa_desc:0 "Тихоокеанское побережье и Скалистые горы всегда были диким, необузданным западным краем американского эксперимента — от выжженных солнцем берегов Калифорнии до заснеженных вершин Каскадных гор. Прежде чем континент сможет воссоединиться, запад должен сначала заговорить единым голосом."
  pfp_merge_western_usa_not_yet_formed_tt:0 "Западные Соединённые Штаты ещё не образованы.\n"
  pfp_merge_western_usa_effect_form:0 "§YЗападные Соединённые Штаты§! образуется путём объединения §YСША Тихоокеанский§! и §YСША Скалистые горы§!.\n"
  pfp_merge_western_usa_effect_annex:0 "§YЗападные Соединённые Штаты§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_western_usa_effect_cores:0 "§YЗападные Соединённые Штаты§! получают ядра и претензии аннексированных марионеток.\n"

  pfp_merge_usa:0 "Сформировать восточные США"
  pfp_merge_usa_desc:0 "От фабрик и портов северо-востока до полей и городов юга и великого промышленного сердца Среднего Запада — эти три региона были опорами самой могущественной нации, какую когда-либо знал мир. Союз был сохранён однажды ценой огромных потерь; он может быть восстановлен вновь."
  pfp_merge_usa_not_yet_formed_tt:0 "Восточные США ещё не образованы.\n"
  pfp_merge_usa_effect_form:0 "§YВосточные США§! образуется путём объединения §YСеверо-Восток США§!, §YСредний Запад США§!, и §YЮг США§!.\n"
  pfp_merge_usa_effect_annex:0 "§YВосточные США§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_usa_effect_cores:0 "§YВосточные США§! получают ядра и претензии аннексированных марионеток.\n"

  pfp_merge_western_usa_is_formed_tt:0 "Западные США сформированы.\n"
  pfp_merge_eastern_usa_is_formed_tt:0 "Восточные США сформированы.\n"

  pfp_merge_united_states:0 "Сформировать Соединённые Штаты"
  pfp_merge_united_states_desc:0 "От сожжённых пустынь юго-запада до промышленных коридоров северо-востока, от золотых полей Среднего Запада до байу Глубокого Юга — Америка никогда не была просто одним регионом — она была всеми сразу. Восток и Запад каждый доказали свою силу. Теперь они должны доказать, что являются единой нацией."
  pfp_merge_united_states_not_yet_formed_tt:0 "Соединённые Штаты ещё не образованы.\n"
  pfp_merge_united_states_effect_form:0 "§YСоединённые Штаты§! образуется путём объединения §YЗападные Соединённые Штаты§! и §YВосточные США§!.\n"
  pfp_merge_united_states_effect_annex:0 "§YСоединённые Штаты§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_united_states_effect_cores:0 "§YСоединённые Штаты§! получают ядра и претензии аннексированных марионеток.\n"



  # China
  pfp_merge_china:0 "Сформировать Китай"
  pfp_merge_china_desc:0 "На протяжении более двух тысяч лет провинции Срединного государства подчинялись единому двору, связанные Мандатом Неба и конфуцианским порядком, пережившим каждую династию. Каждая из них несёт память о единым Китае — раздробление было катастрофой, а не судьбой."
  pfp_merge_china_not_yet_formed_tt:0 "Китай ещё не образован.\n"
  pfp_merge_china_effect_form:0 "§YКитай§! образуется путём объединения §YЧжили§!, §YШаньдун§!, §YХэнань§!, §YШаньси§!, §YЛянцзян§!, §YМинь-Чжэ§!, §YХугуан§!, §YЛянгуан§!, §YЮнь-Гуй§!, и §YСычуань§!.\n"
  pfp_merge_china_effect_annex:0 "§YКитай§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_china_effect_cores:0 "§YКитай§! получает ядра и претензии аннексированных марионеток.\n"

  pfp_merge_china_manchuria:0 "Включить Маньчжурию в состав Китая"
  pfp_merge_china_manchuria_desc:0 "Родина предков династии Цин и промышленный двигатель северо-восточного Китая, превращённый в регион тяжёлой промышленности и железных дорог. Его уголь и железо помогли питать современный мир; теперь они будут питать восстановление Китая."
  pfp_merge_china_is_formed_tt:0 "Китай образован.\n"
  pfp_merge_china_manchuria_not_yet_absorbed_tt:0 "Маньчжурия ещё не включена в состав Китая.\n"
  pfp_merge_china_manchuria_effect_annex:0 "§YКитай§! аннексирует §YМаньчжурию§!, получая её ядра и присоединяемые территории.\n"

  pfp_merge_china_inner_mongolia:0 "Включить Внутреннюю Монголию в состав Китая"
  pfp_merge_china_inner_mongolia_desc:0 "Степи северной границы Китая обозначали рубеж между оседлыми землями и кочевой степью с эпохи сюнну — граница, настолько оспариваемая, что она вдохновила на строительство Великой стены. Её включение распространяет китайскую власть на южный край монгольского плато и обеспечивает подступы к Пекину."
  pfp_merge_china_inner_mongolia_not_yet_absorbed_tt:0 "Внутренняя Монголия ещё не включена в состав Китая.\n"
  pfp_merge_china_inner_mongolia_effect_annex:0 "§YКитай§! аннексирует §YВнутреннюю Монголию§!, получая её ядра и присоединяемые территории.\n"

  pfp_merge_china_shaan_gan:0 "Включить Шааньгань в состав Китая"
  pfp_merge_china_shaan_gan_desc:0 "Эта территория хранит великий изгиб Жёлтой реки и древнюю столицу Чанъань — ныне Сиань — где четырнадцать императорских династий держали двор на оси Шёлкового пути. Сердце Китая на протяжении трёх тысяч лет; её возвращение завершает наш контроль над северо-западом."
  pfp_merge_china_shaan_gan_not_yet_absorbed_tt:0 "Шааньгань ещё не включён в состав Китая.\n"
  pfp_merge_china_shaan_gan_effect_annex:0 "§YКитай§! аннексирует §YШааньгань§!, получая его ядра и присоединяемые территории.\n"

  pfp_merge_china_qinghai:0 "Включить Цинхай в состав Китая"
  pfp_merge_china_qinghai_desc:0 "На северо-восточном краю Тибетского плато эта территория хранит истоки Жёлтой реки и Янцзы — двух артерий китайской цивилизации. Её включение закрепляет западный interior Китая и закрывает географические ворота в Тибет."
  pfp_merge_china_qinghai_not_yet_absorbed_tt:0 "Цинхай ещё не включён в состав Китая.\n"
  pfp_merge_china_qinghai_effect_annex:0 "§YКитай§! аннексирует §YЦинхай§!, получая его ядра и присоединяемые территории.\n"

  pfp_merge_china_taiwan:0 "Включить Тайвань в состав Китая"
  pfp_merge_china_taiwan_desc:0 "Этот остров лежит по ту сторону пролива, настолько узкого, что в ясный день виден материк. Он переходил из рук в руки, но никогда не переставал быть связанным с судьбой континента; время вернуть его в состав нации."
  pfp_merge_china_taiwan_not_yet_absorbed_tt:0 "Тайвань ещё не включён в состав Китая.\n"
  pfp_merge_china_taiwan_effect_annex:0 "§YКитай§! аннексирует §YТайвань§!, получая его ядра и присоединяемые территории.\n"

  pfp_merge_china_east_turkestan:0 "Включить Восточный Туркестан в состав Китая"
  pfp_merge_china_east_turkestan_desc:0 "Пустынные котловины и города-оазисы крайнего запада — там, где древний Шёлковый путь нёс шёлк на запад, а идеи — на восток. Его обширные степи и минеральные богатства делают его стратегически незаменимым; его включение завершает центральноазиатскую границу Китая."
  pfp_merge_china_east_turkestan_not_yet_absorbed_tt:0 "Восточный Туркестан ещё не включён в состав Китая.\n"
  pfp_merge_china_east_turkestan_requires_border_tt:0 "Тибет, Цинхай или Шааньгань должны быть сначала включены в состав Китая.\n"
  pfp_merge_china_east_turkestan_effect_annex:0 "§YКитай§! аннексирует §YВосточный Туркестан§!, получая его ядра и присоединяемые территории.\n"

  pfp_merge_china_tibet:0 "Включить Тибет в состав Китая"
  pfp_merge_china_tibet_desc:0 "Крыша мира — плато настолько высокое, что армии чувствуют высоту прежде, чем почувствуют врага. Реки, стекающие с его ледников, орошают половину Азии. Установление над ним консолидированного контроля обеспечивает всю нашу юго-западную границу."
  pfp_merge_china_tibet_not_yet_absorbed_tt:0 "Тибет ещё не включён в состав Китая.\n"
  pfp_merge_china_tibet_effect_annex:0 "§YКитай§! аннексирует §YТибет§!, получая его ядра и присоединяемые территории.\n"

  # East Africa
  pfp_merge_east_africa:0 "Сформировать Восточную Африку"
  pfp_merge_east_africa_desc:0 "От истоков Нила в Судане и Уганде до побережья Сомали, от эфиопских нагорий, которые одни устояли перед колонизацией, до великих саванных равнин Танганьики — Восточная Африка охватывает весь восточный коридор континента. Эти земли объединяют воды бассейна Нила, муссонная торговля Индийского океана и история, сформированная теми же нагорными королевствами, прибрежными городами-государствами и цивилизациями Рифтовой долины. Разделённые на фрагменты колониальными границами, их объединение создало бы господствующую державу всего восточного побережья Африки."
  pfp_merge_east_africa_not_yet_formed_tt:0 "Восточная Африка ещё не образована.\n"
  pfp_merge_east_africa_effect_form:0 "§YВосточная Африка§! образуется путём объединения §YЭфиопия§!, §YЭритрея§!, §YДжибути§!, §YСомалиленд§!, §YСомали§!, §YКения§!, §YУганда§!, §YТанганьика§!, и §YСудан§!.\n"
  pfp_merge_east_africa_effect_annex:0 "§YВосточная Африка§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_east_africa_effect_cores:0 "§YВосточная Африка§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_east_africa_is_formed_tt:0 "Восточная Африка образована.\n"














  pfp_merge_east_africa_ruanda_urundi:0 "Включить Руанда-Урунди в состав Восточной Африки"
  pfp_merge_east_africa_ruanda_urundi_desc:0 "Притаившийся на нагорьях над бассейном Конго, это один из наиболее густонаселённых районов Африки — небольшой по площади, но значимый географически, зажатый между Великими озёрами и уступом Рифтовой долины. Его включение закрывает брешь в нашей центральноафриканской границе."
  pfp_merge_east_africa_ruanda_urundi_not_yet_absorbed_tt:0 "Руанда-Урунди ещё не включена в состав Восточной Африки.\n"
  pfp_merge_east_africa_ruanda_urundi_effect_annex:0 "§YВосточная Африка§! аннексирует §YРуанда-Урунди§!, получая её ядра и присоединяемые территории.\n"





  pfp_merge_north_africa:0 "Сформировать Северную Африку"
  pfp_merge_north_africa_desc:0 "От гор Атлас в Марокко до берегов Нила североафриканское побережье на протяжении четырёх тысяч лет служило перекрёстком средиземноморской цивилизации. Некогда объединённые под властью Рима и великих исламских халифатов, Магриб и долина Нила разделяют общее наследие, которое колониальные границы давно разъединили. Их объединение создаст державу, способную изменить весь средиземноморский мир."
  pfp_merge_north_africa_not_yet_formed_tt:0 "Северная Африка ещё не образована.\n"
  pfp_merge_north_africa_effect_form:0 "§YСеверная Африка§! образуется путём объединения §YМарокко§!, §YАлжир§!, §YТунис§!, §YЛивия§!, и §YЕгипет§!.\n"
  pfp_merge_north_africa_effect_annex:0 "§YСеверная Африка§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_north_africa_effect_cores:0 "§YСеверная Африка§! получает ядра и претензии аннексированных марионеток.\n"
  pfp_merge_north_africa_is_formed_tt:0 "Северная Африка образована.\n"











  pfp_merge_north_africa_western_sahara:0 "Включить Западную Сахару в состав Северной Африки"
  pfp_merge_north_africa_western_sahara_desc:0 "Простираясь от атлантического берега вглубь Сахары, эта обширная и малонаселённая территория охраняет западные подступы к Магрибу. Её включение закрепляет атлантический фланг Северной Африки и обеспечивает безопасность южной пустынной границы."
  pfp_merge_north_africa_western_sahara_not_yet_absorbed_tt:0 "Западная Сахара ещё не включена в состав Северной Африки.\n"
  pfp_merge_north_africa_western_sahara_effect_annex:0 "§YСеверная Африка§! аннексирует §YЗападную Сахару§!, получая её ядра и включаемые территории.\n"

  pfp_merge_north_africa_rif:0 "Включить Риф в состав Северной Африки"
  pfp_merge_north_africa_rif_desc:0 "Прижатые к средиземноморскому побережью северного Марокко, горы Риф укрывали короткую и жестокую республику, бросившую вызов одновременно Испании и Франции, прежде чем она была разгромлена в 1926 году. Её берберские кланы так и не смирились с чужеземным господством. Включение Рифа в состав Северной Африки является актом примирения не меньше, чем завоевания."
  pfp_merge_north_africa_rif_not_yet_absorbed_tt:0 "Риф ещё не включён в состав Северной Африки.\n"
  pfp_merge_north_africa_rif_effect_annex:0 "§YСеверная Африка§! аннексирует §YРиф§!, получая его ядра и включаемые территории.\n"

  pfp_merge_west_africa:0 "Сформировать Западную Африку"
  pfp_merge_west_africa_desc:0 "От сахарских окраин Мавритании и Мали до тропических лесов Золотого Берега и дельты Нигера — Западная Африка охватывает сердце древних империй Сахеля. Королевства Мали, Сонгаи и Гана некогда господствовали на транссахарских торговых путях, соединявших Средиземноморье с Африкой к югу от Сахары. Рассеянные колониальными границами на дюжину фрагментов, эти земли объединяет глубокая связь культуры, религии и истории. Их объединение восстановит великую державу на атлантическом побережье Африки."
  pfp_merge_west_africa_not_yet_formed_tt:0 "Западная Африка ещё не образована.\n"
  pfp_merge_west_africa_effect_form:0 "§YЗападная Африка§! образуется путём объединения §YНигер§!, §YМали§!, §YНигерия§!, §YТого§!, §YДагомея§!, §YЗолотой Берег§!, §YВерхняя Вольта§!, §YБерег Слоновой Кости§!, §YГвинея§!, §YСьерра-Леоне§!, §YСенегал§!, §YГамбия§!, и §YМавритания§!.\n"
  pfp_merge_west_africa_effect_annex:0 "§YЗападная Африка§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_west_africa_effect_cores:0 "Все ядра и включаемые территории передаются §YЗападной Африке§!.\n"
  pfp_merge_west_africa_is_formed_tt:0 "Западная Африка образована.\n"
  pfp_merge_west_africa_guinea_bissau:0 "Включить Гвинею-Бисау в состав Западной Африки"
  pfp_merge_west_africa_guinea_bissau_desc:0 "Узкая полоска побережья и внутренних территорий, вырезанная из сенегамбийского хинтерланда, Гвинея-Бисау провела века в качестве перевалочного пункта португальской работорговли, прежде чем превратиться в забытую окраину колониальной эпохи. Её народы разделяют язык и культуру с соседями по обе стороны любой границы. Включение в состав Западной Африки завершит береговую линию нового государства."
  pfp_merge_west_africa_guinea_bissau_not_yet_absorbed_tt:0 "Гвинея-Бисау ещё не включена в состав Западной Африки.\n"
  pfp_merge_west_africa_guinea_bissau_effect_annex:0 "§YЗападная Африка§! аннексирует §YГвинею-Бисау§!, получая её ядра и включаемые территории.\n"
  pfp_merge_west_africa_liberia:0 "Включить Либерию в состав Западной Африки"
  pfp_merge_west_africa_liberia_desc:0 "Основанная в XIX веке как убежище для освобождённых американских рабов, Либерия выделяется среди всех других государств западноафриканского побережья — номинально независимая в то время, когда колониальные державы делили остальную часть региона между собой. Её американо-либерийский правящий класс поддерживал хрупкий суверенитет между великими европейскими империями. В складывающемся новом порядке включение в объединённую Западную Африку наконец закрепит её в африканском окружении."
  pfp_merge_west_africa_liberia_not_yet_absorbed_tt:0 "Либерия ещё не включена в состав Западной Африки.\n"
  pfp_merge_west_africa_liberia_effect_annex:0 "§YЗападная Африка§! аннексирует §YЛиберию§!, получая её ядра и включаемые территории.\n"
  pfp_merge_west_africa_cape_verde:0 "Включить Кабо-Верде в состав Западной Африки"
  pfp_merge_west_africa_cape_verde_desc:0 "Разбросанный по Атлантическому океану примерно в пятистах километрах от побережья Сенегала, архипелаг Кабо-Верде был необитаемым вулканическим архипелагом, когда португальские мореплаватели впервые высадились там в XV веке. Он стал важным перевалочным пунктом атлантической торговли, связав Европу, Африку и Америку. Далёкий от материка, его интеграция в Западную Африку распространит влияние нового государства за моря."
  pfp_merge_west_africa_cape_verde_not_yet_absorbed_tt:0 "Кабо-Верде ещё не включено в состав Западной Африки.\n"
  pfp_merge_west_africa_cape_verde_effect_annex:0 "§YЗападная Африка§! аннексирует §YКабо-Верде§!, получая его ядра и включаемые территории.\n"
  pfp_merge_eastern_russia:0 "Сформировать Eastern Russia"
  pfp_merge_france:0 "Сформировать Францию"
  pfp_merge_france_alps:0 "Поглотить the French Alps в France"
  pfp_merge_germany:0 "Сформировать Германию"
  pfp_merge_germany_konigsberg:0 "Поглотить Königsberg в Germany"
  pfp_merge_great_britain:0 "Сформировать Великобританию"
  pfp_merge_great_britain_northern_ireland:0 "Поглотить Northern Ireland в Great Britain"
  pfp_merge_iberia:0 "Сформировать Иберию"
  pfp_merge_italy:0 "Сформировать Италию"
  pfp_merge_italy_sardinia:0 "Поглотить Sardinia в Italy"
  pfp_merge_japan:0 "Сформировать Японию"
  pfp_merge_russia:0 "Сформировать Russia"
  pfp_merge_western_russia:0 "Сформировать Western Russia"
  pfp_merge_western_russia_karelia:0 "Поглотить Karelia в Western Russia"
  pfp_merge_western_russia_murmansk:0 "Поглотить Murmansk в Western Russia"
  pfp_merge_western_russia_northern_caucasus:0 "Поглотить Northern Caucasus в Western Russia"
  pfp_merge_yugoslavia:0 "Сформировать Югославию"
  pfp_merge_yugoslavia_macedonia:0 "Поглотить Macedonia в Yugoslavia"
  pfp_merge_yugoslavia_montenegro:0 "Поглотить Montenegro в Yugoslavia"
  pfp_merge_eastern_russia_desc:0 "За Уральскими горами простирается крупнейшая в мире непрерывная суша — от горного хребта Азии до Владивостока на берегу Тихого океана. Транссибирская магистраль была построена, чтобы сделать эту необъятность управляемой; теперь она объединит эти территории под единой властью."
  pfp_merge_france_alps_desc:0 "Естественная крепость на юго-восточной границе Франции — горные вершины и перевалы, разделяющие долину Роны и Паданскую равнину, оспаривались ещё с тех времён, когда Ганнибал провёл через них своих слонов. Их включение завершает альпийскую границу Франции и закрывает подступы со стороны Италии."
  pfp_merge_france_desc:0 "Liberté, égalité, fraternité — идеалы Республики не принадлежат ни одному отдельному региону; они принадлежат всей Франции. Промышленный север, отмеченный двумя великими войнами, развернувшимися на его земле, и солнечный юг с корнями, уходящими в римскую Галлию, — две половины одной цивилизации. Триколор развевался над обоими; он будет развеваться снова."
  pfp_merge_germany_desc:0 "Бисмарк сковал германскую нацию железом и кровью — потребовались две катастрофические войны, чтобы разбить её вновь. Разделённые ли вдоль Рейна, Эльбы или старых гогенцоллернских границ, германские земли разделяют один язык, одну культуру и тысячелетие переплетённой истории, уходящей корнями в Священную Римскую империю."
  pfp_merge_germany_konigsberg_desc:0 "Древняя столица Пруссии — город, где короновались Гогенцоллерны и где Иммануил Кант прожил всю жизнь, ни разу не покинув его. Построенная Тевтонскими рыцарями в XIII веке, эта балтийская крепость янтарной торговли не принадлежит никакой иной нации, кроме Германии."
  pfp_merge_great_britain_desc:0 "Три нации, населяющие один остров, связаны Короной со времён Актов об унии, однако их узы глубже любого королевского указа. От угольных долин южного Уэльса до верфей Клайда и фабрик Мидлендса эти народы вместе строили империю. Пришло время восстановить союз, на котором эта империя была основана."
  pfp_merge_great_britain_northern_ireland_desc:0 "Самый неизменный политический вопрос Великобритании — уголок Ирландии, выбравший остаться под Короной, разделивший остров и противопоставивший соседей друг другу на протяжении поколений. Какой бы бурной ни была её история, её положение, господствующее над Северным проливом, делает её стратегически неотделимой от британского материка."
  pfp_merge_iberia_desc:0 "Королевства, давшие начало эпохе Великих географических открытий с одного и того же залитого солнцем полуострова, разделили мир между собой в Тордесильясе. Их многовековое соперничество реально, но столь же реально и их родство — те же римские дороги соединяют Лиссабон с Мадридом, те же атлантические ветры формировали обе короны. Объединённые как Иберия, они вновь могут явить престиж старого иберийского мира."
  pfp_merge_italy_desc:0 "С тех пор как Данте писал о единой Италии, а Макиавелли мечтал о правителе, способном её объединить, полуостров сопротивляется унификации. Рассеянные наследники римской цивилизации — каждый гордится своим прошлым, но каждый неполон без остальных — ждали достаточно долго. Рисорджименто было лишь первой попыткой; теперь её можно завершить."
  pfp_merge_italy_sardinia_desc:0 "Этот остров переходил от арагонцев к савойцам и Габсбургам, прежде чем стать номинальной резиденцией Савойского дома — династии, которая в итоге объединила Италию. Его суровый interior и прибрежные позиции делают его западным опорным пунктом итальянского господства над Тирренским морем."
  pfp_merge_japan_desc:0 "Священные родные острова составляли единую нацию со времён древних императоров. Их разделение — аберрация, рана, нанесённая народу, определяемому единством. Восстановление родных островов — не просто политический акт; это воплощение кокутай, самой сути нации."
  pfp_merge_russia_desc:0 "Две половины одного колосса, искусственно разделённые той же катастрофой, которая сокрушила государство. От берегов Балтики до Тихого океана, от арктической тундры до предгорий Кавказа — русские земли принадлежат друг другу. Медведь выстоял. Россия снова едина."
  pfp_merge_western_russia_desc:0 "Великие реки западной равнины — Волга, Дон, Днепр — всегда были артериями русской цивилизации, связывая земли, подчинявшиеся единой власти со времён царей. Эти территории никогда не были по-настоящему отдельными нациями; они были фрагментами разбитого целого."
  pfp_merge_western_russia_karelia_desc:0 "Земля десяти тысяч озёр и густых лесов, этот пограничный край — место, где Россия и её северные соседи оспаривают контроль на протяжении столетий. Её леса и водные пути — одни из наиболее яростно обороняемых территорий на континенте; теперь они переходят под единую российскую власть, обеспечивая северо-западные подступы к Ленинграду."
  pfp_merge_western_russia_murmansk_desc:0 "Единственный незамерзающий арктический порт России, доступный для навигации круглый год благодаря ответвлению Гольфстрима, достигающему этих широт. Кто владеет этим портом, тот владеет арктическими воротами — и маршрутом конвоев, доказавшим свою стратегическую ценность в каждом конфликте, испытавшем Россию с севера."
  pfp_merge_western_russia_northern_caucasus_desc:0 "Неспокойный рубеж русской экспансии со времён жестоких кампаний Ермолова — регион гордых горных народов, никогда не принимавших покорение легко. Однако нефтяные промыслы и положение, господствующее над сухопутным мостом между Чёрным морем и Каспием, делают его слишком важным в стратегическом отношении, чтобы оставить за пределами нашего контроля."
  pfp_merge_yugoslavia_desc:0 "Вырезанные из обломков Османской и Габсбургской империй, южнославянские народы — Južni Slaveni — долго считались мечтателями, верившими, что эти земли могут стать единым целым. Теперь мечта в пределах досягаемости. Братство и единство — bratstvo i jedinstvo — станут больше чем лозунгом."
  pfp_merge_yugoslavia_macedonia_desc:0 "Там, где Александр Великий построил империю и где каждая балканская держава с тех пор видела приз, достойный борьбы. Её положение на перекрёстке полуострова — где на протяжении поколений сталкивались греческие, болгарские, сербские и турецкие амбиции — делает её ключом к господству на Южных Балканах."
  pfp_merge_yugoslavia_montenegro_desc:0 "Земля чёрных гор и свирепых воинов — королевство, устоявшее перед пятью веками османского давления лишь благодаря местности и стойкости. Их давнее братство с другими южнославянскими народами делает их включение не завоеванием, а возвращением домой."
  pfp_merge_eastern_russia_effect_annex:0 "§YВосточная Россия§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
