  pfp_merge_arabia:0 "Сформировать Аравию"
  pfp_merge_arabia_desc:0 "От песков Неджда до берегов Омана Аравийский полуостров издавна является перекрёстком веры и торговли. Города Мекка и Медина служат опорой цивилизации, более древней, чем любая другая на земле; пути ладана Дофара когда-то определяли торговлю древнего мира. Объединившись как Аравия, эти царства смогут вернуть своё место в сердце цивилизации."
  pfp_merge_arabia_not_yet_formed_tt:0 "Аравия ещё не образована.\n"
  pfp_merge_arabia_puppets_ready_tt:0 "§YСаудовская Аравия§!, §YЙемен§!, §YОман§!:\n"
  pfp_merge_arabia_effect_form:0 "§YАравия§! образуется путём объединения §YСаудовская Аравия§!, §YЙемен§!, и §YОман§!.\n"
  pfp_merge_arabia_effect_annex:0 "§YАравия§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_arabia_effect_cores:0 "§YАравия§! получает ядра и претензии аннексированных марионеток.\n"

  pfp_merge_korea:0 "Сформировать Корею"
  pfp_merge_korea_desc:0 "Разделённый войной и идеологией, Корейский полуостров долго страдал под иностранным влиянием и внутренними раздорами. От рисовых полей юга до гор севера корейский народ разделяет единый язык, единую культуру и единую историю. Пришло время отбросить разделения настоящего и вернуть единство прошлого."
  pfp_merge_korea_not_yet_formed_tt:0 "Корея ещё не образована.\n"
  pfp_merge_korea_puppets_ready_tt:0 "§YСеверная Корея§! и §YЮжная Корея§!:\n"
  pfp_merge_korea_effect_form:0 "§YКорея§! образуется путём объединения §YСеверная Корея§! и §YЮжная Корея§!.\n"
  pfp_merge_korea_effect_annex:0 "§YКорея§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_korea_effect_cores:0 "§YКорея§! получает ядра и претензии аннексированного вассала.\n"

  pfp_merge_guiana:0 "Сформировать Гвианы"
  pfp_merge_guiana_desc:0 "Три колонии трёх империй, Гвианы разделяют общую географию, общий климат и общую судьбу. От джунглей внутренних районов до рек, впадающих в Атлантический океан, эти территории имеют больше общего друг с другом, чем с далёкими столицами, которые ими управляют. Объединённые как Гвиана, они могут создать новую идентичность на основе общей земли."
  pfp_merge_guiana_not_yet_formed_tt:0 "Гвиана ещё не образована.\n"
  pfp_merge_guiana_puppets_ready_tt:0 "§YГайана§!, §YСуринам§! и §YФранцузская Гвиана§!:\n"
  pfp_merge_guiana_effect_form:0 "§YГвиана§! образуется путём объединения §YГайана§!, §YСуринам§!, и §YФранцузская Гвиана§!.\n"
  pfp_merge_guiana_effect_annex:0 "§YГвиана§! аннексирует всех ранее перечисленных вассалов, получая их войска.\n"
  pfp_merge_guiana_effect_cores:0 "§YГвиана§! получает ядра и претензии аннексированных вассалов.\n"

