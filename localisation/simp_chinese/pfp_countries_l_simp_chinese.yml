  ## PFP MERGER DECISIONS ##
  pfp_merge_canada:0 "形成加拿大"
  pfp_merge_canada_desc:0 "一个统一的自治领曾经横跨北美大陆北半部，从大西洋海岸延伸至西部草原，以横贯大陆的铁路和共同的殖民遗产为纽带。哈利法克斯与温哥华之间的距离虽然遥远，但法律、语言和历史的纽带比任何临时分裂都更为深厚。"

  pfp_merge_canada_quebec:0 "将魁北克并入加拿大"
  pfp_merge_canada_quebec_desc:0 "圣劳伦斯河畔的法语中心地带守护着自己的语言和独特文化已有三个世纪，足以赢得「美丽省份」之名。加拿大统一后，是时候将其纳入国家了——它的河流、城市和人民都属于围绕着它的这个国家。"
