  pfp_merge_yugoslavia_bosnia_herzegovina_effect_annex:0 "§Y南斯拉夫§!吞并§Y波斯尼亚-黑塞哥维那§!，获得其核心区域与可核心化领土。\n"
  pfp_merge_yugoslavia_bosnia_herzegovina_not_yet_absorbed_tt:0 "波斯尼亚-黑塞哥维那尚未被南斯拉夫吸收。\n"
  pfp_merge_yugoslavia_croatia_effect_annex:0 "§Y南斯拉夫§!吞并§Y克罗地亚§!，获得其核心区域与可核心化领土。\n"
  pfp_merge_yugoslavia_croatia_not_yet_absorbed_tt:0 "克罗地亚尚未被南斯拉夫吸收。\n"
  pfp_merge_yugoslavia_macedonia_effect_annex:0 "§Y南斯拉夫§!兼并§Y马其顿§!，获得其核心及可核心化领土。\n"
  pfp_merge_yugoslavia_macedonia_not_yet_absorbed_tt:0 "马其顿尚未被南斯拉夫吸收。\n"
  pfp_merge_yugoslavia_slovenia_effect_annex:0 "§Y南斯拉夫§!吞并§Y斯洛文尼亚§!，获得其核心区域与可核心化领土。\n"
  pfp_merge_yugoslavia_slovenia_not_yet_absorbed_tt:0 "斯洛文尼亚尚未被南斯拉夫吸收。\n"
  pfp_merge_yugoslavia_not_yet_formed_tt:0 "南斯拉夫尚未形成。\n"
  pfp_merge_central_africa:0 "形成Central Africa"
  pfp_merge_central_africa_cameroon:0 "将Cameroon并入Central Africa"
  pfp_merge_central_africa_cameroon_desc:0 "喀麦隆是一战后由法国和英国分治的国际联盟委任统治地，它架起了西非与中非之间的桥梁。其高地延伸至肥沃的海岸，位于非洲的肘部，使其成为西部面向大西洋的领土与下方刚果盆地之间天然的纽带。将其纳入版图将封闭中非的西北边界。"
  pfp_merge_central_africa_cameroon_effect_annex:0 "§Y中非§!吞并§Y喀麦隆§!，获得其核心及可核心化领土。\n"
  pfp_merge_central_africa_cameroon_not_yet_absorbed_tt:0 "喀麦隆尚未被吸收。\n"
  pfp_merge_central_africa_chad:0 "将Chad并入Central Africa"
  pfp_merge_central_africa_chad_desc:0 "乍得是法属赤道非洲最北端的领土，从撒哈拉边缘延伸至南部的棉花平原。乍得湖是其广阔的内陆海，千年来一直是撒哈拉贸易的十字路口。将其纳入版图将巩固中非向北的延伸，并完成法国曾经从布拉柴维尔管辖的联邦。"
  pfp_merge_central_africa_chad_effect_annex:0 "§Y中非§!吞并§Y乍得§!，获得其核心及可核心化领土。\n"
  pfp_merge_central_africa_chad_not_yet_absorbed_tt:0 "乍得尚未被吸收。\n"
  pfp_merge_central_africa_desc:0 "The Congo Basin is the heart of equatorial Africa — a vast river system draining one of the largest tropical rainforests on earth, rich in rubber, copper, and ivory beyond the reckoning of any contemporary power. The Belgian Congo, vast and largely unmapped, is a state unto itself. Around it, the forests and savannahs of the surrounding territories await unification into a single Central African state that would rank among the continent's great powers."
  pfp_merge_central_africa_effect_annex:0 "§Y中非§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_central_africa_equatorial_guinea:0 "将Equatorial Guinea并入Central Africa"
  pfp_merge_central_africa_equatorial_guinea_desc:0 "赤道几内亚是西班牙在非洲大陆的唯一领土，是一块夹在喀麦隆和加蓬之间的小飞地——一个殖民时代的遗产，本身战略价值有限，但象征意义重大。将其吸收将完成中非的海岸线，并消除该地区最后一块外国控制的飞地。"
  pfp_merge_central_africa_equatorial_guinea_effect_annex:0 "§Y中非§!吞并§Y赤道几内亚§!，获得其核心及可核心化领土。\n"
  pfp_merge_central_africa_equatorial_guinea_not_yet_absorbed_tt:0 "赤道几内亚尚未被吸收。\n"
  pfp_merge_central_africa_gabon:0 "将Gabon并入Central Africa"
  pfp_merge_central_africa_gabon_desc:0 "利伯维尔（仿照弗里敦传统作为解放奴隶定居点创建）是赤道非洲大西洋沿岸的支柱。加蓬茂密的森林几乎未受触动；地下蕴藏着什么，人们才刚刚开始了解。其沿海位置和内河通道将为中非提供通往大西洋的第二个窗口。"
  pfp_merge_central_africa_gabon_effect_annex:0 "§Y中非§!吞并§Y加蓬§!，获得其核心及可核心化领土。\n"
  pfp_merge_central_africa_gabon_not_yet_absorbed_tt:0 "加蓬尚未被吸收。\n"
  pfp_merge_central_africa_is_formed_tt:0 "中非已形成。\n"
  pfp_merge_central_africa_not_yet_formed_tt:0 "中非尚未形成。\n"
  pfp_merge_central_africa_puppets_ready_tt:0 "§Y比属刚果§! and §Y刚果-布拉柴维尔§!:\n"
  pfp_merge_central_africa_ubangi_shari:0 "将Ubangi-Shari并入Central Africa"
  pfp_merge_central_africa_ubangi_shari_desc:0 "以北部和东部边界的两条河流命名，乌班吉-沙里占据着刚果盆地与萨赫勒之间的高原。按殖民地标准来看，这里行政管理薄弱，人口稀少——其真正的价值在于它作为中非与北部领土之间内陆桥梁的战略位置。"
  pfp_merge_central_africa_ubangi_shari_effect_annex:0 "§Y中非§!吞并§Y乌班吉-沙里§!，获得其核心及可核心化领土。\n"
  pfp_merge_central_africa_ubangi_shari_not_yet_absorbed_tt:0 "乌班吉-沙里尚未被吸收。\n"
  pfp_merge_central_africa_effect_form:0 "§Y中非§!由合并§Y比属刚果§!、§Y刚果-布拉柴维尔§!而形成。\n"
  pfp_merge_central_africa_effect_cores:0 "§Y中非§!获得了被吞并傀儡的核心与主张。\n"
  pfp_merge_south_africa_puppets_ready_tt:0 "§Y南非§!, §Y西南非洲§!, §Y安哥拉§!, §Y贝专纳兰§!, §Y北罗得西亚§!, §Y南罗得西亚§!, §Y尼亚萨兰§!, §Y莫桑比克§!:\n"
  pfp_merge_south_africa:0 "形成South Africa"
  pfp_merge_south_africa_desc:0 "从安哥拉和西南非洲风吹雨打的大西洋海岸到莫桑比克的印度洋海岸，从赞比西河谷到好望角，南部非洲涵盖了大陆上工业最发达、战略最重要的地区。其地下蕴藏着世界上最大的黄金和钻石储量——正是这笔财富将欧洲列强卷入一个世纪的角逐、战争和铁路建设，使德兰士瓦成为大陆的经济中心。被殖民地边界分割为英国、葡萄牙和前德国领土，这些土地共享大河、高原和印度洋海岸线的共同地理特征。他们的统一将铸就一股同时掌控大西洋和好望角航线的力量——连接世界大洋的南方门户。"
  pfp_merge_south_africa_not_yet_formed_tt:0 "南非尚未形成。\n"
  pfp_merge_south_africa_effect_form:0 "§Y南非§!由合并§Y南非§!、§Y西南非洲§!、§Y安哥拉§!、§Y贝专纳兰§!、§Y北罗得西亚§!、§Y南罗得西亚§!、§Y尼亚萨兰§!、§Y莫桑比克§!而形成。\n"
  pfp_merge_south_africa_effect_annex:0 "§Y南非§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_south_africa_effect_cores:0 "§Y南非§!获得了被吞并傀儡的核心与主张。\n"
  pfp_merge_south_africa_is_formed_tt:0 "南非已形成。\n"
  pfp_merge_south_africa_madagascar:0 "将Madagascar并入South Africa"
  pfp_merge_south_africa_madagascar_desc:0 "马达加斯加被莫桑比克海峡与非洲大陆隔开，是世界第四大岛，也是生物多样性最独特的岛屿之一。其港口控制着西印度洋的海上航线和莫桑比克海峡的进出通道。将其纳入版图将扩大南非对周边海域的控制，确保通往好望角航线的海上通道。"
  pfp_merge_south_africa_madagascar_not_yet_absorbed_tt:0 "马达加斯加尚未被并入南非。\n"
  pfp_merge_south_africa_madagascar_effect_annex:0 "§Y南非§!吞并§Y马达加斯加§!，获得其核心及可核心化领土。\n"
  pfp_merge_scandinavia_puppets_ready_tt:0 "§Y挪威§!, §Y瑞典§!, §Y丹麦§!:\n"
  pfp_merge_scandinavia:0 "形成Scandinavia"
  pfp_merge_scandinavia_desc:0 "从挪威的峡湾到瑞典北部的矿产地带和丹麦的平原，斯堪的纳维亚三个王国共享着可追溯至维京时代的共同遗产——这些水手、商人和战士曾经统治着从波罗的海到大西洋的欧洲海岸。被几个世纪的王朝竞争分裂为不同的王冠，这些民族说着相关联的语言，信奉同一传统，历史上共同度过的时光多于分离的时光。在单一旗帜下的重新统一将恢复北方海域的主导力量。"
  pfp_merge_scandinavia_not_yet_formed_tt:0 "斯堪的纳维亚尚未形成。\n"
  pfp_merge_scandinavia_effect_form:0 "§Y斯堪的纳维亚§!由合并§Y挪威§!、§Y瑞典§!、§Y丹麦§!而形成。\n"
  pfp_merge_scandinavia_effect_annex:0 "§Y斯堪的纳维亚§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_scandinavia_effect_cores:0 "§Y斯堪的纳维亚§!获得了被吞并傀儡的核心与主张。\n"
  pfp_merge_scandinavia_is_formed_tt:0 "斯堪的纳维亚已形成。\n"
  pfp_merge_scandinavia_iceland:0 "将Iceland并入Scandinavia"
  pfp_merge_scandinavia_iceland_desc:0 "9世纪登陆冰岛的第一批北欧定居者发现了一座位于已知世界边缘的火与冰之岛——一片从未有过人类定居的火山峰、冰川和间歇泉之地。几个世纪以来，它作为斯堪的纳维亚文明的遥远前哨，是保存维京时代记忆的萨迦之乡。将其纳入版图将把斯堪的纳维亚的影响力延伸至北大西洋，确保欧洲与更广阔世界之间的海上航线。"
  pfp_merge_scandinavia_iceland_not_yet_absorbed_tt:0 "冰岛尚未被并入斯堪的纳维亚。\n"
  pfp_merge_scandinavia_iceland_effect_annex:0 "§Y斯堕的纳维亚§!吞并§Y冰岛§!，获得其核心及可核心化领土。\n"
  pfp_merge_scandinavia_greenland:0 "将Greenland并入Scandinavia"
  pfp_merge_scandinavia_greenland_desc:0 "红色埃里克以格陵兰为名吸引定居者，五个世纪的北欧殖民者在其西南海岸艰难求存，最终在历史记录中消失。这座世界上最大的岛屿横跨北方海上航线，其冰盖之下蕴藏着可能定义未来世纪的资源。将其纳入版图将使斯堪的纳维亚在世界之巅获得立足点。"
  pfp_merge_scandinavia_greenland_not_yet_absorbed_tt:0 "格陵兰尚未被并入斯堪的纳维亚。\n"
  pfp_merge_scandinavia_greenland_effect_annex:0 "§Y斯堕的纳维亚§!吞并§Y格陵兰§!，获得其核心及可核心化领土。\n"

  pfp_merge_baltic:0 "形成波罗的海三国"
  pfp_merge_baltic_desc:0 "爱沙尼亚与拉脱维亚被里加湾分隔，却因琥珀海岸、路德宗信仰与数世纪共同被统治的历史紧密相连，共同构成波罗的海世界的北部核心。两国均在大战后的混乱中从俄德帝国的废墟上建立了主权国家，赢得独立。两国联合将巩固北波罗的海沿岸，为延伸至立陶宛边境的更广泛邦联奠定基础。"
  pfp_merge_baltic_not_yet_formed_tt:0 "波罗的海三国尚未形成。\n"
  pfp_merge_baltic_puppets_ready_tt:0 "§Y爱沙尼亚§!, §Y拉脱维亚§!:\n"
  pfp_merge_baltic_effect_form:0 "§Y波罗的海三国§!由合并§Y爱沙尼亚§!、§Y拉脱维亚§!而形成。\n"
  pfp_merge_baltic_effect_annex:0 "§Y波罗的海三国§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_baltic_effect_cores:0 "§Y波罗的海三国§!获得被吞并傀儡的核心与主张。\n"
  pfp_merge_baltic_is_formed_tt:0 "波罗的海三国已形成。\n"
  pfp_merge_baltic_lithuania:0 "将立陶宛并入波罗的海三国"
  pfp_merge_baltic_lithuania_desc:0 "立陶宛是欧洲最后一个异教王国——在雅盖隆王朝统治下，曾从波罗的海延伸至黑海的中世纪巨国。虽信奉天主教，与北方路德宗邻国不同，但共享同样的琥珀海岸、同样的地缘政治脆弱性与大战赋予的独立。其加入使波罗的海联合完整，将联邦向南延伸。"
  pfp_merge_baltic_lithuania_not_yet_absorbed_tt:0 "立陶宛尚未被并入波罗的海三国。\n"
  pfp_merge_baltic_lithuania_effect_annex:0 "§Y波罗的海三国§!吞并§Y立陶宛§!，获得其核心与可核心化领土。\n"

  pfp_merge_central_america:0 "形成中美洲"
  pfp_merge_central_america_desc:0 "中美洲地峡的各国——危地马拉、洪都拉斯、萨尔瓦多、尼加拉瓜、哥斯达黎加和巴拿马——曾经在短命的中美洲联邦共和国旗帜下统一，却于1838年因政治纷争而分裂。这些国家共享同一语言、殖民地遗产，以及连接两大洲的狭窄陆桥，对巴拿马运河通道拥有战略控制权。它们的重新统一将重燃地峡最古老的梦想：一个同时掌控加勒比海与太平洋的单一国家。"
  pfp_merge_central_america_not_yet_formed_tt:0 "中美洲尚未形成。\n"
  pfp_merge_central_america_puppets_ready_tt:0 "§Y危地马拉§!、§Y洪都拉斯§!、§Y萨尔瓦多§!、§Y尼加拉瓜§!、§Y哥斯达黎加§!、§Y巴拿马§!:\n"
  pfp_merge_central_america_effect_form:0 "§Y中美洲§!由合并§Y危地马拉§!、§Y洪都拉斯§!、§Y萨尔瓦多§!、§Y尼加拉瓜§!、§Y哥斯达黎加§!、§Y巴拿马§!而形成。\n"
  pfp_merge_central_america_effect_annex:0 "§Y中美洲§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_central_america_effect_cores:0 "§Y中美洲§!获得了被吞并傀儡的核心与主张。\n"
  pfp_merge_central_america_is_formed_tt:0 "中美洲已形成。\n"
  pfp_merge_central_america_belize:0 "将伯利兹并入中美洲"
  pfp_merge_central_america_belize_desc:0 "英属洪都拉斯是海盗时代的遗迹——一块夹在危地马拉与加勒比海之间的英语飞地，被危地马拉视为被夺领土，由英国作为木材殖民地再转为王室领地而持有。将其并入中美洲将满足邻国的领土野心，并将地峡统一于单一行政管辖之下，填补陆桥最后的缺口。"
  pfp_merge_central_america_belize_not_yet_absorbed_tt:0 "伯利兹尚未被中美洲吸收。\n"
  pfp_merge_central_america_belize_effect_annex:0 "§Y中美洲§!吞并§Y伯利兹§!，获得其核心及可核心化领土。\n"

  pfp_merge_west_indies:0 "形成西印度群岛"
  pfp_merge_west_indies_desc:0 "古巴、伊斯帕尼奥拉岛与加勒比海岛链曾隶属于同一批殖民强权。古巴、海地与多米尼加共和国的统一，将实现西印度联邦的百年梦想。"
  pfp_merge_west_indies_not_yet_formed_tt:0 "西印度群岛尚未形成。\n"
  pfp_merge_west_indies_puppets_ready_tt:0 "§Y古巴§!、§Y多米尼加共和国§!、§Y海地§!:\n"
  pfp_merge_west_indies_effect_form:0 "§Y西印度群岛§!由合并§Y古巴§!、§Y多米尼加共和国§!、§Y海地§!而形成。\n"
  pfp_merge_west_indies_effect_annex:0 "§Y西印度群岛§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_west_indies_effect_cores:0 "§Y西印度群岛§!获得了被吞并傀儡的核心与主张。\n"
  pfp_merge_west_indies_is_formed_tt:0 "西印度群岛已形成。\n"
  pfp_merge_west_indies_jamaica:0 "将牙买加并入西印度群岛"
  pfp_merge_west_indies_jamaica_desc:0 "牙买加曾是英属加勒比的王冠明珠——这座甘蔗种植园与蓝山的岛屿，其抵抗的节奏塑造了大西洋世界。将其并入西印度群岛，使最大的英语岛屿加入了联邦。"
  pfp_merge_west_indies_jamaica_not_yet_absorbed_tt:0 "牙买加尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_jamaica_effect_annex:0 "§Y西印度群岛§!吞并§Y牙买加§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_bahamas:0 "将巴哈马并入西印度群岛"
  pfp_merge_west_indies_bahamas_desc:0 "巴哈马群岛守护着加勒比海的北方门户，其浅水滩和岛链从佛罗里达延伸至伊斯帕尼奥拉岛。将其并入，使西印度群岛的影响力延伸至美洲大陆的门槛。"
  pfp_merge_west_indies_bahamas_not_yet_absorbed_tt:0 "巴哈马尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_bahamas_effect_annex:0 "§Y西印度群岛§!吞并§Y巴哈马§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_puerto_rico:0 "将波多黎各并入西印度群岛"
  pfp_merge_west_indies_puerto_rico_desc:0 "波多黎各位于加勒比海的东北角——这座西班牙语岛屿的战略位置控制着莫纳海峡。将其纳入西印度群岛的旗帜之下，使大安的列斯群岛的弧线得以完整。"
  pfp_merge_west_indies_puerto_rico_not_yet_absorbed_tt:0 "波多黎各尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_puerto_rico_effect_annex:0 "§Y西印度群岛§!吞并§Y波多黎各§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_french_antilles:0 "将法属安的列斯并入西印度群岛"
  pfp_merge_west_indies_french_antilles_desc:0 "马提尼克和瓜德罗普是法国加勒比帝国的最后遗存，其克里奥尔文化融合了非洲、欧洲和美洲原住民的根源。将其并入西印度群岛，吸收了小安的列斯群岛最后的法国势力。"
  pfp_merge_west_indies_french_antilles_not_yet_absorbed_tt:0 "法属安的列斯尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_french_antilles_effect_annex:0 "§Y西印度群岛§!吞并§Y法属安的列斯§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_british_antilles:0 "将英属安的列斯并入西印度群岛"
  pfp_merge_west_indies_british_antilles_desc:0 "向风群岛和背风群岛构成一条分散的英国属地链，沿加勒比海东缘延伸。将其吸收，使小安的列斯群岛在单一行政管辖下实现整合。"
  pfp_merge_west_indies_british_antilles_not_yet_absorbed_tt:0 "英属安的列斯尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_british_antilles_effect_annex:0 "§Y西印度群岛§!吞并§Y英属安的列斯§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_dutch_antilles:0 "将荷属安的列斯并入西印度群岛"
  pfp_merge_west_indies_dutch_antilles_desc:0 "库拉索及其位于委内瑞拉海岸外的姐妹岛屿，是加勒比海荷兰商业帝国的残存，其石油炼厂和自由港使其成为该地区最富裕的岛屿之一。将其吸收，终结了南加勒比海最后的欧洲殖民存在。"
  pfp_merge_west_indies_dutch_antilles_not_yet_absorbed_tt:0 "荷属安的列斯尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_dutch_antilles_effect_annex:0 "§Y西印度群岛§!吞并§Y荷属安的列斯§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_trinidad:0 "将特立尼达和多巴哥并入西印度群岛"
  pfp_merge_west_indies_trinidad_desc:0 "特立尼达就位于委内瑞拉海岸附近，是加勒比海岛链最南端的岛屿，也是最繁荣的岛屿之一——其油田和充满活力的西班牙港使其成为珍贵的属地。将其并入西印度群岛，巩固了联邦的南翼。"
  pfp_merge_west_indies_trinidad_not_yet_absorbed_tt:0 "特立尼达和多巴哥尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_trinidad_effect_annex:0 "§Y西印度群岛§!吞并§Y特立尼达和多巴哥§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_bermuda:0 "将百慕大并入西印度群岛"
  pfp_merge_west_indies_bermuda_desc:0 "百慕大位于主要加勒比海岛链的遥远北方，是大西洋中部的英国属地，其粉色沙滩和战略性海军锚地使其成为英国在西大西洋势力的基石。将其吸收，使西印度群岛的影响力延伸至广阔的大洋。"
  pfp_merge_west_indies_bermuda_not_yet_absorbed_tt:0 "百慕大尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_bermuda_effect_annex:0 "§Y西印度群岛§!吞并§Y百慕大§!，获得其核心及可核心化领土。\n"
  pfp_merge_west_indies_belize:0 "将伯利兹并入西印度群岛"
  pfp_merge_west_indies_belize_desc:0 "英属洪都拉斯是中美洲大陆上一个小小的英语飞地，其与英属加勒比的文化纽带使其自然成为并入西印度群岛而非加入西班牙语邻国的候选。其合并将西加勒比海的最后一块英国领土与联邦统一。"
  pfp_merge_west_indies_belize_not_yet_absorbed_tt:0 "伯利兹尚未被西印度群岛吸收。\n"
  pfp_merge_west_indies_belize_effect_annex:0 "§Y西印度群岛§!吞并§Y伯利兹§!，获得其核心及可核心化领土。\n"
  pfp_merge_transcaucasia:0 "形成外高加索"
  pfp_merge_transcaucasia_desc:0 "格鲁吉亚、亚美尼亚和阿塞拜疆居于欧亚交汇之处，高加索山脉把它们的命运紧密相连。巴库的石油、奇亚图拉的锤、第比利斯的丝绸—超高加索共和国彼此联合远比分居富裕。作为超高加索統一，它们可以抗衡两侧大国的压力，按自己的条件开创未来。"
  pfp_merge_transcaucasia_not_yet_formed_tt:0 "外高加索尚未形成。\n"
  pfp_merge_transcaucasia_puppets_ready_tt:0 "§Y格鲁吉亚§!, §Y亚美尼亚§!, §Y阿塞拜疆§!:\n"
  pfp_merge_transcaucasia_effect_form:0 "§Y外高加索§!由合并§Y格鲁吉亚§!、§Y亚美尼亚§!、§Y阿塞拜疆§!而形成。\n"
  pfp_merge_transcaucasia_effect_annex:0 "§Y外高加索§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_transcaucasia_effect_cores:0 "§Y外高加索§!获得所有合并附庸的核心及可核心化领土。\n"
  pfp_merge_turkestan:0 "形成突厥斯坦"
  pfp_merge_turkestan_desc:0 "中亚草原和沙漠中，五个共和国共享共同的突厥传承、相同的大河和相同的殖民遗产。哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、乌兹别克斯坦和土库曼斯坦被苏维埃行政命令划分；作为土耶斯坦統一将恢复地图将其打破的文化与地理凝聚力。"
  pfp_merge_turkestan_not_yet_formed_tt:0 "突厥斯坦尚未形成。\n"
  pfp_merge_turkestan_puppets_ready_tt:0 "§Y哈萨克斯坦§!, §Y吉尔吉斯斯坦§!, §Y塔吉克斯坦§!, §Y乌兹别克斯坦§!, §Y土库曼斯坦§!:\n"
  pfp_merge_turkestan_effect_form:0 "§Y突厥斯坦§!由合并§Y哈萨克斯坦§!、§Y吉尔吉斯斯坦§!、§Y塔吉克斯坦§!、§Y乌兹别克斯坦§!、§Y土库曼斯坦§!而形成。\n"
  pfp_merge_turkestan_effect_annex:0 "§Y突厥斯坦§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_turkestan_effect_cores:0 "§Y突厥斯坦§!获得所有合并附庸的核心及可核心化领土。\n"
  pfp_merge_indochina:0 "形成印度支那"
  pfp_merge_indochina_desc:0 "越南、老挝和柬埔寨在法国管辖下以印度支那的形式联合——一个由河内和西贡管辖的殖民地单元。这些土地上的河流、贸易路线、共同的佛教传统以及数世纪交织的历史都呼唯统一。合并为印度支那，它们可以与任何试图利用其分裂的势力第一声拉开。"
  pfp_merge_indochina_not_yet_formed_tt:0 "印度支那尚未形成。\n"
  pfp_merge_indochina_puppets_ready_tt:0 "§Y越南§!, §Y老挝§!, §Y柬埔寨§!:\n"
  pfp_merge_indochina_effect_form:0 "§Y印度支那§!由合并§Y越南§!、§Y老挝§!、§Y柬埔寨§!而形成。\n"
  pfp_merge_indochina_effect_annex:0 "§Y印度支那§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_indochina_effect_cores:0 "§Y印度支那§!获得所有合并附庸的核心及可核心化领土。\n"
  pfp_merge_indochina_is_formed_tt:0 "印度支那已形成。\n"
  pfp_merge_indochina_siam:0 "吸收暖罗"
  pfp_merge_indochina_siam_desc:0 "暖罗与法属印度支那相比独立一隔——从未被殖民化，从未被打妇。但如今四面都是印度支那行政管辖下的统一领土，它已无法继续作为独立局面的孤岛。将暖罗纳入更大印度支那联盟的时机已经到来。"
  pfp_merge_indochina_siam_not_yet_absorbed_tt:0 "暹罗尚未被印度支那吸收。\n"
  pfp_merge_indochina_siam_effect_annex:0 "§Y印度支那§!吞并§Y暹罗§!，获得其核心及可核心化领土。\n"
  pfp_merge_indochina_burma:0 "吸收缅甸"
  pfp_merge_indochina_burma_desc:0 "缅甸长期在英国管辖下与印度相连，但其地理位置将它牢固地置于印度支那范围之内。伊洛瓦底游魏、与邻半共享的佛教信仰、头养该地区的水稻田—缅甸属于印度支那世界。其并入完成大陆的统一。"
  pfp_merge_indochina_burma_not_yet_absorbed_tt:0 "缅甸尚未被印度支那吸收。\n"
  pfp_merge_indochina_burma_effect_annex:0 "§Y印度支那§!吞并§Y缅甸§!，获得其核心及可核心化领土。\n"
  pfp_merge_indochina_malaysia:0 "吸收马来亚"
  pfp_merge_indochina_malaysia_desc:0 "马来半岛连接大陆印度支那与太平洋岛屿世界。马来西亚的橡胶庄园、锡矿和占据马六甲海峡的战略要地，使它成为任何有大志的印度支那联盟不可或缺的补充。"
  pfp_merge_indochina_malaysia_not_yet_absorbed_tt:0 "马来西亚尚未被印度支那吸收。\n"
  pfp_merge_indochina_malaysia_effect_annex:0 "§Y印度支那§!吞并§Y马来西亚§!，获得其核心及可核心化领土。\n"
  pfp_merge_indochina_singapore:0 "吸收新加坡"
  pfp_merge_indochina_singapore_desc:0 "新加坡位于马来半岛南端，控制着半个世界的贸易必须经过的狭窄。其港口是地球上最繁忙的港口之一，其位置属最重要的战略要地之一。并入印度支那后，新加坡将成为统一东南亚国家的海上门户。"
  pfp_merge_indochina_singapore_not_yet_absorbed_tt:0 "新加坡尚未被印度支那吸收。\n"
  pfp_merge_indochina_singapore_effect_annex:0 "§Y印度支那§!吞并§Y新加坡§!，获得其核心及可核心化领土。\n"
  pfp_merge_australasia:0 "形成澳大拉西亚"
  pfp_merge_australasia_desc:0 "澳大利亚、新西兰和巴布亚新几内亚构成南太平洋的定海石——三个英属领土，其近邻和共同遭遇使統一成为自然吐往。贿阔的大陆、地球尽头的岛屿、热带半岛共同揭指一片海洋。作为澳大拉西亚统一，它们可以向太平洋投射力量，展拓共同的海上未来。"
  pfp_merge_australasia_not_yet_formed_tt:0 "澳大拉西亚尚未形成。\n"
  pfp_merge_australasia_puppets_ready_tt:0 "§Y澳大利亚§!, §Y新西兰§!, §Y巴布亚新几内亚§!:\n"
  pfp_merge_australasia_effect_form:0 "§Y澳大拉西亚§!由合并§Y澳大利亚§!、§Y新西兰§!、§Y巴布亚新几内亚§!而形成。\n"
  pfp_merge_australasia_effect_annex:0 "§Y澳大拉西亚§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_australasia_effect_cores:0 "§Y澳大拉西亚§!获得所有合并附庸的核心及可核心化领土。\n"
  pfp_merge_australasia_is_formed_tt:0 "澳大拉西亚已形成。\n"
  pfp_merge_australasia_solomon_islands:0 "吸收所罗门群岛"
  pfp_merge_australasia_solomon_islands_desc:0 "所罗门群岛岛链自巴布亚新几内亚向东北延伸至太平洋心脏。这些岛屿长期属于英属太平洋世界，其命运因近邻和殖民管治而与澳大利亚相连。并入澳大拉西亚将把太平洋西南部统一在同一旗帜之下。"
  pfp_merge_australasia_solomon_islands_not_yet_absorbed_tt:0 "所罗门群岛尚未被澳大拉西亚吸收。\n"
  pfp_merge_australasia_solomon_islands_effect_annex:0 "§Y澳大拉西亚§!吞并§Y所罗门群岛§!，获得其核心及可核心化领土。\n"
  pfp_merge_australasia_bougainville:0 "吸收布干维尔"
  pfp_merge_australasia_bougainville_desc:0 "布干维尔岛地理上较近所罗门群岛，但被置于澳大利亚对新几内亚的委任统治之下。它在俧斯麦群岛的位置和铜资源使其并入澳大拉西亚成为地区权力的自然延伸。"
  pfp_merge_australasia_bougainville_not_yet_absorbed_tt:0 "布干维尔尚未被澳大拉西亚吸收。\n"
  pfp_merge_australasia_bougainville_effect_annex:0 "§Y澳大拉西亚§!吞并§Y布干维尔§!，获得其核心及可核心化领土。\n"
  pfp_merge_australasia_new_caledonia:0 "吸收新喀里多尼亚"
  pfp_merge_australasia_new_caledonia_desc:0 "新喀里多尼亚位于珊瑚海南端，其鈥资源是地球上最丰富的之一。尽管历史上是法属领土，其地理位置完全属于澳大拉西亚范围。并入将为太平洋联盟增添战略纵深和矿产财富。"
  pfp_merge_australasia_new_caledonia_not_yet_absorbed_tt:0 "新喀里多尼亚尚未被澳大拉西亚吸收。\n"
  pfp_merge_australasia_new_caledonia_effect_annex:0 "§Y澳大拉西亚§!吞并§Y新喀里多尼亚§!，获得其核心及可核心化领土。\n"
  pfp_merge_australasia_vanuatu:0 "吸收瓦努阿图"
  pfp_merge_australasia_vanuatu_desc:0 "新赫布里庳岛被置于一种奇特的英法共管制度之下——一种由两个强权同时统治的联合保护领。文莱平并入澳大拉西亚结束了这一殖民地异常，将该群岛带入地理始终所谋划的太平洋联盟。"
  pfp_merge_australasia_vanuatu_not_yet_absorbed_tt:0 "瓦努阿图尚未被澳大拉西亚吸收。\n"
  pfp_merge_australasia_vanuatu_effect_annex:0 "§Y澳大拉西亚§!吞并§Y瓦努阿图§!，获得其核心及可核心化领土。\n"
  pfp_merge_levant:0 "形成黎凡特"
  pfp_merge_levant_desc:0 "巴勒斯坦、约旦、黎巴嫩和叙利亚分享的不止是边界——它们共享的是文明本身的发源地肘弯沃月地带。地中海岁山广勳至叙利亚沙漠，这片土地千年来在帝国间辗转流转。在赎北的统一治理下，它们终于可以定尺自己的命运。"
  pfp_merge_levant_not_yet_formed_tt:0 "黎凡特尚未形成。\n"
  pfp_merge_levant_puppets_ready_tt:0 "§Y约旦§!, §Y巴勒斯坦§!, §Y黎巴嫩§!, §Y叙利亚§!:\n"
  pfp_merge_levant_effect_form:0 "§Y黎凡特§!由合并§Y约旦§!、§Y巴勒斯坦§!、§Y黎巴嫩§!、§Y叙利亚§!而形成。\n"
  pfp_merge_levant_effect_annex:0 "§Y黎凡特§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_levant_effect_cores:0 "§Y黎凡特§!获得所有合并附庸的核心及可核心化领土。\n"
  pfp_merge_mittelafrika:0 "形成中非"
  pfp_merge_mittelafrika_desc:0 "德国对统一的非洲中部领地的殖民地构想在一战中从未实现。但秘乾仍在：西部的喀麦隆、东部的坦噶尼喀、南部的西南非洲。将这些领土并入我们的管辖，一个贯通海洋的非洲大陆帝国之梦或许就此实现。"
  pfp_merge_mittelafrika_not_yet_formed_tt:0 "米特拉夫利卡尚未形成。\n"
  pfp_merge_mittelafrika_puppets_ready_tt:0 "§Y喀麦隆§!, §Y坦噶尼喀§!, §Y西南非洲§!:\n"
  pfp_merge_mittelafrika_effect_form:0 "§Y中非§!由合并§Y喀麦隆§!、§Y坦噶尼喀§!、§Y西南非洲§!而形成。\n"
  pfp_merge_mittelafrika_effect_annex:0 "§Y中非§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_mittelafrika_effect_cores:0 "§Y中非§!获得所有合并附庸的核心及可核心化领土。\n"
  pfp_merge_mittelafrika_is_formed_tt:0 "中非已形成。\n"
  pfp_merge_mittelafrika_togo:0 "吸收多哥"
  pfp_merge_mittelafrika_togo_desc:0 "多哥在一战前是德国保护领，战争结束时被划分于法英之间。作为前德国殖民地，它在新的非州中部内的位置顺理成章。并入它完成了非洲中部帝国的西羼。"
  pfp_merge_mittelafrika_togo_not_yet_absorbed_tt:0 "§Y多哥§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_togo_effect_annex:0 "§Y中非§!吸收§Y多哥§!（Q40），获得其领土和军队。\n"
  pfp_merge_mittelafrika_ruanda_urundi:0 "吸收卢旺达-乌隆地"
  pfp_merge_mittelafrika_ruanda_urundi_desc:0 "卢旺达—布隆迪自一战以来就处于比利时委任统治之下，处于坦噶尼喀和刚果之间的非洲心脏。并入非洲中部将弥合德国东非和中非领地之间的缺口。"
  pfp_merge_mittelafrika_ruanda_urundi_not_yet_absorbed_tt:0 "§Y卢旺达-乌隆地§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_ruanda_urundi_effect_annex:0 "§Y中非§!吸收§Y卢旺达-乌隆地§!（Q66），获得其领土和军队。\n"
  pfp_merge_mittelafrika_gabon:0 "吸收加蓬"
  pfp_merge_mittelafrika_gabon_desc:0 "加蓬的赤道雨林和奥尔河流域使其成为青州上最富有的领土之一。前法属领土，其在大西洋沿岸的战略位置使其成为非洲中部西进口不可或缺的重要着拍点。"
  pfp_merge_mittelafrika_gabon_not_yet_absorbed_tt:0 "§Y加蓬§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_gabon_effect_annex:0 "§Y中非§!吸收§Y加蓬§!（Q38），获得其领土和军队。\n"
  pfp_merge_mittelafrika_congo_brazzaville:0 "吸收刚果-布拉柴维尔"
  pfp_merge_mittelafrika_congo_brazzaville_desc:0 "法属刚果位于刚果河北岸，与比利时刚果隔河相望。它的森林和河流为非洲心脏输送养分，并入非洲中部将巩固德国在刚果流域的影响力。"
  pfp_merge_mittelafrika_congo_brazzaville_not_yet_absorbed_tt:0 "§Y刚果-布拉柴维尔§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_congo_brazzaville_effect_annex:0 "§Y中非§!吸收§Y刚果-布拉柴维尔§!（Q39），获得其领土和军队。\n"
  pfp_merge_mittelafrika_northern_rhodesia:0 "吸收北罗得西亚"
  pfp_merge_mittelafrika_northern_rhodesia_desc:0 "北罗德西亚的铜带是非洲最丰富的矿产之一。这个连接开普至开罗路线的英属保护领并入非洲中部将切断帝国动脉，为中非州带来广阔的资源基地。"
  pfp_merge_mittelafrika_northern_rhodesia_not_yet_absorbed_tt:0 "§Y北罗得西亚§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_northern_rhodesia_effect_annex:0 "§Y中非§!吸收§Y北罗得西亚§!（Q63），获得其领土和军队。\n"
  pfp_merge_mittelafrika_southern_rhodesia:0 "吸收南罗得西亚"
  pfp_merge_mittelafrika_southern_rhodesia_desc:0 "南罗德西亚由塞西尔罗德斯领导的英国殖民开拓，守护着林波波河与赞比西河之间的进途。其肥沃的高地和日劢增长的殖民人口，使其成为正在扩张的非洲中部并入的富贵战利品。"
  pfp_merge_mittelafrika_southern_rhodesia_not_yet_absorbed_tt:0 "§Y南罗得西亚§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_southern_rhodesia_effect_annex:0 "§Y中非§!吸收§Y南罗得西亚§!（Q69），获得其领土和军队。\n"
  pfp_merge_mittelafrika_angola:0 "吸收安哥拉"
  pfp_merge_mittelafrika_angola_desc:0 "安哥拉从大西洋沿岸深入非洲内陆，其高原富含钒石、石油和肥沃土地。安哥拉是数世纪以来的葡萨牙领土，并入非洲中部将为中非州带来至关重要的大西洋海岸线。"
  pfp_merge_mittelafrika_angola_not_yet_absorbed_tt:0 "§Y安哥拉§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_angola_effect_annex:0 "§Y中非§!吸收§Y安哥拉§!（Q67），获得其领土和军队。\n"
  pfp_merge_mittelafrika_mozambique:0 "吸收莫桑比克"
  pfp_merge_mittelafrika_mozambique_desc:0 "莫桑比克漫长的印度洋沿岸和洲伦素马克斯港控制着封闭的南非内陆的海上通道。并入非洲中部将使中非帝国的东海岸线延伸到这里，完共山8天帝国的东部海岸线。"
  pfp_merge_mittelafrika_mozambique_not_yet_absorbed_tt:0 "§Y莫桑比克§!尚未被§Y中非§!吸收。\n"
  pfp_merge_mittelafrika_mozambique_effect_annex:0 "§Y中非§!吸收§Y莫桑比克§!（Q68），获得其领土和军队。\n"




