  pfp_merge_eastern_russia_effect_cores:0 "§Y东俄罗斯§!获得被吞并傀儡政权的核心领土和主张。\n"
  pfp_merge_eastern_russia_effect_form:0 "§Y乌拉尔§!由合并§Y乌拉尔§!、§Y西伯利亚§!、§Y远东俄罗斯§!而形成。\n"
