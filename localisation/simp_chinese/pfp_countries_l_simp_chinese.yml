  pfp_merge_germany_effect_annex:0 "§Y德国§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_germany_effect_cores:0 "§Y德国§!获得被吞并傀儡政权的核心领土和主张。\n"
