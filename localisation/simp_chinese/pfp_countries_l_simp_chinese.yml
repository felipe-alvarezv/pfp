  pfp_merge_arabia:0 "形成阿拉伯"
  pfp_merge_arabia_desc:0 "从内志的沙漠到鸡曼的海岸，阿拉伯半岛长期以来是信仰与商业的交汇之地。麦加和麦地那的城市支撑着地球上最古老的文明；佐法尔的乳香之路曾经定义了古代世界的贸易。作为阿拉伯统一，这些王国可以收回它们在文明中心的地位。"
  pfp_merge_arabia_not_yet_formed_tt:0 "阿拉伯尚未形成。\n"
  pfp_merge_arabia_puppets_ready_tt:0 "§Y沙特阿拉伯§!, §Y也门§!, §Y阿曼§!:\n"
  pfp_merge_arabia_effect_form:0 "§Y阿拉伯§!由合并§Y沙特阿拉伯§!、§Y也门§!、§Y阿曼§!而形成。\n"
  pfp_merge_arabia_effect_annex:0 "§Y阿拉伯§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_arabia_effect_cores:0 "§Y阿拉伯§!获得被并属傀尸的核心和声索。\n"

  pfp_merge_korea:0 "形成朝鲜"
  pfp_merge_korea_desc:0 "战争与意识形态将朝鲜半岛一分为二，这片土地长期饱受外国干涉与内部纷争之苦。从南方的稻田到北方的山脉，朝鲜民族共享同一种语言、同一种文化和同一段历史。如今，是时候抛开当下的分裂，重拾易日的统一了。"
  pfp_merge_korea_not_yet_formed_tt:0 "朝鲜尚未形成。\n"
  pfp_merge_korea_puppets_ready_tt:0 "§Y北朝鲜§!与§Y韩国§!:\n"
  pfp_merge_korea_effect_form:0 "§Y朝鲜§!由合并§Y北朝鲜§!、§Y韩国§!而形成。\n"
  pfp_merge_korea_effect_annex:0 "§Y朝鲜§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_korea_effect_cores:0 "§Y朝鲜§!获得被吸并傀属国的核心及其领土主张。\n"

  pfp_merge_guiana:0 "形成圭亚那"
  pfp_merge_guiana_desc:0 "三大帝国的三个殖民地，圭亚那各地共享相同的地理、相同的气候和相同的命运。从内陆丛林到注入大西洋的河流，这些领土彼此之间的共同点远多于它们与那些统治它们的遥远首都。一旦统一为圭亚那，它们就能在共居的土地上塑造全新的身份认同。"
  pfp_merge_guiana_not_yet_formed_tt:0 "圭亚那尚未形成。\n"
  pfp_merge_guiana_puppets_ready_tt:0 "§Y圭亚那§!、§Y苏里南§!与§Y法属圭亚那§!:\n"
  pfp_merge_guiana_effect_form:0 "§Y圭亚那§!由合并§Y圭亚那§!、§Y苏里南§!、§Y法属圭亚那§!而形成。\n"
  pfp_merge_guiana_effect_annex:0 "§Y圭亚那§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_guiana_effect_cores:0 "§Y圭亚那§!获得被吸并傀属国的核心及其领土主张。\n"

