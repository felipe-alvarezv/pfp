  # United States
  pfp_merge_western_usa:0 "形成美国西部"
  pfp_merge_western_usa_desc:0 "太平洋海岸和落基山脉始终是美国实验野性而未被驯服的西部边缘——从加利福尼亚阳光灼烧的海岸，到喀斯喀特山脉白雪覆盖的山峰。在大陆能够重新统一之前，西部必须先以一个声音说话。"
  pfp_merge_western_usa_not_yet_formed_tt:0 "美国西部尚未形成。\n"
  pfp_merge_western_usa_effect_form:0 "§Y美国西部§!由合并§Y美国太平洋§!、§Y美国落基山脉§!而形成。\n"
  pfp_merge_western_usa_effect_annex:0 "§Y美国西部§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_western_usa_effect_cores:0 "§Y美国西部§!获得被吞并傀儡的核心及领土主张。\n"

  pfp_merge_usa:0 "形成美国"
  pfp_merge_usa_desc:0 "从东北部的工厂和港口，到南部的田野和城市，再到中西部的伟大工业心脏——这三个地区曾是世界上最强大国家的支柱。联邦曾以巨大代价保存下来；它可以再次重建。"
  pfp_merge_usa_not_yet_formed_tt:0 "美国东部尚未形成。\n"
  pfp_merge_usa_effect_form:0 "§Y东部美国§!由合并§Y东北美国§!、§Y中西部美利坚§!、§Y南美利坚§!而形成。\n"
  pfp_merge_usa_effect_annex:0 "§Y东部美国§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_usa_effect_cores:0 "§Y东部美国§!获得被吞并傀儡政权的核心领土和主张。\n"

  pfp_merge_western_usa_is_formed_tt:0 "美国西部已形成。\n"
  pfp_merge_eastern_usa_is_formed_tt:0 "美国东部已形成。\n"

  pfp_merge_united_states:0 "形成美利坚合众国"
  pfp_merge_united_states_desc:0 "从西南部灰烂的沙漠到东北部的工业走廊，从中西部金色的田野到深南的沼泽——美国从来不只是一个地区，而是所有地区的总和。东部和西部各自证明了各自的力量。现在，他们必须证明自己是一个统一的国家。"
  pfp_merge_united_states_not_yet_formed_tt:0 "美利坚合众国尚未形成。\n"
  pfp_merge_united_states_effect_form:0 "§Y美利坚合众国§!由合并§Y美国西部§!、§Y东部美国§!而形成。\n"
  pfp_merge_united_states_effect_annex:0 "§Y美利坚合众国§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_united_states_effect_cores:0 "§Y美利坚合众国§!获得被吞并傀儡的核心及领土主张。\n"



  # China
  pfp_merge_china:0 "形成中国"
  pfp_merge_china_desc:0 "两千余年间，中原各省听命于同一朝廷，以天命与历代王朝的儒家秩序为纽带。每一省都承载着统一中国的记忆——分裂是一场灾难，而非命运。"
  pfp_merge_china_not_yet_formed_tt:0 "中国尚未形成。\n"
  pfp_merge_china_effect_form:0 "§Y中国§!由合并§Y直隶§!、§Y山东§!、§Y河南§!、§Y山西§!、§Y两江§!、§Y闽浙§!、§Y湖广§!、§Y两广§!、§Y云贵§!、§Y四川§!而形成。\n"
  pfp_merge_china_effect_annex:0 "§Y中国§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_china_effect_cores:0 "§Y中国§!获得被吞并傀儡政权的核心领土和主张。\n"

  pfp_merge_china_manchuria:0 "将满洲并入中国"
  pfp_merge_china_manchuria_desc:0 "清朝的发祥之地，也是中国东北的工业引擎，已发展成为重工业与铁路的重镇。它的煤炭和铁矿为现代世界提供了动力；如今将为中国的复兴提供动力。"
  pfp_merge_china_is_formed_tt:0 "中国已形成。\n"
  pfp_merge_china_manchuria_not_yet_absorbed_tt:0 "满洲尚未并入中国。\n"
  pfp_merge_china_manchuria_effect_annex:0 "§Y中国§!兼并§Y满洲§!，获得其核心及可核心化领土。\n"

  pfp_merge_china_inner_mongolia:0 "将内蒙古并入中国"
  pfp_merge_china_inner_mongolia_desc:0 "中国北方边疆的草原自匈奴时代起便标志着农耕地与游牧草原的分界——这条边界争议如此激烈，以至于催生了长城。将其纳入可将中国的权威延伸至蒙古高原南缘，确保通往北京的通道。"
  pfp_merge_china_inner_mongolia_not_yet_absorbed_tt:0 "内蒙古尚未并入中国。\n"
  pfp_merge_china_inner_mongolia_effect_annex:0 "§Y中国§!兼并§Y内蒙古§!，获得其核心及可核心化领土。\n"

  pfp_merge_china_shaan_gan:0 "将陕甘并入中国"
  pfp_merge_china_shaan_gan_desc:0 "这片土地怀抱黄河大湾和古都长安——今西安——十四个皇朝曾在此丝绸之路的枢纽建立朝廷。三千年来的中国心脏地带；将其收复可完成我们对西北的控制。"
  pfp_merge_china_shaan_gan_not_yet_absorbed_tt:0 "陕甘尚未并入中国。\n"
  pfp_merge_china_shaan_gan_effect_annex:0 "§Y中国§!兼并§Y陕甘§!，获得其核心及可核心化领土。\n"

  pfp_merge_china_qinghai:0 "将青海并入中国"
  pfp_merge_china_qinghai_desc:0 "位于青藏高原东北缘，这片土地孕育着黄河和长江的源头——中国文明的两条大动脉。将其纳入可巩固中国西部腹地，封闭通往西藏的地理门户。"
  pfp_merge_china_qinghai_not_yet_absorbed_tt:0 "青海尚未并入中国。\n"
  pfp_merge_china_qinghai_effect_annex:0 "§Y中国§!兼并§Y青海§!，获得其核心及可核心化领土。\n"

  pfp_merge_china_taiwan:0 "将台湾并入中国"
  pfp_merge_china_taiwan_desc:0 "这座岛屿隔着一道晴天可见大陆的海峡。它几经易手，却始终与大陆的命运紧密相连；是时候将它重新纳入了。"
  pfp_merge_china_taiwan_not_yet_absorbed_tt:0 "台湾尚未并入中国。\n"
  pfp_merge_china_taiwan_effect_annex:0 "§Y中国§!兼并§Y台湾§!，获得其核心及可核心化领土。\n"

  pfp_merge_china_east_turkestan:0 "将东突厥斯坦并入中国"
  pfp_merge_china_east_turkestan_desc:0 "遥远西部的沙漠盆地和绿洲城市，曾是古丝绸之路将丝绸西传、将思想东输之处。其广阔的草原和矿藏资源使其具有不可或缺的战略价值；将其纳入可完成中国的中亚边疆。"
  pfp_merge_china_east_turkestan_not_yet_absorbed_tt:0 "东突厥斯坦尚未并入中国。\n"
  pfp_merge_china_east_turkestan_requires_border_tt:0 "西藏、青海或陕甘必须首先并入中国。\n"
  pfp_merge_china_east_turkestan_effect_annex:0 "§Y中国§!兼并§Y东突厥斯坦§!，获得其核心及可核心化领土。\n"

  pfp_merge_china_tibet:0 "将西藏并入中国"
  pfp_merge_china_tibet_desc:0 "世界屋脊——一片高原，高到军队穿越时感受到海拔之前便先感受到。从其冰川奔涌而出的河流灌溉着亚洲半壁。将其置于统一控制之下可确保我们整个西南边疆。"
  pfp_merge_china_tibet_not_yet_absorbed_tt:0 "西藏尚未并入中国。\n"
  pfp_merge_china_tibet_effect_annex:0 "§Y中国§!兼并§Y西藏§!，获得其核心及可核心化领土。\n"

  # East Africa
  pfp_merge_east_africa:0 "形成东非"
  pfp_merge_east_africa_desc:0 "从苏丹和乌干达的尼罗河源头到索马里海岸，从唯一抵抗了殖民化的埃塞俄比亚高原到坦噶尼喀的广袤草原，东非涵盖了非洲东部走廊的全部范围。这些土地共享尼罗河流域的水域、印度洋的季风贸易，以及由相同的高地王国、沿海城邦和裂谷文明所塑造的历史。被殖民地边界分割成碎片，这些土地的统一将锻造出整个非洲东部的主导力量。"
  pfp_merge_east_africa_not_yet_formed_tt:0 "东非尚未形成。\n"
  pfp_merge_east_africa_effect_form:0 "§Y东非§!由合并§Y埃塞俄比亚§!、§Y厄立特里亚§!、§Y吉布提§!、§Y索马里兰§!、§Y索马里§!、§Y肯尼亚§!、§Y乌干达§!、§Y坦噶尼喀§!、§Y苏丹§!而形成。\n"
  pfp_merge_east_africa_effect_annex:0 "§Y东非§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_east_africa_effect_cores:0 "§Y东非§!获得被吞并傀儡政权的核心领土和主张。\n"
  pfp_merge_east_africa_is_formed_tt:0 "东非已形成。\n"














  pfp_merge_east_africa_ruanda_urundi:0 "将卢旺达-布隆迪并入东非"
  pfp_merge_east_africa_ruanda_urundi_desc:0 "藏于刚果盆地上方的高地之中，这是非洲人口密度最高的地区之一——面积不大，但地理位置重要，夹在大湖与东非大裂谷断崖之间。将其纳入可填补我们中非边疆的空缺。"
  pfp_merge_east_africa_ruanda_urundi_not_yet_absorbed_tt:0 "卢旺达-布隆迪尚未并入东非。\n"
  pfp_merge_east_africa_ruanda_urundi_effect_annex:0 "§Y东非§!兼并§Y卢旺达-布隆迪§!，获得其核心及可核心化领土。\n"





  pfp_merge_north_africa:0 "形成北非"
  pfp_merge_north_africa_desc:0 "从摩洛哥的阿特拉斯山脉到尼罗河岸，北非海岸四千年来一直是地中海文明的十字路口。曾经在罗马和伟大的伊斯兰哈里发国统治下实现统一，马格里布与尼罗河谷共享着一份殖民边界长期分割的共同遗产。他们的统一将铸就一股能够重塑整个地中海世界的力量。"
  pfp_merge_north_africa_not_yet_formed_tt:0 "北非尚未形成。\n"
  pfp_merge_north_africa_effect_form:0 "§Y北非§!由合并§Y摩洛哥§!、§Y阿尔及利亚§!、§Y突尼斯§!、§Y利比亚§!、§Y埃及§!而形成。\n"
  pfp_merge_north_africa_effect_annex:0 "§Y北非§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_north_africa_effect_cores:0 "§Y北非§!获得被吞并傀儡的核心与主张。\n"
  pfp_merge_north_africa_is_formed_tt:0 "北非已形成。\n"











  pfp_merge_north_africa_western_sahara:0 "将西撒哈拉并入北非"
  pfp_merge_north_africa_western_sahara_desc:0 "这片广袤而人烟稀少的土地从大西洋沿岸延伸入撒哈拉，守护着马格里布的西部通道。将其并入，可稳固北非的大西洋侧翼，并确保南部沙漠边境的安全。"
  pfp_merge_north_africa_western_sahara_not_yet_absorbed_tt:0 "西撒哈拉尚未被并入北非。\n"
  pfp_merge_north_africa_western_sahara_effect_annex:0 "§Y北非§!吞并§Y西撒哈拉§!，获得其核心与可并入领土。\n"

  pfp_merge_north_africa_rif:0 "将里夫并入北非"
  pfp_merge_north_africa_rif_desc:0 "里夫山脉紧贴摩洛哥北部的地中海海岸，曾孕育出一个短暂而激烈的共和国，在1926年被镇压之前同时抵抗着西班牙与法国。那里的柏柏尔人部族从未完全接受外部的统治。将里夫并入北非，既是征服，也是和解。"
  pfp_merge_north_africa_rif_not_yet_absorbed_tt:0 "里夫尚未被并入北非。\n"
  pfp_merge_north_africa_rif_effect_annex:0 "§Y北非§!吞并§Y里夫§!，获得其核心与可并入领土。\n"

  pfp_merge_west_africa:0 "形成西非"
  pfp_merge_west_africa_desc:0 "从毛里塔尼亚和马里的撒哈拉边缘到黄金海岸和尼日尔三角洲的热带森林，西非涵盖了古代萨赫勒帝国的腹地。马里、桑海和加纳王国曾经主宰着连接地中海与撒哈拉以南非洲的跨撒哈拉贸易路线。被殖民地边界分割成十余个碎片，这些土地拥有深厚的文化、宗教和历史纽带。他们的统一将在非洲大西洋沿岸恢复一个大国地位。"
  pfp_merge_west_africa_not_yet_formed_tt:0 "西非尚未形成。\n"
  pfp_merge_west_africa_effect_form:0 "§Y西非§!由合并§Y尼日尔§!、§Y马里§!、§Y尼日利亚§!、§Y多哥§!、§Y达荷美§!、§Y黄金海岸§!、§Y上沃尔特§!、§Y象牙海岸§!、§Y几内亚§!、§Y塞拉利昂§!、§Y塞内加尔§!、§Y冈比亚§!、§Y毛里塔尼亚§!而形成。\n"
  pfp_merge_west_africa_effect_annex:0 "§Y西非§!吞并之前列出的所有附庸，获得其军队。\n"
  pfp_merge_west_africa_effect_cores:0 "所有核心及可并入领土均转移至§Y西非§!。\n"
  pfp_merge_west_africa_is_formed_tt:0 "西非已形成。\n"
  pfp_merge_west_africa_guinea_bissau:0 "将几内亚比绍并入西非"
  pfp_merge_west_africa_guinea_bissau_desc:0 "几内亚比绍是从塞内冈比亚腹地划出的一片狭长海岸与内陆，数百年来作为葡萄牙奴隶贸易的中转站，后沦为殖民时代被遗忘的边陲。其人民与每条边界另一侧的邻居共享语言和文化。将其并入西非将使新国家的海岸线趋于完整。"
  pfp_merge_west_africa_guinea_bissau_not_yet_absorbed_tt:0 "几内亚比绍尚未被并入西非。\n"
  pfp_merge_west_africa_guinea_bissau_effect_annex:0 "§Y西非§!吞并§Y几内亚比绍§!，获得其核心与可并入领土。\n"
  pfp_merge_west_africa_liberia:0 "将利比里亚并入西非"
  pfp_merge_west_africa_liberia_desc:0 "利比里亚于19世纪作为获释美国奴隶的庇护所而建立，在西非海岸各国中独树一帜——名义上独立，而殖民列强瓜分了该地区的其余部分。其美裔利比里亚统治阶层在欧洲列强之间维持着脆弱的主权。在正在形成的新秩序中，并入统一的西非将最终使其扎根于非洲的土壤之中。"
  pfp_merge_west_africa_liberia_not_yet_absorbed_tt:0 "利比里亚尚未被并入西非。\n"
  pfp_merge_west_africa_liberia_effect_annex:0 "§Y西非§!吞并§Y利比里亚§!，获得其核心与可并入领土。\n"
  pfp_merge_west_africa_cape_verde:0 "将佛得角并入西非"
  pfp_merge_west_africa_cape_verde_desc:0 "佛得角群岛散布于距塞内加尔海岸约五百公里的大西洋上，15世纪葡萄牙水手首次登陆时，这里还是无人定居的火山群岛。它随后成为大西洋贸易的重要中转站，将欧洲、非洲与美洲连接起来。尽管远离大陆，其并入西非将使新国家的影响力延伸至广阔的海域。"
  pfp_merge_west_africa_cape_verde_not_yet_absorbed_tt:0 "佛得角尚未被并入西非。\n"
  pfp_merge_west_africa_cape_verde_effect_annex:0 "§Y西非§!吞并§Y佛得角§!，获得其核心与可并入领土。\n"
  pfp_merge_eastern_russia:0 "形成Eastern Russia"
  pfp_merge_france:0 "形成法国"
  pfp_merge_france_alps:0 "将the French Alps并入France"
  pfp_merge_germany:0 "形成德国"
  pfp_merge_germany_konigsberg:0 "将Königsberg并入Germany"
  pfp_merge_great_britain:0 "形成英国"
  pfp_merge_great_britain_northern_ireland:0 "将Northern Ireland并入Great Britain"
  pfp_merge_iberia:0 "形成伊比利亚"
  pfp_merge_italy:0 "形成意大利"
  pfp_merge_italy_sardinia:0 "将Sardinia并入Italy"
  pfp_merge_japan:0 "形成日本"
  pfp_merge_russia:0 "形成Russia"
  pfp_merge_western_russia:0 "形成Western Russia"
  pfp_merge_western_russia_karelia:0 "将Karelia并入Western Russia"
  pfp_merge_western_russia_murmansk:0 "将Murmansk并入Western Russia"
  pfp_merge_western_russia_northern_caucasus:0 "将Northern Caucasus并入Western Russia"
  pfp_merge_illyria:0 "建立伊利里亚"
  pfp_merge_yugoslavia:0 "形成南斯拉夫"
  pfp_merge_yugoslavia_bosnia_herzegovina:0 "将波斯尼亚-黑塞哥维那并入南斯拉夫"
  pfp_merge_yugoslavia_croatia:0 "将克罗地亚并入南斯拉夫"
  pfp_merge_yugoslavia_macedonia:0 "将Macedonia并入Yugoslavia"
  pfp_merge_yugoslavia_slovenia:0 "将斯洛文尼亚并入南斯拉夫"
  pfp_merge_eastern_russia_desc:0 "乌拉尔山脉以东是世界上最大的连片陆地——从亚洲的山脊一直延伸至太平洋岸边的符拉迪沃斯托克。西伯利亚大铁路的建造是为了使这片广袤之地可以治理；如今它将这些领土联结于同一权威之下。"
  pfp_merge_france_alps_desc:0 "法国东南边疆的天然屏障——自汉尼拔率领大象越过以来，将罗讷河谷与波河平原分隔的山峰与关口便一直是争夺之地。将其纳入可完成法国的阿尔卑斯边界，封闭来自意大利方向的入口。"
  pfp_merge_france_desc:0 "自由、平等、博爱——共和国的理想不属于任何单一地区；它们属于整个法国。饱经两次大战洗礼的工业北部，与扎根于罗马高卢的温暖南部，是同一文明的两个半体。三色旗曾在两者上空飘扬；它将再次飘扬。"
  pfp_merge_germany_desc:0 "俾斯麦以铁和血锻造了德意志民族——要再次将其打碎则需要两场灾难性的战争。无论沿莱茵河、易北河还是旧霍亨索伦边界分裂，德意志土地共享同一语言、同一文化，以及可追溯至神圣罗马帝国的千年交织历史。"
  pfp_merge_germany_konigsberg_desc:0 "普鲁士古都——霍亨索伦家族在此加冕为王，伊曼努尔·康德一生未曾离开的城市。由条顿骑士团建于十三世纪，这座琥珀贸易的波罗的海要塞不属于任何其他国家，只属于德国。"
  pfp_merge_great_britain_desc:0 "共享一座岛屿的三个民族自《合并法令》起便由一顶王冠联结，然而它们之间的纽带比任何王室敕令都更为深厚。从威尔士南部的煤矿山谷，到克莱德河的造船厂，再到中部地区的工厂——这些民族共同建造了一个帝国。是时候重建这个帝国赖以建立的联合了。"
  pfp_merge_great_britain_northern_ireland_desc:0 "英国最持久的政治问题——爱尔兰的一角选择留在王冠之下，将岛屿一分为二，使邻居世代相争。无论其历史多么动荡，它俯瞰北海峡的位置使其在战略上与英国本土不可分割。"
  pfp_merge_iberia_desc:0 "从同一片烈日炙烤的半岛出发开启大航海时代的王国们，在托尔德西利亚斯条约中瓜分了世界。它们的数百年竞争是真实的，但它们的血脉渊源同样真实——同样的罗马大道连接里斯本与马德里，同样的大西洋风塑造了两顶王冠。作为伊比利亚统一起来，它们可以再次彰显旧伊比利亚世界的荣光。"
  pfp_merge_italy_desc:0 "自但丁写下对统一意大利的憧憬、马基雅维利梦想能够统一它的君主以来，这片半岛便一直抵制统一。罗马文明的分散继承者们——各自为自己的过去而骄傲，却各自缺少彼此而不完整——已经等待足够久了。复兴运动只是第一次尝试；现在可以将其完成。"
  pfp_merge_italy_sardinia_desc:0 "这座岛屿几经易手，先后属于阿拉贡、萨伏伊和哈布斯堡，最终成为萨伏伊王朝的名义驻地——正是这个王朝最终统一了意大利。其险峻的内陆和沿海阵地使其成为意大利掌控第勒尼安海的西方锚点。"
  pfp_merge_japan_desc:0 "神圣的本土岛屿自古代天皇时代起便是一个统一的国家。它们的分裂是一种反常，是对一个以统一为本质的民族的伤害。收复本土岛屿不仅仅是一个政治举动——它是国体，即国家本质本身的实现。"
  pfp_merge_russia_desc:0 "一个巨人的两个半体，被摧毁国家的同一灾难人为地割裂开来。从波罗的海海岸到太平洋，从北极冻原到高加索山麓——俄罗斯的土地本属一体。熊挺过来了。俄罗斯再次完整。"
  pfp_merge_western_russia_desc:0 "西部平原的大河——伏尔加河、顿河、第聂伯河——始终是俄罗斯文明的动脉，将自沙皇时代起便听命于同一权威的土地连为一体。这些领土从未真正是独立的国家；它们是破碎整体的碎片。"
  pfp_merge_western_russia_karelia_desc:0 "万湖之地与茂密森林，这片边疆地区是俄罗斯与北欧邻国数百年来争夺控制权之处。其森林与水道是大陆上防守最为激烈的地形之一；如今它们落入统一的俄罗斯权威之下，确保了通往列宁格勒的西北通道。"
  pfp_merge_western_russia_murmansk_desc:0 "俄罗斯唯一的不冻北极港，靠抵达这一纬度的墨西哥湾流尾部全年保持通航。谁掌握这座港口，谁就掌握北极门户——以及在每一场从北方考验俄罗斯的冲突中都证明了其战略价值的运输路线。"
  pfp_merge_western_russia_northern_caucasus_desc:0 "自叶尔莫洛夫残酷征伐以来，这里一直是俄罗斯扩张的动荡边疆——骄傲的山地民族从未轻易接受征服。然而其油田以及扼守黑海与里海之间陆桥的位置，使其在战略上过于重要，不能留在我们控制之外。"
  pfp_merge_illyria_desc:0 "从亚得里亚海岸延伸至迪纳拉山脉，这片土地在罗马时代被称为伊利里库姆——一个盛产勇士的行省，为帝国贡献了部分最精锐的军团和数位伟大的皇帝。克罗地亚与波斯尼亚-黑塞哥维那共享这份伊利里亚遗产：巍峨的山脉、绵长的海岸线，以及任何外来势力都未能彻底摧折的不屈独立精神。"
  pfp_merge_yugoslavia_desc:0 "从奥斯曼帝国和哈布斯堡帝国的废墟中雕刻而出，南斯拉夫各族人民——Južni Slaveni——因相信这片土地可以成为一体而长期被视为梦想家。如今梦想触手可及。兄弟情谊与统一——bratstvo i jedinstvo——将不仅仅是一句口号。"
  pfp_merge_yugoslavia_bosnia_herzegovina_desc:0 "山峦与宣礼塔的土地——波斯尼亚-黑塞哥维那位于天主教、东正教与伊斯兰世界的交汇处。在哈布斯堡统治下，它是多民族治理的实验；在南斯拉夫，它成为更多意义所在——南斯拉夫各民族无论信仰为何，皆能共同建设某种事业的生动证明。"
  pfp_merge_yugoslavia_croatia_desc:0 "克罗地亚拥有绵延亚得里亚海全线的海岸，以及在哈布斯堡王朝统治下管辖克罗地亚-斯拉沃尼亚的历史，它为南斯拉夫带来的远不止土地——还有行政传统、适合海军的海岸线，以及一个在数个世纪异国王朝统治下仍坚守南斯拉夫身份认同的民族。"
  pfp_merge_yugoslavia_macedonia_desc:0 "亚历山大大帝建立帝国之地，此后每一个巴尔干列强都视之为值得争夺的战利品。其处于半岛十字路口的位置——希腊、保加利亚、塞尔维亚和土耳其的野心在此世代交锋——使其成为主导南巴尔干的关键。"
  pfp_merge_yugoslavia_slovenia_desc:0 "阿尔卑斯山的谷地与亚得里亚海的海岸线——斯洛文尼亚紧凑的地理掩盖了其战略重要性。作为最西部的南斯拉夫土地，它长期是日耳曼世界与斯拉夫世界之间的门户。其人民与南方的兄弟们一道为独立而战；现在是将他们完全纳入的时候了。"
